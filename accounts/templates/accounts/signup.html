{% extends "base.html" %}
{% block title %}会員登録｜詐欺シミュ{% endblock %}
{% block content %}
<div class="wrap narrow"><h1 class="page-h">会員登録</h1>
  <p class="page-lead">会員にならなくても、すべての体験ができます。会員になると、体験の記録とテストの結果をマイページに残せます。</p>
  <form method="post" class="panel form-panel" novalidate>{% csrf_token %}{% include "_form.html" %}
    <p class="small text-secondary">パスワードは、そのままではなく、元に戻せない形（ハッシュ）にして保存します。本名・メールアドレス・住所などは聞きません。</p>
    <button type="submit" class="btn btn-main btn-lg">登録する</button></form>
  <p class="mt-3">すでに会員の方は <a href="{% url 'accounts:login' %}">ログイン</a></p></div>
{% endblock %}
