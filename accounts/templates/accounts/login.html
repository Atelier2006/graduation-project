{% extends "base.html" %}
{% block title %}ログイン｜詐欺シミュ{% endblock %}
{% block content %}
<div class="wrap narrow"><h1 class="page-h">ログイン</h1>
  <p class="page-lead">ログインすると、このブラウザでの今までの記録もマイページに引き継ぎます。</p>
  <form method="post" class="panel form-panel" novalidate>{% csrf_token %}{% include "_form.html" %}
    <input type="hidden" name="next" value="{{ next }}"><button type="submit" class="btn btn-main btn-lg">ログインする</button></form>
  <p class="mt-3">はじめての方は <a href="{% url 'accounts:signup' %}">会員登録</a>（会員にならなくても体験できます）</p>
  <p class="small text-secondary">パスワードを忘れたときは、先生やチームの管理者に伝えてください（この教材は、メールでの再設定をしていません）。</p></div>
{% endblock %}
