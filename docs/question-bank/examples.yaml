    url: https://scan.netsecurity.ne.jp/article/2025/10/29/53907.html
    published: 2025-10
  question_ideas:
  - 「登録完了・料金○万円・退会はこちら」の画面を見せ、正しい行動（連絡しない・払わない）を選ぶ問題
  - 「誤作動の方はこちら」を押して連絡するとどうなるかを考える問題
  - 本物の有料サービスの申し込み画面（料金を示して確認ボタン）と並べて比べる問題
- id: EX-073
  kind: scam
  title: SNSでライブチケットを「定価で譲ります」と言われ、先に送金したら連絡が取れなくなる
  situation: S12
  channels:
  - sns
  tactics:
  - T05
  - T07
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: 相手が身分証の画像まで送ってくるので信じやすいが、「知らない人への先払い」「決済アプリの警告」という確かめどころがある
  flow: |
    1. SNSで、人気アイドルのライブチケットを「定価で譲ります」という投稿を見つけ、DMでやり取りする
    2. 相手から運転免許証の画像が送られてきたので信用し、決済サービスのアプリで代金を送る（送金のときにアプリの警告メッセージが出ていた）
    3. 送金した後、相手と連絡が取れなくなる。同じ手口の被害者が複数いるようだった
  features:
  - 手に入りにくいチケットを定価で譲るという投稿
  - 身分証の画像を送って信用させる
  - 見知らぬ相手への先払い
  - 逆に、譲る側が「振り込んだ」という画像を信じて電子チケットのログイン情報を教えたが、入金されていなかった例もある
  - 取引の相手がSNSの個人アカウントで、身元が分からない
  red_flags:
  - 公式の販売サイトではない、見知らぬ人との個人間の取引
  - 送金のときに決済アプリが警告を出している
  - チケットを受け取る前に代金を払うよう言われる
  right_action: チケットは公式の販売サイトなど正規のルートで買う。SNSで知り合った相手に先にお金を送らない。決済アプリが警告を出したら送金をやめる。困ったときは消費者ホットライン188に相談する。
  legit_contrast: 国民生活センターは、チケットは公式の販売サイトなど正規のルートから購入するよう助言している。主催者などが用意する公式のリセールサービスがあり、国民生活センターはチケットを譲りたい人にもその利用をすすめている。対象となる公演の入場券を利益目的で不正に転売すると、法律で罰せられることがある。
  trend: 2026年10月に国民生活センターがこの手口の注意を呼びかけた。2022年の公表でも、SNSで知り合った相手に代金を振り込んだ後に連絡が取れなくなる例が紹介され、若い世代の相談が中心とされていた。
  sources:
  - publisher: 国民生活センター
    title: チケットのSNSでの個人間取引や転売仲介サイトのトラブルに関する注意喚起（題名未確認）
    url: https://www.kokusen.go.jp/news/data/n-20261006_1.html
    published: 2026-10
  - publisher: 国民生活センター
    title: “推し”に会えない!?転売チケットの購入トラブルが急増中
    url: https://www.kokusen.go.jp/news/data/n-20220804_2.html
    published: 2022-08
  - publisher: 埼玉県
    title: チケットの個人間取引に関する相談事例（題名未確認）
    url: https://www.pref.saitama.lg.jp/b0304/shohisoudan/jirei/manabu_asobu/20230825.html
  question_ideas:
  - SNSの「定価で譲ります」投稿とDM（免許証の画像つきで、決済アプリでの先払いを求める）の危ない点を選ぶ問題
  - 行動問題：決済アプリで送金しようとしたら警告が表示された → 送金をやめて公式の販売ルートを探す
  - 公式リセールの画面と、SNSでの個人間の譲渡を並べ、安全なのはどちらかを選ぶ問題
- id: EX-074
  kind: scam
  title: 検索結果の広告に出る転売仲介サイトを、公式の販売サイトと思い込んで買うチケットのトラブル
  situation: S12
  channels:
  - ad
  - web
  tactics:
  - T04
  targets:
  - 学生
  - 社会人
  level: hard
  level_reason: 検索結果の上の方に広告として表示され、公式サイトと見分けにくい。運営者や販売の形を確かめる行動が必要
  flow: |
    1. ライブやスポーツのチケットを検索すると、結果の上の方に転売仲介サイトの広告が表示される
    2. 公式の販売サイトだと思い込んで購入する。残り枚数やカウントダウンの表示で購入を急かされる
    3. 定価より高額だったり、個人の出品者から買ったチケットを受け取れず観戦できなかったりする
  features:
  - 転売仲介サイトであることが分かりにくい表示
  - 残り枚数やカウントダウンの表示で急がせる
  red_flags:
  - 検索広告からたどり着いたサイトで、公演やチームの公式サイトからのリンクではない
  - 定価より高い値段
  right_action: 公演やチームの公式サイトで案内されている販売サイトなど、正規のルートで購入する。広告で出てきたサイトは、公式かどうかと運営者を確かめてから使う。
  legit_contrast: 国民生活センターは、チケットは公式の販売サイトなど正規のルートから購入するよう助言している。
  trend: 2022年の公表では若い世代の相談が中心とされた。2026年10月の注意喚起でも、転売仲介サイトで個人の出品者から高額な野球チケットを買ったが受け取れず観戦できなかった例が紹介された。
  sources:
  - publisher: 国民生活センター
    title: “推し”に会えない!?転売チケットの購入トラブルが急増中
    url: https://www.kokusen.go.jp/news/data/n-20220804_2.html
    published: 2022-08
  - publisher: 国民生活センター
    title: チケットのSNSでの個人間取引や転売仲介サイトのトラブルに関する注意喚起（題名未確認）
    url: https://www.kokusen.go.jp/news/data/n-20261006_1.html
    published: 2026-10
  question_ideas:
  - 検索結果の画面（上に「広告」表示の転売仲介サイト、下に公式の販売サイト）から正しい購入先を選ぶ問題
  - 「残り2枚」「あと5分」と表示される販売画面で、どこに注意するかを答える問題
- id: EX-075
  kind: legit
  title: 推し活のチケットやオンラインくじの賞品は、公式・正規のルートで買う
  situation: S12
  channels:
  - web
  - ad
  tactics:
  - T04
  - T07
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: 広告や転売の画面は公式に見えることがあり、「正規のルートかどうか」を確かめる必要がある
  flow: |
    1. チケットは、公式の販売サイトなど正規のルートから買う
    2. 検索結果の上の方に出る広告のサイトが公式とは限らない（転売仲介サイトの広告を公式と思い込む例がある）
    3. オンラインくじの賞品も、運営するゲーム会社は正規のルートでの購入を呼びかけ、非正規品は交換や返金などの保証をしないとしている
  features:
  - 公式の販売サイト・正規の販売ルートからの購入である
  - 非正規のルートで買った賞品は、運営会社の交換・返金などの保証の対象外
  red_flags:
  - 検索広告やSNSからたどり着いた、公式かどうか分からない販売ページ
  - 見知らぬ人との個人間の先払いの取引
  right_action: 公演や作品の公式サイトから販売ページをたどる。広告やSNSで見つけた販売ページは、公式かどうかを確かめてから使う。
  legit_contrast: 転売仲介サイトは、仲介サイトであることが分かりにくい表示や、残り枚数・カウントダウンの表示で購入を急がせることがある。
  sources:
  - publisher: 国民生活センター
    title: チケットのSNSでの個人間取引や転売仲介サイトのトラブルに関する注意喚起（題名未確認）
