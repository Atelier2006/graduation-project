    url: https://scan.netsecurity.ne.jp/article/2023/09/29/50009.html
    published: 2023-09
  - publisher: 国民生活センター
    title: サポート詐欺に関する報道発表資料（題名は要約）
    url: https://www.kokusen.go.jp/news/data/n-20240327_1.html
    published: 2024-03
  question_ideas:
  - 普通の商品広告と、クリック後に出た偽警告の2画面を並べ、「広告の会社に電話する」などの選択肢から正しい行動を選ぶ問題
  - 「さっき同じ広告を押したときは普通のページだった」という会話から、不正広告の特徴を考える問題
- id: EX-067
  kind: scam
  title: 「ロボットではありません」の確認を装う偽のCAPTCHA画面
  situation: S11
  channels:
  - web
  - ad
  - email
  tactics:
  - T01
  - T10
  targets:
  - 全世代
  level: normal
  level_reason: 見た目は本物の確認画面とそっくりだが、「キー操作で貼り付けて実行」を求める点で見抜ける
  flow: |
    1. メールや広告のリンク、検索結果から開いたページで、「ロボットではないことを確認します」という画面が出る
    2. チェックを入れると、「確認を完了するには」として、キーボードで決まった操作をして何かを貼り付けて実行するよう、番号付きの手順が表示される
    3. 指示どおりにすると、パソコンに不正なプログラムが入り、ログイン情報などを盗まれるおそれがある
  features:
  - 本物の確認画面のようなチェックボックスやマークが表示される
  - 手順が番号付きで示され、簡単な作業のように見せる
  - 怪しいメールや広告のリンク先で突然出る
  red_flags:
  - 確認のために、キーボード操作での「貼り付け・実行」をさせようとする
  - 確認のためにファイルのダウンロードを求める
  - 本物の確認画面ならページの中のチェックや画像選びだけで終わるのに、ページの外での操作を求める
  right_action: メールや広告のリンク先で突然出た確認画面は、クリックせずに閉じる。画面に書かれた操作やコマンドは実行しない（警視庁の案内）。
  legit_contrast: 本物のCAPTCHAは、チェックボックスに印を付けたり、簡単なパズルや画像選びをしたりするだけで、ファイルのダウンロードやコマンドの貼り付けは求めない（セキュリティ企業の解説）。
  trend: 宮城県警察は2025年2月に、CAPTCHAによく似た画面で利用者に不正な操作をさせる手口が確認されているとして注意を呼びかけた。警視庁も2025年9月に、CAPTCHA画面に見せかけて不正なプログラムを入れさせる手口が増えているとして注意喚起した。セキュリティ企業も、メールや不正広告、検索結果の悪用（SEOポイズニング）から偽のCAPTCHAに誘導する攻撃を報告している。
  sources:
  - publisher: INTERNET Watch（警視庁の注意喚起の報道）
    title: 警視庁、偽のCAPTCHA画面でマルウェアを入れさせる手口に注意喚起（題名は要約）
