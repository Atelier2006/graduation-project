    url: https://www.shouhiseikatu.metro.tokyo.lg.jp/sodan/kinkyu/documents/190529_1.pdf
    published: 2019-05
  - publisher: 富山県
    title: 宅配業者を名乗る不審なSMSに関する資料（題名未確認）
    url: https://www.pref.toyama.jp/documents/10901/file211.pdf
  question_ideas:
  - 「不在のため持ち帰りました。こちらから確認」というリンクつきSMSと、公式アプリから確かめる正しい行動を選ぶ問題
  - ○×問題：「SMSで集配を案内していないと公表している宅配業者がある」（○）
- id: EX-012
  kind: scam
  title: クレジットカード会社をかたる「ご利用制限のお知らせ」
  situation: S03
  channels:
  - email
  - sms
  tactics:
  - T01
  - T04
  - T06
  targets:
  - 全世代
  level: normal
  level_reason: カードが止まるという不安をあおる典型的な形で見抜くポイントはあるが、件名や文面は実在のカード会社の通知に似せてある
  flow: |
    1. クレジットカード会社やカードの国際ブランドを名乗るメールやSMSが届き、「【重要】カードのご利用制限のお知らせ」などと、カードが使えなくなったかのように伝える
    2. 本文のリンクから確認や手続きをするよう促し、偽サイトへ誘導する
    3. 偽サイトでカード番号などのカード情報やログイン情報を入力させる
  features:
  - 件名に【重要】を付け、「ご利用制限」のようにカードが止まるかのように知らせる
  - 報告された件名には、「カード」の文字を形の似た漢字（「力」と「一」）で書いたものもあった
  - メールだけでなく、カード会社をかたるSMSも多発している（2026年6月）
  red_flags:
  - 件名や本文に、形の似た別の文字が混じっている
  - リンクからカード番号などを入力させようとする
  - リンク先のドメインがカード会社の公式と違う
  right_action: リンクは開かず、カード会社の公式アプリや自分でブックマークした会員サイトから、利用状況やお知らせを確かめる。カード情報を入力してしまったら、すぐにカード会社に連絡する。
  legit_contrast: 本物かどうかは、カード会社の公式アプリや会員サイトに自分でログインし、同じお知らせや利用制限の表示があるかで確かめる。
  trend: 2025年にかたられたブランドはクレジットカード・信販系が37ブランドで最も多かった。2026年7月の報告でもカード会社をかたるものが3番目に多く、2026年6月にはカード会社をかたるSMSも多発した
  sources:
  - publisher: ScanNetSecurity
    title: 国内 ISP の認証情報を不正利用して送信されたフィッシングメールに注意呼びかけ
    url: https://scan.netsecurity.ne.jp/article/2026/07/06/55635.html
    published: 2026-07
  - publisher: ScanNetSecurity
    title: DMARC 通過する独自ドメインフィッシング急増 ~ フィッシング対策協議会「フィッシングレポート2026」
    url: https://scan.netsecurity.ne.jp/article/2026/06/11/55466.html
    published: 2026-06
  - publisher: ScanNetSecurity
    title: 2026年7月のフィッシング報告状況、Amazon をかたるフィッシングが急増
    url: https://scan.netsecurity.ne.jp/article/2026/08/27/56042.html
    published: 2026-08
  - publisher: トビラシステムズ（PR TIMES）
    title: トビラシステムズ 特殊詐欺・フィッシング詐欺に関するレポート(2026年6月)
    url: https://prtimes.jp/main/html/rd/p/000000247.000034282.html
    published: 2026-07
  question_ideas:
  - 件名の「カード」が形の似た漢字になっていることに気づく問題
  - 本物のカード会社アプリの通知と並べて、リンクの有無や入力を求める内容を比べる問題
  - 行動問題：入力してしまった後に最初にすること（カード会社に連絡）
- id: EX-013
  kind: scam
  title: 銀行をかたる「ポイント付与」「キャンペーン参加」の案内メール
  situation: S03
  channels:
  - email
  tactics:
  - T01
  - T05
  - T06
  targets:
  - 社会人
  - 高齢者
  level: normal
  level_reason: 脅すのではなく得をする案内なので警戒されにくい。見抜くポイントは「メールのリンクからログインさせる」点に限られる
  flow: |
    1. 銀行を名乗るメールが届き、ポイントがもらえる、キャンペーンに参加できる、などと案内する
    2. 参加や受け取りの手続きとして、本文のリンクから銀行のログイン画面に似せた偽サイトへ誘導する
    3. 偽サイトでログインIDやパスワードなどを入力させる
  features:
  - ポイント付与やキャンペーン参加など、受け取る側が得をする内容
  - 同じ銀行は、補助金・還付金・給付金に関係する詐欺にも注意するよう呼びかけている
  - 地方銀行やネット銀行を装う事例が増えているという民間の調査もある
  red_flags:
  - 得をする話なのに、メールのリンクからログインさせようとする
  - リンク先のドメインが銀行の公式と違う
  right_action: リンクは開かず、銀行の公式アプリやブックマークした公式サイトにログインして、そのキャンペーンが本当にあるか確かめる。
  legit_contrast: 銀行は公式サイトのお知らせで、実際に確認されたフィッシングメールの内容を公開して注意を呼びかけている。キャンペーンの有無も、公式サイトや公式アプリで自分で確かめられる。
  trend: 2025年7月に銀行がこの種のフィッシングメールへの注意を呼びかけた。2025年にかたられたブランドのうち、金融系は36ブランドにのぼった
  sources:
  - publisher: 楽天銀行
    title: （ページ名未確認）ポイント付与やキャンペーン参加を促すフィッシングメールへの注意のお知らせ
    url: https://www.rakuten-bank.co.jp/info/2025/250730.html
    published: 2025-07
  - publisher: ECのミカタ
    title: ネット詐欺、「QR決済利用」「地方銀行・ネット銀行を装う」事例が増加 BBSS調査
    url: https://ecnomikata.com/ecnews/50909/
  - publisher: ScanNetSecurity
    title: DMARC 通過する独自ドメインフィッシング急増 ~ フィッシング対策協議会「フィッシングレポート2026」
    url: https://scan.netsecurity.ne.jp/article/2026/06/11/55466.html
    published: 2026-06
  question_ideas:
  - 「ポイントがもらえる」という得をする案内でも、リンクからログインさせる点が危ないと気づく問題
  - 本物の銀行アプリのキャンペーン画面と、メールのリンク先を比べる問題
- id: EX-014
  kind: scam
  title: 架空の料金請求SMSから、コード決済アプリの送金画面へ誘導する手口
  situation: S03
  channels:
  - sms
  tactics:
  - T01
  - T04
  - T07
  targets:
  - 全世代
  level: normal
  level_reason: SMSの文面は「料金の未納」という典型的な形だが、誘導先は本物の決済アプリの送金画面なので、画面の見た目では偽物と気づけない。自分で送金するため多要素認証でも防げない
  flow: |
    1. 携帯料金や税金、クレジットカードの料金が未納だとするSMSが届く
    2. 本文のリンクをタップすると、スマホのコード決済アプリが開き、相手に送金する画面が表示される
    3. 支払いのつもりで数回タップすると、そのまま相手に送金してしまう
  features:
  - 「料金の支払い」が名目なのに、開くのはアプリの「送金」の画面
  - 送金画面そのものは本物の決済アプリなので、見た目に不審な点がない
  - 名目は携帯料金・税金から、クレジットカードなど身近なものへ広がっている
  red_flags:
  - 料金や税金の支払いなのに、アプリの送金機能で払わせようとする
  - SMSのリンクを押すと決済アプリが開き、送金の画面が出る
  right_action: 心当たりのない請求SMSのリンクは開かない。送金画面が出ても「送る」を押さず、請求の内容は契約している会社や役所の公式サイト・公式アプリで確かめる。送ってしまったら、すぐに決済サービスと警察・消費生活センターに相談する。
  legit_contrast: 料金や税金の支払いは、自治体の公式サイトや届いた納付書など公式のルートで確かめる。SMSのリンクから送金で払わせる請求は本物ではないと考える。
  trend: 2026年2月ごろから増え、5月末までに確認されたSMSの件数は2月の22.4倍になった（民間調査）。2026年5月には国民生活センターにも、税金の未納を名乗るメールからコード決済で送金させられた相談が寄せられた
  sources:
  - publisher: トビラシステムズ（PR TIMES）
    title: トビラシステムズ 特殊詐欺・フィッシング詐欺に関するレポート(2026年4月)
    url: https://prtimes.jp/main/html/rd/p/000000232.000034282.html
  - publisher: トビラシステムズ（PR TIMES）
    title: トビラシステムズ 特殊詐欺・フィッシング詐欺に関するレポート(2026年5月)
    url: https://prtimes.jp/main/html/rd/p/000000235.000034282.html
  - publisher: ECのミカタ
    title: ネット詐欺、「QR決済利用」「地方銀行・ネット銀行を装う」事例が増加 BBSS調査
    url: https://ecnomikata.com/ecnews/50909/
  - publisher: 国民生活センター
    title: （ページ名未確認）国税庁やe-Taxをかたる不審なSMSやメールに関する注意喚起
    url: https://www.kokusen.go.jp/news/data/n-20260527_1.html
    published: 2026-05
  question_ideas:
  - 本物の送金画面が出たあとで「送らない」を選べるかを問う問題（hard寄り）
  - 「料金の支払い」と「個人への送金」の違いに気づく問題
  - 行動問題：送ってしまった後の連絡先を選ぶ
- id: EX-015
  kind: scam
  title: 警察官や銀行協会の職員を名乗り、キャッシュカードをすり替える「キャッシュカード詐欺盗」
  situation: S03
  channels:
  - chat
  tactics:
  - T13
  - T01
  - T04
  - T06
  targets:
  - 高齢者
  level: normal
  level_reason: 警察や金融機関を名乗る電話と訪問で信用させるが、「カードを預かる」「暗証番号を聞く」ことは本物は絶対にしないと知っていれば見抜ける
  flow: |
    1. 警察官などを名乗る電話で「あなたの口座が悪用されている」「キャッシュカードの交換（確認）が必要」などと言われる
    2. 「確認に行く」と言って、警察官や銀行協会の職員を名乗る人物が自宅に来る
    3. キャッシュカードと暗証番号を書いた紙を封筒に入れるよう言われ、印鑑を取りに行くなど目を離したすきに、別の封筒とすり替えられる
    4. 「新しいカードが届くまで封筒を開けずに保管して」などと言われ、気づかないうちに預金を引き出される
  features:
  - 電話のあと、すぐに自宅への訪問がある
  - 封筒を使い、「開けずに保管して」と言う
  - その場から離れさせようとする
  - カードの交換を名目に、カードや通帳そのものを持ち帰る型（預貯金詐欺）もある
  red_flags:
  - 警察官や銀行の職員が暗証番号を聞く、紙に書かせる
  - 自宅でキャッシュカードを預かろうとする
  - 「カードを封筒に入れて保管して」と言う
  right_action: 暗証番号は誰にも教えず、キャッシュカードや通帳を渡さない。電話でカードや暗証番号の話が出たら切って、家族や「#9110」、取引のある金融機関の公式の窓口に相談する。
  legit_contrast: 警察や公的機関の職員、銀行員が、キャッシュカードを預かったり暗証番号を聞いたりすることはない（埼玉県・金融庁などの注意喚起）。
  trend: 2026年7月末の暫定値では、キャッシュカード詐欺盗は908件で、前年同期より30.3%増えている（警察庁）。
  sources:
  - publisher: 警視庁
    title: 特殊詐欺の手口
    url: https://www.keishicho.metro.tokyo.lg.jp/kurashi/tokushu/furikome/furikome.html
  - publisher: 埼玉県
    title: キャッシュカード詐欺盗(すり替え型)の手口
    url: https://www.pref.saitama.lg.jp/a0311/hurikomesagi/cashcardsagi-teguchi.html
  - publisher: 金融庁
    title: （ページ名未確認）キャッシュカードをだまし取る手口への注意
    url: https://www.fsa.go.jp/ordinary/cashcard_theft.html
  - publisher: 警察庁
    title: 令和8年7月末における特殊詐欺の認知・検挙状況等について（暫定値）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/260904/01.html
    published: 2026-09
  - publisher: ScanNetSecurity
    title: 被害額2,108億円 前年同期比+632億円 ~ 令和8(2026)年7月末における特殊詐欺の認知検挙状況
    url: https://scan.netsecurity.ne.jp/article/2026/09/10/56183.html
    published: 2026-09
  question_ideas:
  - 「新しいカードが届くまで、この封筒にカードと暗証番号のメモを入れて保管して」と言われる場面を見せ、詐欺のサインを選ぶ
  - 本物の金融機関の案内（暗証番号は聞かない）と並べて比べる問題
- id: EX-016
  kind: scam
  title: 「低金利・保証人不要で融資」と誘い、先に保証金を払わせる融資保証金詐欺
  situation: S03
  channels:
  - sms
  - email
  - chat
  tactics:
  - T01
  - T05
  - T07
  - T08
  targets:
  - 社会人
  level: normal
  level_reason: お金に困っている人には魅力的な条件で、実在の業者を名乗ることもあるが、「融資の前にお金を払わせる」点に気づけば見抜ける
  flow: |
    1. 「無担保・低金利・保証人不要で融資可能」などと書かれたはがきやSMS、メールが届く
    2. 書かれた連絡先に申し込むと、「まず保証金が必要」「保証金は融資のときに返す」などと言われ、保証金・審査料などの名目で振込を求められる
    3. 払うと「登録でエラーが出た」などの理由で追加の支払いを求められ、結局お金は借りられない
  features:
  - 突然、好条件の融資の案内が届く
  - 実在の業者を名乗ることがある
  - 「融資のときに返す」と安心させる
  - 一度払うと、別の名目で何度も支払いを求めてくる
  red_flags:
  - 融資を受ける前にお金を払うよう求められる
  - 案内に書かれた連絡先にしか問い合わせられない
  right_action: 融資の前にお金を払う話には応じない。業者が貸金業の登録を受けているかを金融庁のサイトで確かめ、問い合わせ先は届いた案内ではなく自分で調べる。家族や消費生活センター、警察に相談する。
  legit_contrast: 正規の貸金業者は、保証金などどんな名目でも、融資を前提に先にお金を振り込ませることはない。貸金業者は登録制で、登録の有無は金融庁のサイトで確かめられる（警察・自治体の注意喚起）。
  sources:
  - publisher: 警視庁
    title: 特殊詐欺の手口
    url: https://www.keishicho.metro.tokyo.lg.jp/kurashi/tokushu/furikome/furikome.html
  - publisher: 大阪府警察
    title: （ページ名未確認）融資保証金詐欺への注意
    url: https://www.police.pref.osaka.lg.jp/seikatsu/tokusyusagi/6640.html
  - publisher: 岡山市
    title: （ページ名未確認）融資保証金詐欺への注意
    url: https://www.city.okayama.jp/kurashi/0000016801.html
  - publisher: 楽天銀行
    title: （ページ名未確認）融資をかたる詐欺への注意
    url: https://www.rakuten-bank.co.jp/security/crime/loan-fraud.html
  question_ideas:
  - 「審査に通りました。融資の前に保証金を振り込んでください」というメッセージを見せ、詐欺のサインを選ぶ
  - 行動問題：融資の案内が届いたとき、まず確かめること（貸金業の登録・自分で調べた連絡先）を選ぶ
- id: EX-017
  kind: scam
  title: 送信元の認証を通過して受信箱に届くフィッシング（独自ドメイン・乗っ取られた正規のメールアカウント）
  situation: S03
  channels:
  - email
  tactics:
  - T01
  - T03
  - T06
  targets:
  - 全世代
  level: hard
  level_reason: 送信元の認証（DMARCなど）に合格し、迷惑メールのフィルターをすり抜けて通常の受信箱に届く。「認証に合格＝本物」ではないため、見た目では区別しにくい
  flow: |
    1. カードの利用制限や荷物の配送トラブルを知らせるメールが、迷惑メールフォルダではなく通常の受信箱に届く
    2. 差出人は本物のサービスとは別のドメインや、見知らぬ人のプロバイダのメールアドレスだが、送信元の認証には合格している
    3. 本文のリンクから偽サイトへ誘導し、カード情報やログイン情報を入力させる
  features:
  - 迷惑メールとして振り分けられず、普通のメールと同じように受信箱に入る
  - 差出人のドメインは本物のサービスのものではない（独自のドメイン、または国内プロバイダの利用者のアドレス）
  - 件名は「【重要】カードのご利用制限のお知らせ」「お荷物の配送に問題が発生しました」など（2026年6月）
  - リンクが有名な翻訳サービスのURLから始まり、そこから偽サイトへ転送される例もある（2025年7月）
  red_flags:
  - 差出人のドメインがサービスの公式ドメインと一致しない
  - 企業からの連絡なのに、個人のプロバイダのアドレスから届いている
  - 「受信箱に届いた」「認証に合格した」ことは本物の証拠にならない
  right_action: 受信箱に届いたかどうかで判断しない。リンクは開かず、公式アプリやブックマークから確かめる。自分がそのプロバイダのメールを使っている場合は、パスワードを変えて乗っ取りを防ぐ。
  legit_contrast: 送信元の認証は「そのドメインから正しく送られた」ことを示すだけで、送り主が名乗っている会社であることまでは保証しない。本物かどうかは、差出人のドメインが公式のものと一致するかに加え、公式アプリやブックマークから確かめる。
  trend: フィッシングレポート2026（2026年6月公開）で、DMARCを通過する独自ドメインのフィッシングの急増が指摘された。2026年6月には国内プロバイダの認証情報を不正利用したとみられるフィッシングメールについて緊急情報が出され、2026年9月にも企業のメールドメインの認証情報が悪用され約1,800通の不審メールが送られた事例が報じられた
  sources:
  - publisher: ScanNetSecurity
    title: DMARC 通過する独自ドメインフィッシング急増 ~ フィッシング対策協議会「フィッシングレポート2026」
    url: https://scan.netsecurity.ne.jp/article/2026/06/11/55466.html
    published: 2026-06
  - publisher: ScanNetSecurity
    title: 国内 ISP の認証情報を不正利用して送信されたフィッシングメールに注意呼びかけ
    url: https://scan.netsecurity.ne.jp/article/2026/07/06/55635.html
    published: 2026-07
  - publisher: ScanNetSecurity
    title: PCデポのメールドメインの認証情報を不正利用、約1,800通の不審メールを送信
    url: https://scan.netsecurity.ne.jp/article/2026/09/28/56316.html
    published: 2026-09
  - publisher: ScanNetSecurity
    title: 2025年7月のフィッシング報告状況、証券会社をかたるフィッシングメールの配信が再び増加
    url: https://scan.netsecurity.ne.jp/article/2025/08/28/53521.html
    published: 2025-08
  question_ideas:
  - 受信箱に普通に届いたメールでも、差出人のドメインとリンク先を確かめる問題（hard）
  - 企業を名乗っているのに差出人が個人のプロバイダのアドレスである点に気づく問題（normal）
- id: EX-018
  kind: scam
  title: 本物そっくりのログイン画面に入れたパスワードやワンタイムパスワードがその場で悪用される（リアルタイムフィッシング）
  situation: S03
  channels:
  - web
  - email
  - sms
  tactics:
  - T01
  - T02
  - T04
  - T06
  targets:
  - 社会人
  - 全世代
  level: hard
  level_reason: ログイン画面も追加認証の流れも本物と同じで、正規に似たドメインも多く、見た目だけでは区別が非常に難しい。開いた経路で判断する必要がある
  flow: |
    1. 銀行などを名乗るメールやSMSが、「不正アクセス」「個人情報の確認」「取引の停止」などの言葉で不安をあおり、リンクを開かせる
    2. 本物そっくりのログイン画面で、IDとパスワードを入力させる
    3. 続けてワンタイムパスワードなどの追加の認証コードを入力させる
    4. 入力された情報はすぐに本物のサイトで使われ、不正ログインや不正送金が行われる
  features:
  - 入力した情報がその場で使われるため、ワンタイムパスワードを使っていても破られる
  - 正規のサイトに似たドメインを使い、見た目で判断するのが非常に難しい
  - 不安をあおる言葉で、すぐにログインさせようとする
  red_flags:
  - メールやSMSのリンクからログイン画面を開いている
  - 画面のURL（ドメイン）が公式のものと違う
  - リンク先のページでワンタイムパスワードの入力まで求められる
  right_action: メールやSMSのリンクからはログインしない。公式アプリや、あらかじめ登録したブックマークから開いて確かめる。入力してしまった場合は、すぐに金融機関に連絡してパスワードを変え、警察にも相談する。
  legit_contrast: 金融機関がSMSなどでIDやパスワードを問い合わせることはない。お知らせの確認は、金融機関の公式サイトや公式アプリで行う。
  trend: 2025年のインターネットバンキングの不正送金被害額は約104億円で、前年（約86.9億円）より増えた。フィッシングの報告件数も2025年は約245万件と増え続けている。2025年は証券会社を装った偽サイトで盗まれたログイン情報による不正アクセス・不正取引も急増し、金融庁が注意を呼びかけている（2025年10月の不正取引は333件）。
  sources:
  - publisher: ペイメントナビ（フィッシング対策協議会の解説を紹介）
    title: 不正送金被害の爆発的増加にフィッシング対策協議会が警鐘 リアルタイムフィッシングなど巧妙化する手口から身を守れ
    url: https://paymentnavi.com/?p=144363
    published: 2024-04
  - publisher: ScanNetSecurity（警察庁・金融庁の注意喚起の報道）
    title: フィッシングによるインターネットバンキングへの不正送金被害が急増、「不正アクセス」「個人情報の確認」「取引の停止」等のワードに注意呼びかけ
    url: https://scan.netsecurity.ne.jp/article/2023/12/29/50419.html
    published: 2023-12
  - publisher: 金融庁
    title: インターネットバンキングの不正送金に関する注意喚起資料（題名は要約）
    url: https://www.fsa.go.jp/ordinary/internet-bank_2/10.pdf
