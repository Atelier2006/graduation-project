- id: EX-019
  kind: legit
  title: 銀行はメールやSMSで暗証番号やログイン情報の入力を求めない
  situation: S03
  channels:
  - email
  - sms
  tactics:
  - T01
  - T03
  - T06
  targets:
  - 全世代
  level: easy
  level_reason: 多くの銀行が明記しており、注意喚起も多い
  flow: |
    1. 銀行は、暗証番号などの入力をお願いするメールやSMSを送らないと明記している（SMSでログイン情報・パスワード・暗証番号の入力を求めないと書く銀行もある）
    2. 差出人が銀行名になっていても、不審な内容なら開かず、返信せずに削除する
    3. ログインは、メールやSMSのリンクではなく、公式アプリや公式サイトなど信頼できる入口から行う
  features:
  - 本物のお知らせでも、メールやSMSで暗証番号やワンタイムパスワードを入力させることはない
  red_flags:
  - メールやSMSのリンク先で、ID・暗証番号・ワンタイムパスワード・乱数表の数字などの入力を求める
  - 差出人の表示だけが銀行名になっている
  right_action: メールやSMSのリンクは開かない。気になるときは、公式アプリや公式サイトから自分でログインして確かめるか、公式サイトに載っている銀行の問い合わせ窓口に連絡する。
  legit_contrast: 偽のメールやSMSは、銀行を名乗って偽のログインサイトに誘い、IDやパスワード、ワンタイムパスワードを盗もうとする（金融庁の注意喚起）。
  sources:
  - publisher: 福島銀行
    title: 銀行をかたる不審なメール・SMSへの注意のお知らせ（題名未確認）
    url: https://www.fukushimabank.co.jp/top/oshirase/20250908-001.pdf
    published: 2025-09
  - publisher: ドコモSMTBネット銀行
    title: フィッシング詐欺への注意のページ（題名未確認）
    url: https://www.netbk.co.jp/contents/security/measures/phishing.html
