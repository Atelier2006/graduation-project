  - 災害直後のSNS投稿（個人への送金や電子マネーを求める）と、自治体の公式な義援金募集ページを比べる問題
  - 「市役所の者ですが、義援金を集めています」という電話の場面で、正しい行動を選ぶ問題
- id: EX-088
  kind: legit
  title: 義援金・募金を正しい窓口に届けるための確かめ方
  situation: S18
  channels:
  - web
  - sns
  tactics:
  - T01
  - T07
  targets:
  - 全世代
  level: normal
  level_reason: 偽の呼びかけはSNSで広がりやすく、発信元や振込先を自分で確かめる行動が必要
  flow: |
    1. 寄付したい自治体や団体の公式サイトで、義援金の受付窓口と振込先を確かめる
    2. 振込先の口座・名義が、公式サイトや報道で公表されているものと一致するかを確かめる
    3. SNSやメールで見た呼びかけは、発信元を確かめ、ほかの情報源と比べてから判断する
  features:
  - 自治体や公的な団体の義援金は、公式サイトで募集の窓口や振込先が公表されている
  - 自治体の職員が、家庭に電話・訪問・メールなどで義援金の振込を求めることはない
  red_flags:
  - 振込先の口座・名義が、公式に公表されているものと違う
  - 電話や訪問で、直接寄付を求められる
  - SNSやメールの呼びかけから、団体のサイトに似せた別のサイトへ誘導される
  right_action: 迷ったら、寄付先の自治体や団体に、自分で調べた公式の連絡先で直接確かめる。不審な電話や訪問は断り、警察相談専用電話（#9110）や消費者ホットライン188に相談する。
  legit_contrast: 静岡県は、公的機関が義援金や支援物資を電話や訪問で求めることはないとしている。大阪府は、府の職員が一般の家庭に訪問・電話・メールなどで義援金の振込を求めることはないとしている。
  sources:
