    published: 2025-06
  question_ideas:
  - スマホの着信画面（「+1」から始まり末尾が0110の番号）を見せ、出るべきか・どうするかを選ぶ問題
  - 比較問題：「0」から始まる国内番号と「+」から始まる国際電話番号の着信画面を並べて見分ける
  - 難しい版：実在の警察署の番号が表示された着信でも、かけ直して確かめる理由を問う
- id: EX-035
  kind: scam
  title: SMSの送信元名を偽り、本物の連絡と同じスレッドに紛れ込むSMS
  situation: S05
  channels:
  - sms
  tactics:
  - T01
  - T02
  - T03
  - T06
  targets:
  - 全世代
  level: hard
  level_reason: スマホのメッセージアプリは送信元の名前でメッセージをまとめるため、偽のSMSが本物の企業の過去のメッセージと同じ画面に並び、送信元名では見分けられない
  flow: |
    1. 携帯電話会社などの企業名を送信元に表示したSMSが届く
    2. メッセージアプリでは、以前に届いた本物のメッセージと同じスレッドに表示される
    3. 本文のURLから公式サイトに似せた偽サイトへ誘導し、携帯電話番号やパスワードの入力や、不審なアプリのインストールをさせる
  features:
  - 送信元に企業名が表示される。企業名と1文字だけ違う名前を使う例もある
  - 本文のURLは公式サイトのURLに似せてある
  - 本物の過去のメッセージのすぐ下に偽のメッセージが続く
  red_flags:
  - 同じスレッドにあっても、URLのドメインが公式と違う
  - URLを開く、記載の番号に電話する、返信する、のいずれかを求める
  right_action: 送信元名や同じスレッドに表示されていることを根拠に信じない。URLは開かず、電話もかけず、返信もしない。公式アプリやブックマークした公式サイトから確かめる。海外から送られるSMSを拒否する設定もできる（ただし、ワンタイムパスワードなどの認証用SMSが受け取れなくなる場合がある）。
  legit_contrast: 本物かどうかは、送信元名やスレッドではなく、公式アプリや自分で開いた公式サイトで確かめる。
  trend: 2025年5月、国が都市部での偽の基地局による混信（圏外になる、不審なSMSが届くなど）について注意を呼びかけ、携帯電話会社各社もお知らせを出した
  sources:
  - publisher: INTERNET Watch
    title: 意外と知らない? ネットセキュリティの基礎知識
    url: https://internet.watch.impress.co.jp/docs/column/security_basic/1240344.html
  - publisher: ソフトバンク
    title: （ページ名未確認）当社を装ったフィッシングSMSに関する注意喚起
    url: https://www.softbank.jp/mobile/info/personal/news/support/20200304a/
    published: 2020-03
  - publisher: ScanNetSecurity
    title: 「偽基地局」からの携帯電話サービスへの混信について注意を呼びかけ
    url: https://scan.netsecurity.ne.jp/article/2025/05/06/52793.html
    published: 2025-05
  - publisher: ScanNetSecurity
    title: 不法無線局によるものと疑われる携帯電話サービスへの混信について注意呼びかけ ~ ドコモ KDDI ソフトバンク 楽天モバイル
    url: https://scan.netsecurity.ne.jp/article/2025/05/29/52938.html
    published: 2025-05
  question_ideas:
  - 本物の過去メッセージの下に偽SMSが続いているスレッド画面を見せる問題（hard）
  - 送信元名が企業名と1文字違う版（normal）
  - 行動問題：同じスレッドでも公式アプリで確かめる
- id: EX-036
  kind: legit
  title: 企業からのSMSは「0005」で始まる共通ショートコードから届くことがある
  situation: S05
  channels:
  - sms
  tactics:
  - T01
  - T06
  targets:
  - 全世代
  level: normal
  level_reason: 番号の仕組みを知っていれば手がかりになるが、番号だけで判断せず本文が何を求めているかも確かめる必要がある
  flow: |
    1. 携帯電話会社4社が、申し込んだ企業ごとに利用目的などを前もって審査し、重複しない「0005」で始まる8〜10桁の番号（共通ショートコード）を発行する
    2. 企業はその番号からSMSを送るので、どの携帯電話会社を使っていても同じ番号で届く
    3. 受け取った人は、企業の公式サイトや、携帯電話会社4社が共同で開いた番号と企業名の確認サイトで、番号が正しいかを確かめられる
  features:
  - 送信元が「0005」で始まる8〜10桁の番号
  - 証券会社などが、フィッシング対策として配信番号を共通ショートコードに切り替えたと公表している（2025年10月、2026年2月）
  - 「共通ショートコード以外からはSMSを送らない」と公表している証券会社もある
  red_flags:
  - 共通ショートコードで送ると公表している企業なのに、別の番号から届いた
  - SMSでログイン情報や暗証番号の入力を求めている（SMSで入力を求めないと明記する証券会社もある）
  right_action: 送信元の番号を、企業の公式サイトに載っている番号と見比べる。番号が正しく見えても、SMSのリンクからはログインせず、公式アプリや公式サイトから確かめる。
  legit_contrast: 偽のSMSは企業名を名乗っていても、公表された共通ショートコードとは違う番号から届くことがある。共通ショートコードは送信元を確かめる手がかりの一つなので、本文で何を求めているかもあわせて確かめる。
  trend: 2025〜2026年にかけて、証券会社がSMSの配信番号を共通ショートコードに切り替える動きが続いている。
  sources:
  - publisher: NTTドコモ
    title: SMSの送信元番号（共通ショートコード）に関する案内ページ（題名未確認。2023年4月時点の情報）
    url: https://www.docomo.ne.jp/service/sms/displayname/
    published: 2023-04
  - publisher: NTT東日本（企業向けコラム）
    title: スミッシング対策に関するコラム（題名未確認）
    url: https://business.ntt-east.co.jp/column/bizdrive/anti-smishing-scam-measures.html
  - publisher: SMBC日興証券
    title: 共通ショートコードの導入に関するお知らせ（題名未確認）
    url: https://www.smbcnikko.co.jp/news/customer/2026/n_20260205_01.html
    published: 2026-02
  - publisher: 野村證券
    title: SMSの配信番号の変更に関するお知らせ（題名未確認）
    url: https://www.nomura.co.jp/introduc/news/2025/20251001_1.html
    published: 2025-10
  - publisher: 東海東京証券
    title: SMSでのご案内についてのページ（題名未確認）
    url: https://www.tokaitokyo.co.jp/service/sms/
  - publisher: ワイモバイル
    title: SMSのサービス案内ページ（共通ショートコードの確認サイトを紹介。題名未確認）
    url: https://www.ymobile.jp/service/mail/sms/?wovn=en
  question_ideas:
  - 「0005」で始まる番号から届く証券会社のSMS（リンクなしで公式アプリでの確認を促す）と、個人の携帯番号から届くリンクつきのSMSを比べる問題
  - 行動問題：送信元の番号が本物か確かめる方法（企業の公式サイトに載っている番号と見比べる）を選ぶ
- id: EX-037
  kind: scam
  title: 知人からの「投票して」のメッセージで認証番号を入力させ、アカウントを乗っ取る
  situation: S06
  channels:
  - sns
  - web
  tactics:
  - T06
  targets:
  - 全世代
  level: normal
  level_reason: 知人からの軽いお願いなので疑いにくいが、「投票に電話番号や確認コード（認証番号）は要らない」と気づけば見抜ける
  flow: |
    1. SNSやメッセージアプリでつながっている知人から、「（コンテストなどに）立候補したので投票に協力して」とメッセージが届く。その知人のアカウント自体がすでに乗っ取られている
    2. 案内された投票ページに見せかけた画面で、電話番号やパスワード、届いた確認コード（認証番号）を入力するよう求められる
    3. 入力するとアカウントを乗っ取られ、今度は自分のアカウントが知人へのなりすましに悪用されるおそれがある
  features:
  - 送り主はふだんつながっている知人
  - 投票なのに、電話番号やパスワード、確認コードの入力を求める
  red_flags:
  - 投票や確認を理由に、認証番号（確認コード）を入力・送信させる
  - 知人から急に届く、リンク付きのお願い
  right_action: リンクを開かず、認証番号やパスワードは誰にも教えず、入力もしない。気になるときはメッセージ以外の方法で知人に確かめる。ほかのサービスと同じパスワードを使い回さない。乗っ取られたら交流相手に注意を呼びかけ、サービスの運営会社や警察に連絡する。
  legit_contrast: メッセージアプリの認証番号は、他人に教えてはいけないものとされている（鹿児島県警）。
  trend: 山口県警の2025年の広報資料では、投票依頼をきっかけに写真共有SNSのアカウントを乗っ取られたという相談が増えていると注意喚起している。
  sources:
  - publisher: 山口県警察
    title: （資料名未確認）アカウント乗っ取りの注意喚起（PDF）
    url: https://www.pref.yamaguchi.lg.jp/uploaded/attachment/234135.pdf
  - publisher: 山口県警察
    title: （資料名未確認）メッセージアプリ乗っ取りの注意喚起（PDF）
    url: https://www.pref.yamaguchi.lg.jp/uploaded/attachment/209293.pdf
  - publisher: 熊本県警察
    title: （ページ名未確認）アカウント乗っ取りの注意喚起
    url: https://www.pref.kumamoto.jp/site/police/280796.html
  - publisher: 鹿児島県警察
    title: （ページ名未確認）メッセージアプリの友だちになりすます手口の注意喚起
    url: https://www.pref.kagoshima.jp/ja13/cyber_teguchi08.html
    published: 2025-06
  question_ideas:
  - 知人から届いた「投票お願い！」のメッセージと、電話番号・確認コードを入力させる投票ページを見せ、怪しい点を選ぶ問題
  - 行動問題：自分のアカウントが乗っ取られたと気づいたとき、まずすること（メッセージ以外の方法で友だちに知らせる等）を選ぶ
- id: EX-038
  kind: scam
  title: メールに載せたQRコードをスマホで読み取らせ、偽のログイン画面に誘導する
  situation: S06
  channels:
  - email
  - web
  tactics:
  - T01
  - T03
  - T06
  targets:
  - 社会人
  - 学生
  level: normal
  level_reason: 画像のQRコードなのでメールの安全対策をすり抜けやすく、スマホではURLを確かめにくい。ただし「QRコードでログインを」とうながすメール自体が見抜くポイントになる
  flow: |
    1. フィッシングメールの本文や添付ファイルにQRコードが載っていて、スマホで読み取るよううながす
    2. 読み取ると、IDやパスワードなどを盗む偽のログイン画面や、不正なプログラムの配布先が開く
  features:
  - リンクではなく画像のQRコードなので、メールのセキュリティ対策でURLを見つけにくい
  - 会社などが管理するパソコンではなく、自分のスマホで開かせる
  red_flags:
  - ログインや手続きをQRコードの読み取りでうながすメール
  - 読み取った後に表示されたURL（ドメイン）が、そのサービスの公式のものと違う
  right_action: 身に覚えのないメールのQRコードは読み取らない。読み取ってしまったら表示されたURLを確かめ、何も入力しない。サービスの状況は、公式アプリやブックマークした公式サイトから確かめる。
  trend: 2025年7月に公表された海外の業界団体の分析では、2025年に入ってQRコードを悪用したフィッシングが急増しているとされた。2026年7月にも、画像を使ったフィッシングが約400％増えたとする解説記事が出ている。
  sources:
  - publisher: NTT東日本
    title: サイバーセキュリティ情報（2025年7月。QRコードを悪用したフィッシングの分析を紹介。題名は要約）
    url: https://business.ntt-east.co.jp/service/cybermimamori/download/sec-202507.pdf
    published: 2025-07
  - publisher: ＠IT
    title: QRコード攻撃はなぜメールセキュリティを無力化できるのか? その理由を解説:画像型フィッシングは約400%増
    url: https://atmarkit.itmedia.co.jp/ait/spv/2607/08/news048.html
    published: 2026-07
  - publisher: 警視庁
    title: QRコードを悪用した手口と対策（題名は要約）
    url: https://www.keishicho.metro.tokyo.lg.jp/kurashi/cyber/notes/qrcord.html
    published: 2026-07
  question_ideas:
  - 「QRコードを読み取って再ログインしてください」というメールを見せ、本物か詐欺かを判断する問題
  - QRコードを読み取った後のスマホ画面（URL表示つき）を見せ、続けてよいかを判断する問題
- id: EX-039
  kind: legit
  title: 公式SNSアカウントの見分け方（ID・公式マーク・開設時期・フォロワー数・公式サイトからたどる）
  situation: S06
  channels:
  - sns
  tactics:
  - T01
  - T05
  targets:
  - 全世代
  level: hard
  level_reason: 偽物は本物と同じ画像やデザインを使い、公式マークも購入できる場合があるため、見た目だけでは区別しにくい
  flow: |
    1. 企業や役所の公式サイトに載っているリンクから、公式アカウントを開く
    2. 届いたメッセージの送り主のIDと、公式アカウントのIDを1文字ずつ見比べる（アンダーバーとドットの違いなど）
    3. 公式マークの有無、開設時期、フォロー数とフォロワー数のバランスを確かめる
  features:
  - 本物は長く運用されていて開設時期が古く、フォロワーが多い
  - IDが公式サイトに載っているものと一致する
  - 公式マークが付いている（ただし公式マークは購入できるものもあり、マークだけでは安心できない）
  red_flags:
  - IDが本物と少しだけ違う
  - 開設が新しいのにフォロー数だけ多く、フォロワーが極端に少ない
  - 本物と同じ画像・デザインなのに、公式サイトからたどったアカウントと一致しない
  right_action: SNS上の情報をそのまま信じず、発信元を確かめる。送られてきた投稿やメッセージのリンクではなく、公式サイトや公式アプリなど信頼できる入口から公式アカウントにアクセスする。
  legit_contrast: 偽アカウントは本物と同じプロフィール画像やデザインを使うため、よく見ないと違いに気づけない。見た目ではなく、IDと公式サイトからのたどり方で確かめる。
  trend: 2026年1月に県警が、なりすましアカウントの見分け方を公表した。
  sources:
  - publisher: 栃木県警察
    title: ＳＮＳのなりすましアカウントに注意
    url: https://www.pref.tochigi.lg.jp/keisatu/n14/seikatu/documents/20260123092947.pdf
    published: 2026-01
  - publisher: ソフトバンク（公式ニュースサイト）
    title: SNSのなりすましや偽サイトへの注意を呼びかける記事（題名未確認）
    url: https://www.softbank.jp/sbnews/entry/20260611_01
    published: 2026-06
  question_ideas:
  - 本物と偽物の公式アカウントのプロフィール画面を並べ、ID・開設時期・フォロー数とフォロワー数の違いから本物を選ぶ問題
  - ○×問題：「公式マークが付いていれば必ず本物」（×）
- id: EX-040
  kind: scam
  title: SNSの「高額・即日」求人から秘匿性の高いアプリに誘い、身分証を送らせる闇バイト
  situation: S07
  channels:
  - sns
  - chat
  tactics:
  - T14
  - T05
  - T06
  targets:
  - 学生
  - 社会人
  level: easy
  level_reason: 「高額」「即日即金」「ホワイト案件」など決まった言葉が多く、警察庁などの注意喚起も多い
  flow: |
    1. SNSで「高額」「即日即金」「ホワイト案件」「運ぶだけ」などの言葉や、「#即日現金」のようなハッシュタグが付いた求人を見つけて応募する
    2. 連絡がつくと、やり取りが残りにくい秘匿性の高い通信アプリに移るよう指示される
    3. 運転免許証などの身分証の画像や顔写真、実家の住所などの個人情報を送るよう求められる
    4. 仕事の中身は特殊詐欺の受け子や「運び」などの犯罪で、やめたいと言うと、送った個人情報をもとに「家に行く」「家族に危害を加える」などと脅される
  features:
  - 仕事の内容がはっきり書かれていないのに、報酬だけが高い
  - 「楽で、簡単、高収入」を強調する
  - 求人サイトに載っていた求人でも、面接が通話だけ、連絡手段に秘匿性の高いアプリを指定、報酬は指定の場所に置かれた現金、といった不自然なものが受け子の募集だった事例がある
  - 先輩や友人からの誘いがきっかけになることもある
  - 報酬が極端に高く（日給5万円、1件10万円など）、即日払いを強調する
  red_flags:
  - 秘匿性の高い通信アプリへの移動を求められる
  - 応募の段階で、身分証や顔写真、家族の情報を送らせる
  - 「受け」「運び」「回収」「〇〇するだけ」など、中身があいまいな仕事
  right_action: 応募しない。身分証や顔写真などの個人情報は絶対に送らない。応募してしまった、脅されて抜けられないときは、犯罪をする前にすぐ「#9110」や最寄りの警察署に相談する（警察は相談した人と家族を保護すると明言している）。
  legit_contrast: 警察庁は、闇バイトの募集は普通のアルバイト募集のように見えるが、報酬の額・支払いの時期・仕事内容の書き方に特徴があると説明している。報酬の高さ、支払いの早さ、仕事内容のあいまいさ、連絡を匿名性の高いアプリに移すかどうかを確かめる。
  trend: 2024年10月、首都圏で相次いだ強盗事件などで検挙された人がSNSの求人で集められていたとして、警察庁がSNSで求人を探す人に向けて特徴を示した注意喚起を出した。2025年も政府広報（2025年6月）や令和7年版警察白書で取り上げられている。
  sources:
  - publisher: 警察庁
    title: ＳＮＳなどで求人情報を探している方へ 犯罪実行者募集情報の特徴（PDF）
    url: https://www.npa.go.jp/bureau/safetylife/yamibaito/tokutyou.pdf
