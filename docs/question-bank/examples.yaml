    title: 偽CAPTCHAの事例に関するリサーチ記事（題名は要約）
    url: https://www.trendmicro.com/ja_jp/research/25/f/unmasking-fake-captcha-cases.html
    published: 2025-06
  - publisher: Malwarebytes
    title: 偽CAPTCHA詐欺の解説（題名は要約）
    url: https://www.malwarebytes.com/ja/cybersecurity/basics/fake-captcha-scams
  - publisher: ESET
    title: マルウェアを広める偽の認証ページ（偽CAPTCHA）に注意（題名は要約）
    url: https://www.eset.com/jp/blog/welivesecurity/rogue-captchas-look-out-phony-verification-pages-spreading-malware-jp/
