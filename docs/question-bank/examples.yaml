  - キャンペーンを行った公式アカウントからの当選DMと、IDが少し違うアカウントからの当選DMを比べて本物を選ぶ問題
  - 行動問題：当選のDMが来たとき最初にすること（公式サイトから公式アカウントを開いて送り主を確かめる）
- id: EX-085
  kind: scam
  title: 高速道路のETC関連サービスをかたる「解約予告」「支払い失敗」メールとSMS
  situation: S17
  channels:
  - email
  - sms
  tactics:
  - T01
  - T04
  - T06
  targets:
  - 社会人
  - 高齢者
  level: normal
  level_reason: 件名で強く不安をあおる典型的な形だが、偽サイトはロゴや色づかいまでまね、本物の問い合わせ先の電話番号を載せている例もあり、画面だけでは見分けにくい
  flow: |
    1. 高速道路会社やETCの利用明細を照会する公式サービスを名乗るメールやSMSが届く
    2. 【重要】【緊急】などの件名で、「解約予告のお知らせ」「年会費の支払いに失敗しました」「ETCの2回目の違反がありました」などと伝え、リンクへ誘導する
    3. 偽サイトでログインIDやパスワード、クレジットカード番号などを入力させる
  features:
  - 件名に【重要】【緊急】【警告】【異常】などを付ける
  - 「決済情報更新のお願い」「ETCカード契約更新のご案内」「未払い料金のご案内」など、支払いや契約の手続きを装う
  - 偽サイトはロゴや色づかいをまね、本物の問い合わせ先の電話番号を載せる例もある
  red_flags:
  - 利用明細を照会するサービスなのに、カード番号の入力を求める
  - 解約・違反・支払い失敗などで不安をあおり、リンクから手続きさせる
  - リンク先のドメインが公式と違う
  right_action: リンクは開かず、ブックマークした公式サイトや公式アプリから自分でログインして確かめる。カード情報を入力してしまったら、カード会社に連絡する。
  legit_contrast: 本物の利用明細サービスは、氏名・電話番号・クレジットカード情報を取得せず、ログインには自分で決めたIDとパスワードだけを使う。高速道路会社やこのサービスが、メールのリンクや二次元コードから個人情報やカード情報を入力させることはない（R1-19を参照）。
  trend: 2025年12月に高速道路会社が注意を呼びかけ、2026年2月には急増が報じられた。2026年6月の民間調査でも、夏の移動シーズンに向けてETCや高速道路会社をかたるフィッシングが確認された
  sources:
  - publisher: JAF Mate
    title: ETC利用照会サービスをかたるフィッシング詐欺が急増! 偽メール・偽サイトに要注意
    url: https://jafmate.jp/car/traffic_topics_20260223_1198471.html
    published: 2026-02
  - publisher: 首都高速道路
    title: 弊社を装った不審メール・SMS・フィッシングサイトにご注意ください
    url: https://www.shutoko.jp/news/2025/12/01-phishing/
    published: 2025-12
  - publisher: トビラシステムズ（PR TIMES）
    title: トビラシステムズ 特殊詐欺・フィッシング詐欺に関するレポート(2026年6月)
    url: https://prtimes.jp/main/html/rd/p/000000247.000034282.html
    published: 2026-07
  question_ideas:
  - 偽サイトに本物の問い合わせ先の電話番号が載っている版（hard寄り）
  - 「利用明細の照会サービスなのにカード番号を聞く」点に気づく問題
  - 本物の照会サービスのログイン画面（IDとパスワードだけ）と比べる問題
- id: EX-086
  kind: legit
  title: 本物のETC利用明細サービス：ログインは自分で決めたIDとパスワードだけで、カード情報は取得しない
  situation: S17
  channels:
  - email
  - web
  tactics:
  - T01
  - T06
  targets:
  - 社会人
  - 高齢者
  level: normal
  level_reason: 偽サイトは本物そっくりなので、画面の見た目ではなく「本物のサービスが何を聞き、何を聞かないか」を知っておく必要がある
  flow: |
    1. 本物の利用明細サービスは、自分で決めたIDとパスワードでログインする（メールアドレスや携帯電話番号ではログインできない）
    2. 本物のサービスは、氏名・電話番号・クレジットカード情報を取得しない
    3. 高速道路会社やこのサービスが、メールのリンクや二次元コードから個人情報やカード情報を入力させることはない
  features:
  - ログイン画面で求めるのはIDとパスワードだけ
  - カード番号や電話番号を入力する画面がない
  red_flags:
  - カード番号や電話番号の入力を求める画面は偽物と考える
  - メールの二次元コードから本人確認をさせようとする
  right_action: ブックマークした公式サイトから自分でアクセスする。偽サイトに入力してしまったら、カード会社に連絡する。
  legit_contrast: 偽物は「解約予告」「支払い失敗」などで急がせ、カード番号まで入力させる（R1-11を参照）。
  sources:
