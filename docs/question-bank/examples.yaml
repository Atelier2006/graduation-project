    title: スマートフォンのセキュリティに関するIPA講演資料（題名は要約）
    url: https://www.police.pref.fukushima.jp/onegai/jyouhou/hightech2/cyber-security-leader/downloads/2903_ipa.pdf
  question_ideas:
  - スマホの「ウイルス感染」画面からアプリのインストール画面に進む流れを見せ、どこで止めるかを選ぶ問題
  - 入れてしまった後に確かめること（定期課金の契約）を選ぶ問題
- id: EX-070
  kind: legit
  title: 本物のセキュリティ警告・確認画面の特徴と、偽物かどうかの確かめ方
  situation: S11
  channels:
  - web
  tactics:
  - T08
  - T10
  targets:
  - 全世代
  level: normal
  level_reason: 偽物は見た目が本物に近いので、確かめ方（閉じ方・本物の確認画面の特徴）を知っている必要がある
  flow: |
    1. 画面に警告や確認画面が出ても、まず画面の電話番号・ボタン・手順には従わずに落ち着く
    2. ブラウザ（Webページ）の中に出た警告なら、Escキーの長押しで全画面を解除してブラウザを閉じる。偽物ならこれで消える
    3. パソコンやスマホの状態は、警告画面のボタンを使わずに落ち着いて確かめ、判断できなければ周りの人や相談窓口に相談する
  features:
  - 本物のCAPTCHA（ロボットでないことの確認）は、チェックボックスや簡単なパズル・画像選びだけで終わる
  - アプリは信頼できるアプリストアから、許可する権限を確かめて入れる
  - IPAは、偽警告の閉じ方を練習できる体験サイトを公開している（パソコン用。始めると音声が流れ、約2分で自動的に終わる）
  red_flags:
  - （偽物の特徴）画面に電話番号を出して電話させる
  - （偽物の特徴）キー操作での貼り付け・実行や、ファイルのダウンロードを求める
  - （偽物の特徴）同じセキュリティ警告が通知として何度も出る
  right_action: 警告画面の電話番号やボタンは使わない。IPAの手順（Escキーを2〜3秒長押し→右上に出た閉じるボタンで閉じる。解除されなければ画面の中をクリックしてもう一度長押し）で閉じ、消えなければ再起動する。判断できないときは家族や、IPAの情報セキュリティ安心相談窓口に相談する。
  legit_contrast: 偽の警告や当選画面は、ブラウザを閉じたり再起動したりすると表示されなくなる（警察の案内）。本物の確認画面は、ページの外でのキー操作やコマンドの貼り付け、ファイルのダウンロードを求めない（セキュリティ企業の解説）。IPAは、繰り返し出るセキュリティ警告の通知は偽物であることが多いとしている。
  sources:
  - publisher: IPA（情報処理推進機構）
    title: 偽セキュリティ警告（サポート詐欺）対策特集ページ
    url: https://www.ipa.go.jp/security/anshin/measures/fakealert.html
