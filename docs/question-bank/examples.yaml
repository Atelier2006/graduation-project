    title: SNSのなりすましや偽サイトへの注意を呼びかける記事（題名未確認）
    url: https://www.softbank.jp/sbnews/entry/20260611_01
    published: 2026-06
  question_ideas:
  - ゲーム内チャットの「無料でポイント配布中！ここからログイン」というメッセージと、偽のログイン画面を見抜く問題
  - 本物のゲームのお知らせ（アプリ内のお知らせ欄で、外部の画面でのログインを求めない）と並べて比べる問題
- id: EX-077
  kind: scam
  title: ゲームのアカウント・アイテムの売買や「課金代行」をめぐるトラブル（RMT）
  situation: S13
  channels:
  - web
  tactics:
  - T05
  - T06
  - T07
  targets:
  - 学生
  level: normal
  level_reason: 「安い」「お得」に見えるが、多くのゲームで利用規約違反だと知っていれば避けられる
  flow: |
    1. 売買サイトなどで、ゲームのアカウントやアイテム、ゲーム内通貨の売買や、正規より安い「課金代行」の広告を見る
    2. 代金を払ったり、ゲームのIDとパスワードを相手に教えたりする
    3. お金のトラブルや詐欺にあったり、IDとパスワードからアカウントを乗っ取られたりする。課金代行は規約違反で、不正な手段が使われていれば依頼した利用者も逮捕されることがある
  features:
  - アカウント・アイテム・ゲーム内通貨を、現金や電子マネーで取引する（RMT）
  - 正規の料金のごく一部（2〜6%程度）で課金できるとうたう業者もあった
  - 「課金代行や育成代行はRMTではないから大丈夫」という思い込み（ゲームの業界団体は誤りだとしている）
  red_flags:
  - 公式のストアや決済以外で、ゲーム内通貨やアカウントを買う
  - IDとパスワードを相手に教えるよう求められる
  - 正規の料金よりはるかに安い
  right_action: アカウントやアイテムの売買、課金代行は利用しない。IDとパスワードは誰にも教えない。被害にあったときは消費生活センター（消費者ホットライン188）に相談する。
  legit_contrast: 多くのゲームでは、アカウントやアイテムの売買が利用規約で禁止されている。ゲーム会社は、指定していない決済サービスを使わないよう呼びかけている。
  trend: 2025年3月、ゲーム会社が、不正なRMT業者だけでなく依頼した利用者も逮捕・起訴されうると注意を呼びかけた。2025年8月には、不正なRMTが犯罪集団の資金洗浄に使われているとの報道もあった。課金代行を依頼した利用者側が逮捕された事件も報じられている。
  sources:
  - publisher: 北海道警察
    title: CYBER NEWS 2024 Vol.2
    url: https://www.police.pref.hokkaido.lg.jp/00ps/yoichi-syo/kakuka/01_keimu/002_ibemt/200saiseki/syoutyuugakuseimuke/CYBER NEWS 2024_Vol.2.pdf
    published: '2024'
  - publisher: 一般社団法人コンピュータエンターテインメント協会（CESA）
    title: RMTに関する注意喚起資料（題名未確認）
    url: https://www.cesa.or.jp/assets/pdf/action/rmt-caution.pdf
  - publisher: AUTOMATON
    title: セガ「不正課金に関する、皆様へのお知らせとお願い」を伝える記事（題名未確認）
    url: https://automaton-media.com/articles/newsjp/sega-20250319-332061/
    published: 2025-03
  - publisher: GameBusiness.jp
    title: 不正な「RMT行為」は犯罪集団の資金洗浄に使用されている―利用側ユーザーが罪に問われる場合も
    url: https://www.gamebusiness.jp/article/2025/08/28/24949.html
    published: 2025-08
  - publisher: toy-people.com（ニュースサイト）
    title: 課金代行を依頼した利用者の逮捕を伝える記事（題名未確認）
    url: https://www.toy-people.com/jp/?p=101317
