    url: https://www.pref.kagoshima.jp/aa02/kohokocho/kouhoushi/instagram/airatyuuikanki.html
    published: 2026-01
  - publisher: 栃木県警察
    title: ＳＮＳのなりすましアカウントに注意
    url: https://www.pref.tochigi.lg.jp/keisatu/n14/seikatu/documents/20260123092947.pdf
    published: 2026-01
