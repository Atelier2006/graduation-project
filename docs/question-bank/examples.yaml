  level: easy
  level_reason: 未払い料金の支払いを迫る典型的な手口で、電力会社自身や各機関の注意喚起が多い。支払い方法の不自然さでも見抜ける
  flow: |
    1. 電力会社を名乗るメールやSMSが届き、電気料金が未払いになっていると伝えて支払いを促す
    2. 支払いの手続きとして、リンクから偽サイトへ誘導する
    3. 偽サイトで電話番号やクレジットカード情報を入力させる。インターネット専用のプリペイドカードで支払わせようとする例もある
  features:
  - 電力会社の名前で、未払いの電気料金の支払いを求める
  - 差出人のメールアドレスを、電力会社の正規のアドレスに似せている
  - 支払い方法としてプリペイドカードを求める例がある
  red_flags:
  - 電気料金の支払いをプリペイドカードで求める
  - SMSやメールのリンクからカード情報を入力させる
  - 差出人アドレスが正規のものに「似ている」だけ
  right_action: リンクは開かずにメールを削除し、ブックマークした電力会社の公式サイトや会員サービスにログインして、請求や支払いの状況を確かめる。カード情報を入力してしまったら、すぐにカード会社に連絡する。
  legit_contrast: 電力会社は、プリペイドカードでの支払いをお願いすることはないと明言している。会員サービスへのログインは、メールやSMSのリンクではなく公式サイトやブックマークから行うよう案内している。
  trend: 2026年4月の民間調査でも、電力会社をかたるSMSが継続して多発していると報告された
  sources:
