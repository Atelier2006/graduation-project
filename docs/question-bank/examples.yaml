  - 「携帯をなくして番号が変わった」という連絡の場面を見せ、次にとるべき行動を選ぶ問題（元の番号にかけ直す）
  - 易しい版：「同僚が現金を取りに行く」と言われる会話を見せて、詐欺のサインを選ぶ
- id: EX-080
  kind: scam
  title: 乗っ取られた知人のアカウントから「電子マネーのカードを買って番号を送って」と頼まれる
  situation: S15
  channels:
  - sns
  - chat
  tactics:
  - T04
  - T07
  targets:
  - 全世代
  level: normal
  level_reason: 送り主の名前やアイコンは本物の知人なので信じやすいが、メッセージだけでお金を頼まれたら別の方法で本人に確かめる、という一つの行動で防げる
  flow: |
    1. メッセージアプリで、友だち登録している知人のアカウントから、電子マネーのカードを買ってきてほしいと頼まれる
    2. 買ったカードの番号を送るよう求められる
    3. 実は知人のアカウントが乗っ取られていて、送った番号の電子マネーを使われてしまう（スマホ決済サービスでの送金を求める例もある）
  features:
  - 送り主の名前・アイコンは本物の知人のもの
  - 電話ではなく、メッセージだけで頼んでくる
  - 電子マネーのカードの番号という、取り戻しにくい形でお金を払わせる
  red_flags:
  - 知人からメッセージだけで、電子マネーの購入や送金を頼まれる
  - カードの番号を送るよう求められる
  right_action: メッセージには応じず、電話や直接会うなど、メッセージ以外の方法で本人に確かめる。自分のアカウントが乗っ取られたときは、メッセージアプリ以外の方法で友だちに知らせ、電子マネーの購入や振込を頼まれても応じないよう伝える。サービスの運営会社や警察にも連絡する。
  legit_contrast: おかしいと感じたら、本人に電話で確かめるよう警察が呼びかけている（沖縄県警）。
  trend: 鹿児島県警は2025年6月にこの手口の注意喚起ページを更新している。乗っ取ったアカウントで家族や知人になりすまし、スマホ決済サービスでの送金を求める詐欺が全国で相次いでいるとも報じられている（琉球新報）。
  sources:
  - publisher: 鹿児島県警察
    title: （ページ名未確認）メッセージアプリの友だちになりすます手口の注意喚起
    url: https://www.pref.kagoshima.jp/ja13/cyber_teguchi08.html
    published: 2025-06
  - publisher: 琉球新報
    title: （記事名未確認）乗っ取りアカウントによるなりすまし送金要求の報道
    url: https://ryukyushimpo.jp/newspaper/entry-5491297.html
  - publisher: 熊本県警察
    title: （ページ名未確認）アカウント乗っ取りの注意喚起
    url: https://www.pref.kumamoto.jp/site/police/280796.html
  - publisher: 沖縄県警察
    title: （資料名未確認）メッセージアプリのなりすましの注意喚起（PDF、2018年の資料）
    url: https://www.police.pref.okinawa.jp/docs/20180119000261/file_contents/line.pdf
  question_ideas:
  - 知人のアイコンで「コンビニで電子マネーのカードを買って、番号を送って」と届くチャット画面を見せ、正しい対応を選ぶ
  - 比較問題：同じ知人のふだんのメッセージと、お金を頼むメッセージを並べ、確かめ方を考える
- id: EX-081
  kind: scam
  title: 「スマートフォンに当選しました」と出る偽の当選画面・アンケート
  situation: S16
  channels:
  - web
  - ad
  tactics:
  - T01
  - T05
  - T06
  targets:
  - 全世代
  level: easy
  level_reason: Webサイトを見ているだけで突然当選と出る、賞品なのにカード情報を求めるなど見抜くポイントが多い
  flow: |
    1. Webサイトを見ていると、突然「おめでとうございます。スマートフォンに当選しました」などの画面が出る
    2. 簡単なアンケートに答えさせ、氏名・住所・メールアドレスを入力させる
    3. 最後に「安全なお支払い」などと称して、クレジットカード情報を入力させる
  features:
  - 人気の高額な商品が当たったと表示する
  - 当選者の「喜びの声」（偽物）を並べて本当らしく見せる
  - 不正な広告から、身近な企業をかたる偽の抽選サイトに誘導される例がある
  red_flags:
  - Webサイトを見ているだけで、突然「当選」と出る
  - 賞品なのに、支払いのためにカード情報の入力を求める
  - アンケートなのにアカウント情報やカード情報まで入力させる
  right_action: 情報を入力せず、画面に出た電話番号にも連絡しない。偽の当選画面はブラウザを閉じたり再起動したりすれば表示されなくなる（警察の案内）。カード情報を入力してしまったらカード会社に連絡する。電話の指示で遠隔操作ソフトを入れてしまった場合は、IDとパスワードを変え、パソコンの初期化なども考える。
  trend: IPAは2015年にこの手口を注意喚起した。長野県警察は2025年6月にもページを更新し、偽の当選画面でアンケートとともにアカウント情報やカード情報を入力させる手口に注意を呼びかけている。
  sources:
  - publisher: 長野県警察
    title: iPhone当選詐欺（題名は要約）
    url: https://www.pref.nagano.lg.jp/police/anshin/cyber/iphone-tousen.html
    published: 2025-06
  - publisher: INTERNET Watch（IPAの注意喚起の報道）
    title: IPA、iPhone当選をかたる偽の画面に注意喚起（題名は要約）
    url: https://internet.watch.impress.co.jp/docs/news/719063.html
    published: 2015-09
  - publisher: トレンドマイクロ
    title: 不正広告から郵便事業者をかたる偽の抽選サイトへの誘導（題名は要約）
    url: https://trendmicro.com/ja_jp/research/18/d/iphone-set-for-100-yen-malicious-advertisements-confirmed-to-lead-victims-toward-a-fraudulent-raffle-site-that-masquerades-as-japan-post.html
    published: 2018-04
  question_ideas:
  - 当選画面→アンケート→カード入力の3画面を見せ、おかしい点をすべて選ぶ問題
  - 「安全なお支払い」としてカード番号を求められた場面での正しい行動を選ぶ問題
- id: EX-082
  kind: scam
  title: 当選・プレゼント企画をかたり、受け取りの手数料や個人情報を求める
  situation: S16
  channels:
  - sms
  - email
  - sns
  - web
  tactics:
  - T01
  - T05
  - T06
  - T07
  targets:
  - 全世代
  level: easy
  level_reason: 「申し込んでいないのに当選」「受け取るためにお金や情報が必要」という典型的なサインがある
  flow: |
    1. 「大金に当選しました」というメールやSMS、または企業の公式アカウントに見えるSNSアカウントから「キャンペーンに当選しました」というDMが届く（SNSで見つけたプレゼント企画に応募した後に当選の連絡が来る例もある）
    2. 受け取りの手続きとして、URLから個人情報やクレジットカード情報を登録させたり、アプリの契約や登録を求めたりする
    3. 手数料や「セキュリティ費用」などの名目で支払いを求められ、電子ギフトカードなどで払うと、次々に別の費用を請求される
  features:
  - 申し込んだ覚えのない宝くじや懸賞の当選
  - 「先着2000名に1万円、その中の10名に100万円」のような大きな金額のプレゼント企画
  - 企業の公式アカウントのように見えるアカウントからのDM
  - 受け取りのためのURLが書かれている
  red_flags:
  - 当選金や賞品を受け取る前に、手数料や登録料などのお金を払うよう言われる
  - DMやリンク先で、カード情報や個人情報の入力を求められる
  right_action: 心当たりのない当選の連絡は開かずに削除し、相手に連絡しない。SNSの不審なDMは、URLを開かず、返信やフォローもせずにブロックする。払ってしまったお金を取り戻すのはほぼできないので、払う前に止まり、困ったら消費者ホットライン188に相談する。
  legit_contrast: 国民生活センターは、申し込んでいない宝くじや懸賞に当選することはないとしている。なりすましに注意を呼びかけた企業や金融機関は、公式アカウントからDMでクレジットカード情報を聞いたり、個人の情報を求めたりすることはないと明言している。
  trend: 2025〜2026年も、企業や金融機関、ゲームの公式などが、なりすましアカウントからのDMに注意を呼びかけている
  sources:
  - publisher: 大崎市
