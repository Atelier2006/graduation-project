    url: https://www.police.pref.nara.jp/cmsfiles/contents/0000004/4510/onlinegame.pdf
  - publisher: ScanNetSecurity
    title: 「ポイント3倍」「当選」などで誘導、モバゲーを騙るフィッシングサイト(フィッシング対策協議会)
    url: https://scan.netsecurity.ne.jp/article/2010/06/14/25308.html
    published: 2010-06
  - publisher: 電ファミニコゲーマー
    title: 課金代行事件とゲーム会社の注意喚起を伝える記事（題名未確認）
    url: https://news.denfaminicogamer.jp/news/2507032c
