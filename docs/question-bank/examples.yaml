    title: フィッシングへの注意喚起（題名は要約）
    url: https://www.paypay-bank.co.jp/news/2025/0610.html
    published: 2025-06
  - publisher: 日経BP
    title: DIGITAL Foresight 2025-26 Winter Review
    url: https://special.nikkeibp.co.jp/atclh/NXT/26/df2026_winter_review/0205/
  - publisher: ペイメントナビ（フィッシング対策協議会の解説を紹介）
    title: 不正送金被害の爆発的増加にフィッシング対策協議会が警鐘 リアルタイムフィッシングなど巧妙化する手口から身を守れ
    url: https://paymentnavi.com/?p=144363
    published: 2024-04
  question_ideas:
  - 「メールのリンクから開いたログイン画面」と「ブックマークから開いたログイン画面」のどちらで入力すべきかを選ぶ問題
  - 並べ替え問題：お知らせメールが来たときに安全にログインして確かめる手順
- id: EX-022
  kind: scam
  title: 著名人の投資広告から投資グループに招待され、利益が出たように見せて大金を振り込ませるSNS型投資詐欺
  situation: S04
  channels:
  - ad
  - sns
  - chat
  tactics:
  - T01
  - T05
  - T11
  - T07
  - T13
  targets:
  - 社会人
  - 高齢者
  level: normal
  level_reason: グループ内の書き込みや画面上の利益で本物らしく見えるが、「著名人の無料投資セミナー」「必ずもうかる」「個人名義の口座への振込」など、注意喚起で示されたサインが複数ある
  flow: |
    1. SNSや動画サイトで、著名人が無料の投資セミナーや「必ずもうかる」投資を勧める広告・投稿を見る
    2. 連絡するとメッセージアプリに誘導され、著名人を名乗る人物や「講師」「アシスタント」がいる投資グループに招待される。グループでは、ほかの参加者が利益を上げたように見せる書き込みが続く（多くはサクラ）
    3. 偽の投資アプリなどで利益が出ているように表示され、少額なら出金にも応じてもらえるため信用してしまう
    4. 追加の入金を求められ、高額を振り込むと出金できなくなる
  features:
  - 著名人の名前や写真を無断で使った広告・投稿
  - グループチャットで成功報告が次々に流れる
  - アプリの画面上では利益が増えているように見える
  - 振込先が個人名義の口座
  - 政府機関を装った偽サイトや、政府要人の映像・音声を悪用した広告が使われることもある
  red_flags:
  - 著名人が無料で投資を教える、「必ずもうかる」とうたう
  - 投資グループへの招待
  - 個人名義の口座への振込を指示される
  - 出金するために、先に手数料や税金を払うよう言われる
  right_action: 広告や投稿から連絡せず、グループにも参加しない。投資を勧める業者が金融庁の登録を受けているかを確かめ、個人名義の口座には振り込まない。お金を払ってしまったら、すぐに「#9110」や最寄りの警察署、振込先の金融機関に相談する。
  legit_contrast: 本物の証券会社が、入金先として個人名義の銀行口座を指定することはない（金融庁）。警察庁は、首相官邸や政府要人が個別に投資を勧誘したり、個人情報の入力を求めたりすることはないとしている。
  trend: 2025年のSNS型投資詐欺は9,523件・被害額約1,288億円（警察庁の確定値、前年比で件数+48.5%）。最初の接触は広告（3,785件）とダイレクトメッセージ（3,549件）で全体の約8割を占め、動画サイトや投資サイトの広告が増加の要因の一つとされる。2026年7月末の暫定値でも6,566件・約881億円と、前年同期比で件数+75.6%、被害額+88.6%と増え続けている。
  sources:
  - publisher: 警察庁
    title: （ページ名未確認）SNS型投資詐欺の手口ページ（SOS47）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/case/sns-romance/investment/
  - publisher: 金融庁
    title: それ詐欺です！SNS上の投資勧誘にご注意ください！
    url: https://www.fsa.go.jp/receipt/toushisagi_koukoku/shuhou.html
  - publisher: 北海道警察 手稲警察署
    title: （資料名未確認）詐欺の注意喚起ニュース（PDF）
    url: https://www.police.pref.hokkaido.lg.jp/00ps/teine-syo/kakuka/03_seian/308-teinenews/saginewsR7.7.2.pdf
  - publisher: 長崎県警察
    title: （資料名未確認）SNS型投資詐欺の注意喚起（PDF）
    url: https://www.police.pref.nagasaki.jp/police/wp-content/uploads/2024/12/21781d43412b8b90c0a08663e941be0d.pdf
  - publisher: rocket-boys.co.jp
    title: （ページ名未確認）SNS型投資詐欺の解説記事
    url: https://rocket-boys.co.jp/security-measures-lab/what-sns-type-investment-fraud/
