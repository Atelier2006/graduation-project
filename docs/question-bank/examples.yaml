    url: https://www.kokusen.go.jp/t_box/data/t_box-faq_qa2020_16.html
  - publisher: 北本市
    title: （当選メールの後に手数料を次々と請求された相談事例）
    url: https://www.city.kitamoto.lg.jp/material/files/group/44/983_p22.pdf
  - publisher: 栃木市
    title: （消費生活通信 SNSのプレゼント企画に応募した相談事例）
    url: https://www.city.tochigi.lg.jp/uploaded/attachment/66744.pdf
  - publisher: 住友林業ホームテック
    title: （キャンペーン当選を装うなりすましアカウントのDMに関する注意喚起）
    url: https://sfc.jp/information/newstopics/pdf/2023-01-13.pdf
    published: 2023-01
  - publisher: 盛岡信用金庫
    title: （なりすましSNSアカウントからのDMに関する注意喚起）
    url: https://www.shinkin.co.jp/morishin/news/pdf/20251014_release.pdf
    published: 2025-10
  - publisher: GameBusiness.jp
    title: 『学マス』公式が注意喚起ーSNSで偽アカウントが出没、DMを受け取った場合は反応せずにブロックを
    url: https://www.gamebusiness.jp/article/2026/01/07/25921.html
    published: 2026-01
  question_ideas:
  - 公式に似た名前のアカウントから届いた「キャンペーンに当選しました」というDMを見せ、本物かどうかを判断する問題
  - 「大金当選・受け取りには手数料が必要」というSMSを見せ、正しい行動を選ぶ易しい問題
- id: EX-083
  kind: scam
  title: 企業や自治体の公式SNSアカウントになりすました「プレゼント当選」の連絡
  situation: S16
  channels:
  - sns
  tactics:
  - T01
  - T05
  - T06
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: アイコンや説明文が本物と同じで見た目では区別しにくいが、IDや開設時期、送り主を確かめれば見抜ける
  flow: |
    1. 企業や自治体が公式SNSでプレゼントキャンペーンを行う
    2. 公式とそっくりなアイコン・名前・説明文の偽アカウントから「当選しました」というDMや返信が届く。一般の利用者を名指しして、本物の抽選に当たったように見せる例もある
    3. DMのリンクを開くと、個人情報の入力を求められたり、情報を抜き取られたりするおそれがある
  features:
  - プロフィール画像や説明文、投稿の画像が本物と同じ
  - IDが本物と少しだけ違う（アンダーバーがドットになっている、など）
  - 開設が新しく、フォロー数に比べてフォロワーが極端に少ない
  red_flags:
  - キャンペーンを行った公式アカウント以外から当選の連絡が来る
  - DMのリンク先で個人情報などの入力を求められる
  right_action: DMのリンクは開かない。公式サイトに載っているリンクから公式アカウントを開き、送り主と同じかを確かめる。なりすましのアカウントはブロックし、SNSの運営に通報する。
  legit_contrast: 自治体のキャンペーンでは、当選者への連絡は公式アカウントを通じて決めた期限までに行い、公式アカウント以外からの当選連絡はしないと明言している。DMで個人情報を求めたり投資を勧めたりはしないと明記している金融機関もある。
  trend: 2025年9月に携帯電話会社の公式アカウントを装った当選通知、2025年12月〜2026年1月には県の写真共有SNSのキャンペーンに便乗したなりすましが確認され、2026年1月には県警がなりすましアカウントの見分け方を公表した。
  sources:
  - publisher: ITmedia Mobile
