  - 応募してしまった後の行動問題（「#9110や警察に相談」が正解）
  - 本物のアルバイト募集（仕事内容・勤務先・時給がはっきりしていて、身分証の画像を先に求めない）と並べて比べる問題
- id: EX-041
  kind: scam
  title: 「簡単に稼げる」副業のはずが高額なサポート契約と借金に
  situation: S07
  channels:
  - ad
  - sns
  - chat
  tactics:
  - T05
  - T11
  - T07
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: 電話やチャットで話すうちに高額な契約へ進み、借金の手続きまで指示されるため途中で断りにくいが、「借金してまで払わせる」という明確なサインがある
  flow: |
    1. ネットの広告やSNSで、スマホで簡単に稼げるという副業の情報を見て申し込む
    2. 「確実にもうかるノウハウを教える」などと、高額なサポートプランをすすめられる
    3. 「お金がない」と言うと、業者の指示で複数の貸金業者から短い期間に次々と借りるよう求められる（遠隔操作アプリで画面を共有させられたり、年収を偽って申告するよう言われたりする例もある）
    4. 支払った後に解約や返金を求めても、業者と連絡がとれなくなるおそれがある
  features:
  - 「簡単」「確実にもうかる」とうたうノウハウやサポートを売り込む
  - サポートの料金が高額で、数百万円になる例もある
  - 「すぐに返済できる」と言って借金をさせようとする
  - 名目は、アフィリエイトで稼ぐためのサポート費用、AIで作ったという競馬予想ソフトの代金、FX投資の資金などさまざま
  red_flags:
  - 支払いのために借金をすすめられる
  - 複数の貸金業者から次々に借りるよう指示される
  - 遠隔操作アプリを入れさせられる、年収を偽るよう言われる
  right_action: その場で契約や借り入れをしない。簡単に高額の収入が得られることはないと考え、一度立ち止まる。困ったら消費者ホットライン188に相談する。
  legit_contrast: 国民生活センターは、業者に「すぐに返済できる」と言われて借りた場合でも、返済の義務は借りた本人が負うとしている。ネットで申し込んだ契約は通信販売にあたり原則としてクーリング・オフできないが、電話で勧誘されて契約した場合は電話勧誘販売としてクーリング・オフを主張できる場合もある（広島県消費生活センター）。
  trend: 2026年5月、国民生活センターが、副業サポートや投資の名目で複数の貸金業者から次々に借りさせる手口が目立ち、20歳代以下の相談が多いとして注意喚起した
  sources:
  - publisher: 国民生活センター
    title: 副業サポートや投資の名目で借金させる業者に注意!−複数の貸金業者から次々と借り入れさせる手口が目立ちます−
    url: https://www.kokusen.go.jp/news/data/n-20260520_1.html
    published: 2026-05
  - publisher: 広島県消費生活センター
    title: （副業サイトの高額なサポートプランなどのトラブルに関する啓発ページ）
    url: https://www.pref.hiroshima.lg.jp/site/syouhiseikatsucenter/keihatsu05-1010.html
  - publisher: 愛知県
    title: （もうけ話で借金をさせる手口に関する資料。遠隔操作アプリの悪用など）
    url: https://www.pref.aichi.jp/uploaded/attachment/469364.pdf
  - publisher: 奈良県
    title: （もうけ話で借金をさせる勧誘に関する注意喚起）
    url: https://www.pref.nara.jp/secure/196393/R5.8.1.HP.pdf
    published: 2023-08
  - publisher: INTERNET Watch
    title: 「副業サポート」や「投資」をうたって若者を狙い、いくつも借金をさせる手口に、国民生活センターが注意喚起
    url: https://internet.watch.impress.co.jp/docs/news/2110573.html
    published: 2026-05
  question_ideas:
  - 副業の広告と「サポート担当」とのチャット画面を見せ、借金をすすめる発言などの危険なサインを選ぶ問題
  - 行動問題：「すぐ返せるから今日中に借りて」と言われたときの正しい対応を選ぶ
  - 「AIの競馬予想ソフトで簡単に稼げる」「お金がなければ借りてもすぐ返せる」という勧誘メッセージの危ない点を選ぶ問題
- id: EX-042
  kind: scam
  title: 「いいねを押すだけ」の簡単タスク副業で入金を求められる
  situation: S07
  channels:
  - sns
  - chat
  tactics:
  - T05
  - T11
  - T04
  - T07
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: 最初に本当に少額の報酬がもらえるため信じやすいが、「仕事なのに自分がお金を払う」という明確なサインがある
  flow: |
    1. SNSで「いいねを押すだけ」「動画を見るだけ」で稼げるという副業を知り、始める
    2. 最初は少額の報酬を受け取れる
    3. その後、「連帯責任になる」などの理由をつけて、数十万円の入金を求められる（借金をして払い、借金だけが残る例もある）
  features:
  - 作業が「いいねを押す」「動画を見る」など、とても簡単
  - 最初に一度、少額の報酬が実際に受け取れる
  - 「連帯責任」など、払わないと困ったことになるような理由をつける
  red_flags:
  - 報酬をもらう仕事なのに、自分がお金を入金するよう求められる
  - 少額の報酬を受け取った直後に、高額の入金の話が出てくる
  right_action: 報酬を受け取るためや作業を続けるためにお金を払うよう言われたら、払わずにやり取りをやめる。借金をしてまで払わない。困ったら消費者ホットライン188に相談する。
  trend: 2026年5月、国民生活センターが「簡単タスク副業」の被害が20〜30代で急増しているとして注意喚起した
  sources:
  - publisher: 国民生活センター
    title: （20〜30代に被害が急増中 簡単タスク副業に関する注意喚起）
    url: https://www.kokusen.go.jp/news/data/n-20260519_1.html
    published: 2026-05
  question_ideas:
  - 「いいねするだけで報酬」というSNS投稿と、その後のチャット（連帯責任を理由に入金を求める）を見せ、どの時点でやめるべきかを答える問題
  - 本物のアルバイト募集との比較で、「働く側がお金を払う」点のおかしさに気づく問題
- id: EX-043
  kind: scam
  title: 就職情報サービスや企業の採用担当者を名乗り、別のアプリへ誘導して登録料などを求める連絡
  situation: S07
  channels:
  - sms
  - email
  - sns
  tactics:
  - T01
  - T05
  - T06
  - T07
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: 実在する大手企業の名前を使うので求人の連絡として自然に見えるが、「別のアプリへ移る」「先にお金を払う」という分かりやすいサインがある
  flow: |
    1. 大手就職情報サービスの採用担当者や役員を名乗るSMSやメールが届く
    2. 求人の案内、業務委託、副業の紹介などを持ちかけ、詳しい説明は別のメッセージアプリで、と移動させる
    3. 初期費用・登録料・投資などの名目でお金を払わせようとする（個人情報や外部のリンクへ話を向けることもある）
  features:
  - 知名度の高い企業名を名乗って警戒心を下げる
  - フリーメールのアドレスや、企業名のつづりを少し変えたり余分な文字を足したりしたアドレスから届くことがある
  - 面接をしないまま採用を伝えたり、チャットアプリだけでやり取りを進めたりする
  red_flags:
  - 応募や採用の手続きなのに、お金の支払いを求められる
  - 企業の公式サイトに載っていない連絡先やメッセージアプリへ移るよう言われる
  - 会社のドメインではないメールアドレスから届く
  right_action: |
    メッセージ内のリンクや連絡先は使わず、企業の公式採用サイトや代表の連絡先で、その担当者や求人が本当にあるかを確かめる。
    別のアプリへの移動や、初期費用・登録料の支払いには応じない。被害の心配があるときは警察に相談する。
  legit_contrast: |
    求人検索サイトのヘルプによると、本物の採用担当者は多くの場合、会社のドメインのメールアドレスを使い、採用の前に本人と話をしようとする。応募するためにお金を送る必要は一切ない。
    応募や採用の手順でお金の支払いを求めることは一切ないと公表している企業もある。
  trend: 2026年1月、大手就職情報サービスが、自社の社員・役員やサービスをかたる詐欺を確認したとして注意を呼びかけたと報じられた。
  sources:
  - publisher: rocket-boys.co.jp（セキュリティ系ニュースサイト）
    title: マイナビを装った詐欺が発生 SMSやSNSを悪用したなりすまし手口に注意喚起
    url: https://rocket-boys.co.jp/?p=27516
    published: 2026-01
  - publisher: Indeed（求職者向けヘルプ）
    title: 採用企業や採用担当者からの不審な連絡を見極める方法についてのヘルプ記事（題名未確認）
    url: https://jp.indeed.com/help/job-seekers/articles/360040122511
  - publisher: Forbes JAPAN
    title: 偽の採用担当者の見分け方についての記事（題名未確認）
    url: https://forbesjapan.com/articles/detail/87543
  - publisher: ロックウェル・オートメーション（採用ページ）
    title: 採用ページ（応募・採用の手順で金銭を求めないという案内。題名未確認）
    url: https://rockwellautomation.com/ja-jp/careers/teams-people.html
  question_ideas:
  - 「〇〇キャリア 採用担当」を名乗るSMS（詳しくはメッセージアプリで・登録料が必要）と、会社ドメインのメールで面接日程を知らせる本物の連絡を並べて比べる問題
  - 難しい版：企業名のつづりが1文字違うアドレスから届く「面接なしで内定・研修費の振込が必要」という連絡を見抜く問題
  - 行動問題：「登録料の振込先を聞く」「公式採用サイトの窓口に問い合わせる」「言われたアプリを追加する」から最善を選ぶ
- id: EX-044
  kind: scam
  title: 就活の不安につけ込む「無料カウンセリング」から高額な就活セミナー・スクールの契約へ
  situation: S07
  channels:
  - ad
  - sns
  - chat
  tactics:
  - T04
  - T05
  - T07
  targets:
  - 学生
  level: normal
  level_reason: 入口が「無料の相談」で親切に見えるが、相談の場で高額な契約を迫る流れに気づけば見抜ける
  flow: |
    1. ネット広告やSNSで「無料カウンセリング」「就活の相談に乗る」という誘いを見つける。SNSで知り合った人からアドバイスを持ちかけられることもある
    2. Web会議で話を聞くと、就活への不安をあおられ、不意打ちのように高額なセミナーやビジネススクールの契約を勧められる
    3. その場での契約を迫られる（就活対策になるとうたうビジネス教材などの「もうけ話」を勧められる例もある）
  features:
  - 入口は「無料」「アドバイス」で、有料サービスを勧めることを先に知らせない
  - SNSで知り合った人からの一見親切な誘いがきっかけになる
  - アンケートへの回答をきっかけに無料セミナーへ誘われる例もある
  red_flags:
  - 無料のはずの相談の場で、高額な有料サービスを勧められる
  - 就活への不安をあおり、その場での決断を迫る
  right_action: その場では契約しない。一人で決めずに家族や学校の相談窓口など身近な人に相談し、困ったときは消費者ホットライン188に相談する。
  legit_contrast: 県の消費生活センターは、無料カウンセリングの内容や、有料サービスの勧誘があるかどうかを前もってよく確かめたうえで、Web会議に参加するか決めるよう呼びかけている。
  trend: 国民生活センターの機関誌は2025年4月号で「大学生の最新就活事情」を特集し、就活中の学生の不安につけ込むトラブルの相談が寄せられていること、背景にSNSやオンラインの活用があることを指摘した。2025年4月には地方紙の消費者相談欄でも、SNSで知り合った人に勧められた就活サポート契約が取り上げられた。
  sources:
  - publisher: 国民生活センター
