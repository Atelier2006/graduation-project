- id: EX-052
  kind: scam
  title: 奨学金の公的機関や回収会社を名乗る現金の要求や、「選考を通過した」という一方的な連絡
  situation: S08
  channels:
  - chat
  - email
  - sns
  tactics:
  - T01
  - T05
  - T07
  - T13
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: 返還が遅れたときの本物の督促の電話もあるので一律に無視はできないが、「その場で現金」「受け取りに手数料」というはっきりしたサインがある
  flow: |
    1. 奨学金を扱う公的機関の職員や、委託を受けた債権回収会社を名乗る人から、電話・訪問・はがきで連絡が来る
    2. たとえば訪問した人物が「高校の奨学金とまとめて返還金を払ってほしい」と現金を求める
    3. ネットでは、申し込んだ覚えのない奨学金について「選考を通過しました」「受給資格があります」と一方的に知らせ、手数料などを先に払わせようとする手口もある
  features:
  - 公的機関の職員、債権回収会社、その委託先などさまざまな名乗り方をする（公的機関が4つの類型を公表）
  - 「必ず奨学金がもらえる」と持ちかける
  red_flags:
  - 職員がその場で現金を集めようとする
  - 申し込んでいない奨学金の「選考通過」の知らせ
  - 奨学金を受け取るための手数料や申込金を求められる
  right_action: その場でお金を払わない。訪問なら身分証を確かめる。連絡に書かれた電話番号やリンクではなく、奨学金の公的機関の公式サイトや在籍している学校の奨学金窓口で、本当の連絡かを確かめる。
  legit_contrast: 公的機関の説明では、職員が直接現金を集めることはなく、返還の指導で訪問するときは職員が身分証を示す。貸与中の人に、学校を通さず職員から直接電話することもない。正規の奨学金で申込金や受給のための料金を請求されることはない。一方、返還が遅れたときの督促の電話は本物もあるので、無視せずに公式の窓口で確かめる。
  trend: 海外では、日本政府の奨学金の応募を代行するとうたう偽サイトが、「出願に手数料が必要」として留学生にお金を求める詐欺が問題になった。
  sources:
  - publisher: ScanNetSecurity
    title: 日本学生支援機構の職員を装った詐欺に注意を呼びかけ、4つの事例も紹介(JASSO)
    url: https://scan.netsecurity.ne.jp/article/2019/05/30/42391.html
    published: 2019-05
  - publisher: INTERNET Watch
    title: ネットリテラシー連載の奨学金をめぐる詐欺についての記事（題名未確認）
    url: https://internet.watch.impress.co.jp/docs/column/netliteracy/1669442.html
  question_ideas:
  - 「奨学金の返還金を職員が集金に伺います」という電話や、「給付型奨学金の選考を通過、手数料を振り込んでください」というメールを見抜く問題
  - 本物（学校の窓口から届く手続きの案内）と並べて比べる問題
- id: EX-053
  kind: legit
  title: 本物の役所・金融機関・電話会社が電話でしないこと
  situation: S08
  channels:
  - chat
  tactics:
  - T13
  - T01
  - T07
  targets:
  - 全世代
  level: easy
  level_reason: 「ATMで還付」「暗証番号を聞く」「電子マネーで支払い」「自動音声で電話停止」など、本物は絶対にしないことが決まっていて覚えやすい
  flow: |
    1. 役所や金融機関、電話会社を名乗る電話を受けたら、その場で操作や支払いをしない
    2. 届いている書類や契約先の公式サイトなどで連絡先を自分で調べ、その窓口に問い合わせる
    3. 判断に迷うときは「#9110」（警察相談専用電話）や「188」（消費者ホットライン）に相談する
  features:
  - 自治体・税務署・年金事務所などが、ATMでお金を返すことはない。市役所・区役所の還付金のお知らせは書面で届く
  - 公的機関の職員や銀行員が、キャッシュカードを預かったり暗証番号を聞いたりすることはない
  - 事業者や法務省・裁判所が、未納料金をコンビニの電子マネーで払わせることはない
  - 総務省や電話会社、警察などが、電話の停止を自動音声ガイダンスやSMSで知らせることはない
  red_flags:
  - 電話でATMやネットバンキングの操作を指示される
  - 電話で暗証番号やキャッシュカードの受け渡しの話が出る
  right_action: 電話の相手が教える番号ではなく、自分で調べた公式の窓口に問い合わせて確かめる。ATMでは携帯電話で話しながら操作しない。
  legit_contrast: 還付金詐欺・キャッシュカード詐欺盗・架空料金請求詐欺・電話会社をかたる自動音声は、どれも「本物が絶対にしないこと」をさせようとする点で見抜ける。
  sources:
  - publisher: 警察庁
    title: 還付金詐欺
    url: https://www.npa.go.jp/bureau/safetylife/sos47/case/refund/
  - publisher: 警察庁
    title: 架空料金請求詐欺
    url: https://www.npa.go.jp/bureau/safetylife/sos47/case/fictitious-billing/
  - publisher: 千葉市
    title: （ページ名未確認）医療費・保険料の還付金をかたる詐欺への注意
    url: https://www.city.chiba.jp/shimin/seikatsubunka/shohi/iryouhi-hokennryousagi.html
  - publisher: 埼玉県
    title: （ページ名未確認）オレオレ詐欺などの手口の解説
    url: https://www.pref.saitama.lg.jp/a0311/hurikomesagi/oreore-teguchi.html
  - publisher: 金融庁
    title: （ページ名未確認）キャッシュカードをだまし取る手口への注意
    url: https://www.fsa.go.jp/ordinary/cashcard_theft.html
  - publisher: 京都府
    title: （ページ名未確認）電話の停止をかたる自動音声などへの注意喚起
    url: https://www.pref.kyoto.jp/shohise/1292569071782.html
  question_ideas:
  - 「本物ならしないこと」を4択から選ぶ問題（例：「ATMで還付金を受け取る手続きを電話で案内する」）
  - 比較問題：本物の還付のお知らせ（書面）と、電話でATMへ誘導する案内を並べる
- id: EX-054
  kind: legit
  title: 役所や国は、給付金の手続きでATMの操作や手数料の振込、メールのURLからの申請をさせない
  situation: S08
  channels:
  - email
  tactics:
  - T03
  - T07
  - T13
  targets:
  - 全世代
  level: easy
  level_reason: 「絶対にしない」と明示されているポイントが複数あり、注意喚起も多い
  flow: |
    1. 市区町村や国の役所が、給付金についてATMの操作をお願いすることはない
    2. 受け取りの条件として手数料の振込を求めることもない
    3. メールのURLをクリックさせて申請手続きをさせることもない（市町村や携帯電話会社などのメールからURLで申請させることはない、と警察も注意している）
  features:
  - 本物の給付金の手続きでは、上の3つを求めない
  - これらは2020年に国の給付金が配られた際の注意喚起で示された内容
  red_flags:
  - 給付金を名目に、ATMへ行って操作するよう言われる
  - 受け取りのために手数料を振り込むよう言われる
  - メールやSMSのURLから、銀行名・口座番号・氏名などを入力させる
  right_action: 給付金をかたる不審な電話やメールがあったら、応じずに、最寄りの警察署や警察相談専用電話「#9110」などに相談する。
  legit_contrast: 給付金をかたる偽のメールでは、リンク先で銀行名・口座番号・氏名などの入力を求められる（2020年の警察の注意喚起）。
  sources:
  - publisher: 福岡市
    title: 給付金をかたる詐欺への注意の資料（題名未確認）
    url: https://www.city.fukuoka.lg.jp/keizai/bunka/business/documents/attention.pdf
  - publisher: 富山県警察
    title: 給付金をかたる詐欺メールへの注意の資料（題名未確認）
    url: https://police.pref.toyama.jp/documents/1389/r02_17.pdf
  question_ideas:
  - 「給付金の手続きのためATMへ行ってください」「手数料を振り込めば給付金を受け取れます」という連絡を見抜く問題
  - ○×問題：「役所が給付金の手続きでATMの操作をお願いすることがある」（×）
- id: EX-055
  kind: legit
  title: 本物の税務の連絡：SMSで納付や差押えを求めず、電子申告のお知らせメールには原則URLがない
  situation: S08
  channels:
  - email
  - sms
  tactics:
  - T01
  - T13
  targets:
  - 全世代
  level: normal
  level_reason: 本物のお知らせメール自体は届くため、「税務関係のメールはすべて偽物」ではない。どこが違うかを知っておく必要がある
  flow: |
    1. 国の電子申告・納税システムに登録している人には、決まった形式のお知らせメールが届くことがある
    2. そのメールは税金の納付を求めず、原則として本文にURLを載せない
    3. 国税庁・国税局・税務署は、SMSやメールで差押えの連絡をしない。納税者の同意がない限りメールで納付を求めず、SMSでURL付きの案内も送らない
  features:
  - 電子申告システムの登録者あてに届く、定型のお知らせメール
  - メール本文に原則としてURLがない
  - 税金の納付や差押えについて、SMS・メールでは連絡しない
  red_flags:
  - URL付きの税務署名義のSMSや、納付・差押えを求めるメールが届いたら偽物と考える
  right_action: 気になる連絡が来たら、メールやSMSのリンクは使わず、自分で調べた国税庁・税務署の窓口に確かめる。不安なときは消費生活センター（消費者ホットライン188）にも相談できる。
  legit_contrast: 偽物は「24時間以内に払わないと差押え」などと急がせ、コード決済の送金やカード情報の入力を求める（R1-08を参照）。
  sources:
  - publisher: 国民生活センター
    title: （ページ名未確認）国税庁やe-Taxをかたる不審なSMSやメールに関する注意喚起
    url: https://www.kokusen.go.jp/news/data/n-20260527_1.html
    published: 2026-05
  - publisher: INTERNET Watch
    title: メールで税金の納付を求めることはありません! 国税庁やe-Taxをかたる不審なメールに、国民生活センターが注意喚起
    url: https://internet.watch.impress.co.jp/docs/news/2112792.html
  question_ideas:
  - 本物の定型お知らせメール（URLなし）と、偽の差押え予告メールを並べて本物を選ばせる問題
  - 「税務署からのSMSにURLがある」は偽物、と判断する○×問題
- id: EX-056
  kind: legit
  title: 本物の水道料金の連絡：マイページ登録者だけにメール、リンク先で個人情報は求めない
  situation: S08
  channels:
  - email
  - sms
  tactics:
  - T01
  - T04
  targets:
  - 全世代
  level: normal
  level_reason: 自治体によっては本物の支払い案内メールもあるため、「自分が登録しているか」「リンク先で何を求めるか」で区別する必要がある
  flow: |
    1. 水道局のマイページ（会員サービス）に登録している人には、支払いに関するメールが届くことがある（大阪市の例）
    2. 本物のメールでも、リンク先で個人情報の入力を求めることはない
    3. マイページを使っていない人に料金のメールが届くことはない。料金の請求や給水停止をSMSやメールで案内しない自治体もある（横浜市・神奈川県）
  features:
  - 自分で登録した会員サービスのアドレスにだけ届く
  - 給水停止の予告や、カード情報の入力は求めない
  red_flags:
  - 登録していないのに水道料金のメールやSMSが届く
  - リンク先でカード番号などを入力させる
  right_action: 気になるときは、メールやSMSのリンクではなく、自分で検索した水道局の公式サイトやお客さまセンターで確かめる。
  legit_contrast: 偽物は「本日中に払わないと水が止まる」と急がせ、カード情報を入力させる（R1-07を参照）。
  sources:
  - publisher: 大阪市水道局
    title: （ページ名未確認）大阪市水道局を名乗る虚偽のSMSに関する報道発表
    url: https://www.city.osaka.lg.jp/hodoshiryo/suido/0000683544.html
  - publisher: 横浜市水道局
    title: （ページ名未確認）水道局を名乗る不審なメール・SMSへの注意
    url: https://www.city.yokohama.lg.jp/kurashi/sumai-kurashi/suido-gesui/suido/toiawase/hushinnsya.html
  - publisher: ScanNetSecurity
    title: 水道料金請求や給水停止をSMSやメールで案内することはない ~「水道料金を支払わなければ給水を停止する」メールに神奈川県が注意呼びかけ
    url: https://scan.netsecurity.ne.jp/article/2026/07/13/55682.html
    published: 2026-07
  question_ideas:
  - 本物のマイページ通知（個人情報を求めない）と偽SMSを比べる問題
  - 「登録していないのに届いた」点に気づく問題
- id: EX-057
  kind: legit
  title: 奨学金の本物の連絡は学校を通して届き、職員が現金を集めに来ることはない
  situation: S08
  channels:
  - email
  - chat
  tactics:
  - T01
  - T07
  - T13
  targets:
  - 学生
  level: normal
  level_reason: 返還が遅れたときの督促の電話など本物の連絡もあるので、仕組みを知ったうえで確かめる必要がある
  flow: |
    1. 在学中の奨学金の手続き（在籍の報告など）は、大学からメールや掲示で案内される。大事な連絡は大学に登録したメールアドレスや郵送で届くと案内している大学もある
    2. 留学生向けの国の奨学金（学習奨励費）は、大学を通じて申し込む
    3. 奨学金を扱う公的機関の職員が直接現金を集めることはなく、返還の指導で訪問するときは身分証を示す。貸与中の人に、学校を通さず職員から直接電話することもない
  features:
  - 正規の奨学金では、申込金や受給のための料金を求められない
  - 返還が遅れたときには、督促の電話がかかってくることがある（本物もある）
  red_flags:
  - 学校を通さない直接の連絡で、お金や口座情報を求める
  - 申し込んでいない奨学金の「選考通過」の知らせ
  right_action: 連絡に書かれた番号やリンクは使わず、在籍している学校の奨学金窓口や、奨学金の公的機関の公式サイトに載っている窓口で確かめる。
  legit_contrast: 偽物は、職員や債権回収会社を名乗ってその場で現金を求めたり、「選考を通過した」と一方的に知らせて手数料を求めたりする。
  sources:
  - publisher: ScanNetSecurity
