  flow: |
    1. 公式アカウントがキャンペーンを告知する
    2. 当選者には、キャンペーンを行った公式アカウントを通じて、決めた期限までに連絡する
    3. 公式アカウント以外のアカウントから当選の連絡をすることはない
  features:
  - 送り主が、キャンペーンを告知した公式アカウントそのものである
  - DMで個人情報を求めたり投資を勧めたりしないと明記している企業・団体もある
  red_flags:
  - キャンペーンを行ったアカウントとIDが違うアカウントからの当選連絡
  - DMのリンク先で個人情報の入力を求める
  right_action: 当選の連絡が来たら、送り主が公式サイトに載っている公式アカウントと同じかを確かめる。違うアカウントからのDMは開かずに削除し、送り主をブロックする。不審なDMや投稿のリンクにはアクセスしない。
  legit_contrast: 偽アカウントは、本物と同じプロフィール画像や説明文を使ったり、一般の利用者を名指しして本物の抽選に当たったように見せたりする。
  trend: 2025〜2026年にかけて、携帯電話会社（2025年9月）、金融機関（2025年10月）、自治体（2026年1月）が、公式アカウントになりすましたDMへの注意を呼びかけている。
