  - 「サポート料金の100円をネットバンキングで払ってください」と言われる会話を見せ、どこで止めるべきかを選ぶ問題
  - 難しい版：遠隔操作中の送金確認画面（自分が入力した額より桁が多い）を見せ、何が起きているかと次の行動を答える問題
- id: EX-066
  kind: scam
  title: 広告をクリックした直後に偽のウイルス警告が出る（不正広告から始まるサポート詐欺）
  situation: S11
  channels:
  - ad
  - web
  tactics:
  - T04
  - T08
  - T10
  targets:
  - 全世代
  level: normal
  level_reason: 入口の広告は普通に見え、同じ広告でも条件によって詐欺サイトに飛ぶときと飛ばないときがある。ただし飛んだ先の警告画面は典型的な特徴で見抜ける
  flow: |
    1. Webサイトやアプリに表示された広告をクリック（タップ）する
    2. 広告主の普通のページを経由したあと、「ウイルスに感染」などの偽の警告画面に切り替わる
    3. 画面の電話番号に電話をかけさせ、遠隔操作や支払いに誘導する（R3-01と同じ流れ）
  features:
  - 広告そのものは、普通の商品やサービスの広告に見える
  - 広告から直接ではなく、普通に見えるページを経由してから詐欺サイトに切り替わる
  - パソコンかスマホかなど、見ている人の条件によって詐欺サイトが出るときと出ないときがある
  red_flags:
  - 広告をクリックしただけで、広告の内容と関係のない「ウイルス感染」の警告が出る
  - 警告画面に電話番号が出て、電話をうながす
  right_action: 表示された電話番号に電話せず、Escキーの長押しで全画面を解除してブラウザを閉じる（IPAの案内）。広告から開いたページでは、ソフトのインストールや情報の入力をしない。
  legit_contrast: IPAは、閲覧中に出る偽の警告は閉じれば消えるものとして閉じ方を案内している。広告から来た画面かどうかに関係なく、画面上の電話番号は使わない。
  trend: セキュリティ企業の分析（2023年）で、広告をクリックすると広告主のページを経由し、特定の条件に合う閲覧者のときだけサポート詐欺サイトに切り替わる例が確認された。国民生活センターにも、広告をクリックしたらウイルス感染と表示され、電話をしてしまったという相談事例が寄せられている。
  sources:
  - publisher: デジタルアーツ
    title: 【セキュリティレポート】 広告クリックにおけるサポート詐欺の手口をデジタルアーツが分析 特定条件に合致する場合に限り、ランディングページからリダイレクトしサポート詐欺サイトが表示
    url: https://digitalpr.jp/r/76707
