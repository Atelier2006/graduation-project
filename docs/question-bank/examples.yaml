    url: https://www.hokkaidobank.co.jp/info/uploads/15906462711629401258.pdf
  question_ideas:
  - 「銀行協会の者です。キャッシュカードを確認のためお預かりします」という電話への正しい対応を選ぶ問題
  - ○×問題：「銀行員が自宅に来て、タブレットで暗証番号を入力させることがある」（×）
- id: EX-021
  kind: legit
  title: 本物のログイン画面にたどり着く方法と確かめ方（ブックマーク・公式アプリ・多要素認証）
  situation: S03
  channels:
  - web
  tactics:
  - T02
  - T06
  targets:
  - 全世代
  level: normal
  level_reason: 偽のログイン画面は見た目では区別しにくいので、「どこから開いたか」で判断する習慣が必要
  flow: |
    1. 銀行や証券会社のサイトは、正しいURLをあらかじめブックマークに登録しておき、そこから開く（または公式アプリを使う）
    2. メールやSMSで「確認が必要」と言われても、リンクは開かず、ブックマークや公式アプリから自分でログインして確かめる
    3. ログイン時・取引時・出金時の追加認証（多要素認証）と、取引の通知サービスを設定しておく
  features:
  - 金融機関は、SMSなどでIDやパスワードを問い合わせない
  - 正規に似たドメインの偽サイトも多く、見た目での判断は非常に難しいとされている
  - リアルタイムフィッシングへの対策として、パスキーが注目されている
  red_flags:
  - （偽物の特徴）メールやSMSのリンクからログイン画面に誘導される
  - （偽物の特徴）URLのドメインが公式のものと少し違う
  right_action: ログインはブックマークか公式アプリから行う。パスワードは使い回さず、多要素認証と通知サービスを有効にする。不審なサイトに入力したかもしれないときは、すぐに金融機関の窓口に連絡してパスワードを変える。
  legit_contrast: 偽物はメールやSMSのリンクから始まり、本物そっくりの画面でワンタイムパスワードまで入力させる（R3-10）。本物かどうかは画面の見た目ではなく、自分で開いた経路（ブックマーク・公式アプリ）とURLで判断する。
  sources:
  - publisher: ScanNetSecurity（金融庁の注意喚起の報道）
    title: 10 月の不正取引件数は 333 件に ~ 金融庁、インターネット取引サービスへの不正アクセス・不正取引に注意を呼びかけ
    url: https://scan.netsecurity.ne.jp/article/2025/11/27/54109.html
    published: 2025-11
  - publisher: 金融庁
    title: インターネットバンキングの不正送金に関する注意喚起資料（題名は要約）
    url: https://www.fsa.go.jp/ordinary/internet-bank_2/10.pdf
