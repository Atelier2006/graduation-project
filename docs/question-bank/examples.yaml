    url: https://www.pref.saitama.lg.jp/b0304/shohisoudan/jirei/tsuhan/20170825.html
    published: 2017-08
  - publisher: 福岡県
    title: （SNSで知り合った相手との個人間取引の相談事例を含む資料）
    url: https://www.pref.fukuoka.lg.jp/uploaded/attachment/31943.pdf
