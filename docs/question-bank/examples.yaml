# 事例集（公的機関などの注意喚起から集めた、実際の手口と本物の連絡の特徴）
# 本文では実在の企業名を業種に置き換えている。危険なURL・電話番号は書かない。
# 確認日：2026-10-09。出典は検索結果から取得したもので、公開前に人が開いて確かめる。

- id: EX-001
  kind: scam
  title: 米やブランド品が極端に安い偽の通販サイト
  situation: S01
  channels:
  - web
  tactics:
  - T15
  - T05
  - T07
  targets:
  - 全世代
  level: easy
  level_reason: 安すぎる値段、不自然な日本語、個人名義の振込先、会社情報の不足など見抜くポイントが多く、注意喚起も多い
  flow: |
    1. ネットで、品薄の商品や米・ブランド品が不自然なほど安く売られている通販サイトを見つける
    2. 注文すると支払い方法が限られていて、個人名義の銀行口座への振込を指示される
    3. 代金を払っても商品が届かず、問い合わせても連絡がつかない
  features:
  - 市場で手に入りにくい商品が買えるようになっている
  - 米やブランド品の値段が不自然に安い
  - サイトの日本語の表記や言い回しが不自然
  - キャンセル・返品・返金のルールが書かれていない
  - 事業者の名称・住所・電話番号が書かれていない（書かれていても、検索すると無関係な情報が出てくる）
  - 問い合わせ先がフリーメールだけで、電話がつながらない
  red_flags:
  - 振込先が個人名義の口座になっている
  - 支払い方法が銀行振込などに限られている
  - 会社情報を調べても、その事業者の通販サイトだと確かめられない
  right_action: |
    注文の前に、事業者の名称・住所・電話番号、返品やキャンセルのルール、支払い方法を確かめる。個人名義の口座には振り込まない。
    被害にあったら、すぐにクレジットカード会社や振込先の銀行に連絡し、警察にも届け出る。相談先は消費者ホットライン188、海外の事業者なら国民生活センターの越境消費者センター、警察相談専用電話（#9110）。
  legit_contrast: 国民生活センターは、事業者の名称・住所・電話番号や返品・返金のルールが書かれていないことを怪しいサイトの特徴に挙げている。正規の通販サイトかどうかは、これらが明記され、内容が実在の事業者と一致するかで確かめる。
  trend: 2025年7月、国民生活センターが、米やブランド品が安く買えるとうたう通販サイトで「代金を払ったのに商品が届かない」などの相談が寄せられているとして注意を呼びかけた
  sources:
  - publisher: 国民生活センター
    title: 見守り新鮮情報 第515号（怪しい通販サイトにご注意）
    url: https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen515.html
    published: 2025-07
  - publisher: 栃木県
    title: （見守り新鮮情報 第515号の転載ページ）
    url: https://www.pref.tochigi.lg.jp/c03/life/shouhi/seikatsu/kouhou/0703shinnsenn515.html
    published: 2025-07
  - publisher: 奈良県消費生活センター
    title: （ネット通販の偽サイトに関する啓発資料。個人名義の口座を指定されたら詐欺と注意）
    url: https://www3.pref.nara.jp/syouhiseikatsucenter/secure/2091/R6.8.kozika.pdf
    published: 2024-08
  question_ideas:
  - 偽の通販サイトの商品ページと会社情報ページを見せ、おかしな点を3つ選ぶ問題（易しい版）
  - 見た目は整っているが、振込先が個人名義で会社情報が足りない点だけで見抜く問題（難しい版）
  - 行動問題：注文後に個人名義の口座を指定されたときの最善の行動を選ぶ
- id: EX-002
  kind: scam
  title: 大手ECサイトをかたる「お荷物の配送に問題」「会員の更新」メール
  situation: S01
  channels:
  - email
  - sms
  tactics:
  - T01
  - T04
  - T06
  targets:
  - 全世代
  level: normal
  level_reason: 典型的な手口だが、件名に実在サービス名を入れ、配送や会員手続きという普段の通知に近い内容のため、荷物を待っている人ほど信じやすい
  flow: |
    1. 大手ECサイトを名乗るメール（SMSの場合もある）が届き、「お荷物の配送に問題が発生しました」「会員の更新ができません」「パスワードの入力に何度も失敗しました」などと知らせる
    2. 問題を解決する手続きとして、本文のリンクから本物に似せたログイン画面（偽サイト）へ誘導する
    3. 偽サイトでアカウントのID・パスワードや、クレジットカード情報を入力させる
  features:
  - 件名の先頭に【大手ECサイト名】を付け、配送トラブル・会員の更新・ログインの異常などを知らせる
  - メールだけでなく、同じ業種をかたるSMSも目立っている（2026年6月）
  - 2026年7月の報告では、大手ECサイトをかたるものが全体の約37%で最も多かった
  red_flags:
  - 本文のリンク先のドメインが公式サイトと違う
  - 配送や会員の手続きなのに、カード情報の入力まで求める
  - 身に覚えのない配送トラブルや手続きの知らせ
  right_action: メールやSMSのリンクは開かず、公式アプリかブックマークした公式サイトに自分でログインし、注文履歴やアカウントの画面に同じ知らせがあるか確かめる。入力してしまったら、すぐにパスワードを変え、カード会社に連絡する。
  legit_contrast: 本物かどうかは、公式アプリや自分で開いた公式サイトにログインして、注文履歴やアカウントの画面に同じ内容が出ているかで確かめる。
  trend: 2026年7月の報告で大手ECサイトをかたるフィッシングが急増し、全体の約37%で1位になった。2026年6月には、乗っ取られたメールアカウントから「配送に問題」という件名のメールが送られた例も報告された
  sources:
  - publisher: ScanNetSecurity
    title: 2026年7月のフィッシング報告状況、Amazon をかたるフィッシングが急増
    url: https://scan.netsecurity.ne.jp/article/2026/08/27/56042.html
    published: 2026-08
  - publisher: ScanNetSecurity
    title: 国内 ISP の認証情報を不正利用して送信されたフィッシングメールに注意呼びかけ
    url: https://scan.netsecurity.ne.jp/article/2026/07/06/55635.html
    published: 2026-07
  - publisher: トビラシステムズ（PR TIMES）
    title: トビラシステムズ 特殊詐欺・フィッシング詐欺に関するレポート(2026年6月)
    url: https://prtimes.jp/main/html/rd/p/000000247.000034282.html
    published: 2026-07
  - publisher: ScanNetSecurity
    title: Amazonプライム会員の更新のためにカード情報を登録させるニセメール(フィッシング対策協議会)
    url: https://scan.netsecurity.ne.jp/article/2019/01/16/41836.html
    published: 2019-01
  - publisher: ScanNetSecurity
    title: 「パスワード入力に数回失敗」とリンク先へ誘導するAmazon偽メール(フィッシング対策協議会)
    url: https://scan.netsecurity.ne.jp/article/2020/03/31/43890.html
    published: 2020-03
  question_ideas:
  - 本物の配送状況（公式アプリの注文履歴の表示）と「配送に問題」メールを並べて比べる問題
  - 差出人名と件名は本物そっくりで、リンク先のドメインだけが違う版（normal〜hard）
  - 行動問題：「公式アプリを開いて注文履歴を確かめる」が最善
- id: EX-003
  kind: scam
  title: SNS広告で大手メーカーの名前を出し、広告と違う商品を届ける通販
  situation: S01
  channels:
  - ad
  - web
  tactics:
  - T01
  - T15
  targets:
  - 全世代
  level: normal
  level_reason: 広告は大手メーカーの名前を使って本物らしく見え、注文する前には違いが分かりにくい
  flow: |
    1. SNSに「大手電機メーカーが開発」などとうたう商品の広告が表示される
    2. 広告から通販サイトに進み、商品を注文して支払う
    3. 届いた商品は広告と関係のない別物で、まったく役に立たない
  features:
  - 有名企業の名前を出して信用させる
  - SNSの広告から通販サイトへ直接誘導する
  red_flags:
  - 「大手メーカーが開発」などの宣伝文句が、そのメーカーの公式情報で確かめられない
  - SNSの広告から、聞いたことのない通販サイトに誘導される
  right_action: 広告の宣伝文句をうのみにせず、メーカーの公式サイトで本当にその商品があるか、販売サイトに事業者名・所在地・連絡先が書かれているかを確かめてから買う。トラブルになったら消費者ホットライン188に相談する。
  trend: 国民生活センターは2025年11月、広告と異なる商品が届くネット通販について注意を呼びかけ、SNS広告を見て大手電機メーカーが開発したという暖房器具を買ったが、無関係の物が届いてまったく暖まらなかった相談などを紹介した。
  sources:
  - publisher: INTERNET Watch（国民生活センターの注意喚起の報道）
    title: 国民生活センター、広告と異なる商品が届くネット通販に注意喚起（題名は要約）
    url: https://internet.watch.impress.co.jp/docs/news/2068319.html
    published: 2025-11
  question_ideas:
  - SNS広告の画面と届いた商品の写真を並べ、買う前にどこを確かめるべきだったかを選ぶ問題
  - 広告から開いた販売サイトの会社情報ページを見せ、怪しい点を探す問題
- id: EX-004
  kind: scam
  title: 「欠品のためコード決済で返金します」と言って送金させる返金詐欺
  situation: S01
  channels:
  - web
  - email
  - chat
  tactics:
  - T15
  - T06
  - T07
  targets:
  - 全世代
  level: normal
  level_reason: 「返金」という安心させる言葉で始まり、操作中は送金だと気づきにくいが、メッセージアプリへの誘導や画面共有という分かりやすいサインがある
  flow: |
    1. 安い通販サイトで商品を注文し、代金を払う
    2. 「欠品のため返金します」と連絡があり、返金の手続きのためにメッセージアプリの友だち登録を求められる
    3. 「コード決済アプリで返金する」と言われ、相手の指示どおりに操作すると、返金ではなく自分から相手へ送金してしまう（画面共有をさせられて銀行口座の暗証番号を知られた例もある）
  features:
  - 最初の購入先は、日本語が不自然、品薄の商品がある、相場よりかなり安い、支払いが銀行振込や電子マネーに限られる、といった特徴のサイト
  - 返金の連絡が、メールからメッセージアプリでのやり取りに移される
  - 相手が操作を一つずつ指示してくる
  - 自分で操作して送金するため、不正利用として検知されにくく、その場で気づかないと送金が終わってしまう
  red_flags:
  - 「〇〇ペイで返金します」と言われる
  - 返金なのに、自分のアプリで金額を入れたり送金の操作をしたりさせられる
  - 友だち登録や画面共有を求められる
  right_action: 返金のためにアプリの操作や画面共有を求められたら、その場で操作をやめ、メッセージアプリでのやり取りにも移らない。送金してしまったら、すぐに消費者ホットライン188や警察相談専用電話（#9110）に相談する。
  legit_contrast: 通販の業界団体は、国民生活センターや業界団体が特定の事業者の取引に協力することはないと注意している。公的機関や団体の名前を出されても、それだけで信用しない。
  trend: コード決済での返金を口実に送金させる詐欺の相談は、2025年度は11月末までに5,107件と過去最多になったと報じられている
  sources:
  - publisher: Impress（INTERNET Watch）
    title: 通販サイトの返金手続きを装い、だまして購入者に送金させる詐欺が引き続いて発生中!  国民生活センターが注意喚起
    url: https://internet.watch.impress.co.jp/docs/news/2066353.html
    published: 2025-11
  - publisher: 秋田魁新報
    title: コード決済詐欺、相談過去最多に 5千件、利用者に注意呼びかけ
    url: https://www.sakigake.jp/news/article/20251229CO0080/
    published: 2025-12
  - publisher: 日本通信販売協会
    title: （返金を装う詐欺と、団体名の悪用に関する注意喚起）
    url: https://jadma.or.jp/pdf/2024/0731attention.pdf
    published: 2024-07
  question_ideas:
  - 「欠品のため返金します」のメールと、メッセージアプリでのやり取りの画面を見せ、危ないポイントを選ぶ問題
  - 行動問題：「画面を共有しながら返金の手続きをしましょう」と言われたときの正しい行動を選ぶ
- id: EX-005
  kind: scam
  title: SNS・動画広告の「初回お試し」「定期縛りなし」が実は定期購入
  situation: S01
  channels:
  - ad
  - web
  tactics:
  - T05
  targets:
  - 全世代
  level: normal
  level_reason: 広告や販売ページは普通の通販に見え、条件は最終確認画面などを読まないと分からない
  flow: |
    1. SNSや動画の広告で、「初回お試し価格」「定期縛りなし」などとうたうダイエットサプリなどを見て、1回だけのつもりで注文する
    2. 実際は解約するまで商品が届き続ける定期購入の契約で、2回目、3回目と商品が届き、2回目以降は高い代金を請求される
    3. 納品書に書かれた「次回お届け予定日」などを見て、初めて定期購入だったと気づく
  features:
  - 「初回実質0円（送料のみ）」「1回目90％OFF」など、初回の安さを強く打ち出している
  - 「定期縛りなし」「回数縛りなし」と書かれていても、解約しない限り続く定期購入のことがある
  - 定期購入であることや、2回目以降の価格・解約の方法が目立たない
  red_flags:
  - 注文の最終確認画面に、定期購入が条件であること、継続期間や回数、支払総額、解約の方法が書かれている
  - 「縛りなし」という言葉だけで、1回限りの購入だと思い込んでしまう
  right_action: 注文を確定する前に、最終確認画面で、定期購入が条件になっていないか、期間や回数の決まり、支払総額、解約の連絡方法を確かめる。契約条件が書かれた画面はスクリーンショットで保存しておく。通信販売にはクーリング・オフがないので、困ったら早めに消費者ホットライン188に相談する。
  legit_contrast: ネット通販では、注文前の最終確認画面で定期購入の条件や支払総額、解約方法を確かめられる。国民生活センターはその確認項目を「最終確認画面チェックリスト」にまとめている。
  trend: 国民生活センターは2025年1月に「定期縛りなし」の誤解について注意を呼びかけ、2026年にも巧妙化する定期購入トラブルとして注意喚起が続いている
  sources:
  - publisher: ECのミカタ
    title: 「定期縛りなし」が「解約するまで続く定期購入」だと思わなかった相談事例 国民生活センターが注意喚起
    url: https://ecnomikata.com/ecnews/45999
  - publisher: 国民生活センター
    title: 見守り新鮮情報 第487号（その申込み、定期購入ではありませんか？最終確認画面チェックリスト）
    url: https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen487.html
    published: 2024-07
  - publisher: 国民生活センター
    title: （「お試し」のつもりが定期購入になるトラブルの解説ページ）
    url: https://www.kokusen.go.jp/soudan_topics/data/subscription_traps.html
  - publisher: 国民生活センター
    title: （定期購入トラブルに関する注意喚起。1回限りのつもりが2回目以降も届く事例）
    url: https://www.kokusen.go.jp/news/data/n-20240312_1.html
    published: 2024-03
  - publisher: Impress（INTERNET Watch）
    title: インフルエンサーが言ってたのと違う!? 巧妙化する定期購入トラブルに国民生活センターが注意喚起
    url: https://internet.watch.impress.co.jp/docs/news/2106190.html
    published: 2026-05
  question_ideas:
  - SNS広告、商品ページ、最終確認画面の順に見せ、定期購入の条件が書かれている場所を見つける問題
  - 「定期縛りなし」と書かれた広告を見せ、1回だけの購入だと言い切れるかを判断する問題
- id: EX-006
  kind: scam
  title: 店の支払い用QRコードの上に偽のQRコードを貼り、偽の決済画面へ誘導する
  situation: S01
  channels:
  - web
  tactics:
  - T01
  - T06
  targets:
  - 全世代
  level: hard
  level_reason: 貼られたQRコードは見た目では区別しにくく、指で触る・店員に聞くなど確かめる行動が必要
  flow: |
    1. フードコートなどに置かれた支払い用のQRコードの上に、偽物のQRコードのシールが貼られている
    2. 読み取ると偽の決済画面が開き、クレジットカード情報を入力させる
  features:
  - 正規のQRコードと見た目がほとんど同じ
  - 読み取るまで、どのサイトにつながるか分からない
  red_flags:
  - QRコードの部分だけシールが重ねて貼られている（触ると段差がある）
  - 読み取った後に表示された内容（店名やURL）が、そのお店や決済サービスと合わない
  right_action: 読み取る前にQRコードを指で触って、上から貼られていないか確かめる。少しでも怪しいと感じたら店員に確認する。読み取った後は、表示された内容を確かめてから進む（警視庁の案内）。
  trend: 警視庁は2026年7月にもQRコードを悪用した手口のページを更新し、QRコードの貼り替えや、偽のメールに載せたQRコードによる手口に注意を呼びかけている。
  sources:
  - publisher: 警視庁
    title: QRコードを悪用した手口と対策（題名は要約）
    url: https://www.keishicho.metro.tokyo.lg.jp/kurashi/cyber/notes/qrcord.html
    published: 2026-07
  question_ideas:
  - お店のQRコードの写真（シールが重ねて貼られている）を見せ、読み取る前にすべきことを選ぶ問題
  - 読み取った後の決済画面の店名やURLが合わない画面を見せ、続けるかどうかを判断する問題
- id: EX-007
  kind: scam
  title: フリマの出品写真を流用し、コード決済の「送る」で払わせる悪質通販サイト
  situation: S01
  channels:
  - web
  - email
  tactics:
  - T15
  - T07
  targets:
  - 全世代
  level: hard
  level_reason: 実在する一点ものの写真や本物らしい説明文が使われ、見た目では正規の販売ページと区別しにくい
  flow: |
    1. 探していた一点ものの商品が通販サイトで売られているのを見つける（写真や説明文はフリマサイトなどから流用されたもの）
    2. 支払いに、コード決済サービスの「送る」機能を使うよう指示され、個人名や電話番号のような名前のアカウントへ送金する
    3. 商品が届かず、事業者と連絡がとれなくなる。「欠品した」とメールが来て、返金の連絡はメッセージアプリでと言われた例もある
  features:
  - 実在する一点ものの写真や、具体的でリアルな説明文が載っている
  - 支払い方法として、コード決済サービスの「送る」機能を指定される
  - 送金先のアカウント名が個人名や電話番号のようになっている
  - 欠品を知らせるメールの書体や文面が、それまでのメールと違い外国語のように見えることがある
  red_flags:
  - お店（事業者）への支払いなのに、個人間でお金をやり取りする「送る」機能を使わせる
  - 送金先が個人のアカウント
  - 返金などの連絡をメッセージアプリに移そうとする
  right_action: コード決済の「送る」で個人のアカウントに払うよう言われたら、購入をやめる。購入前にサイトの特徴を慎重に確かめ、困ったときは消費者ホットライン188（海外の事業者なら国民生活センターの越境消費者センター）に相談する。
  legit_contrast: 国民生活センターによると、コード決済の「送る」機能は一般に個人間のやり取りに使うもので、事業者に代金を払うときは「支払う」機能を使う。
  trend: 2026年6月、国民生活センターが、悪質通販サイト情報の公表開始から2年を機に、フリマサイトの画像・文言の流用やコード決済の「送る」機能を使わせる手口を紹介して注意を呼びかけた
  sources:
  - publisher: 国民生活センター
    title: （海外に拠点があるとみられる悪質通販サイトに関する注意喚起。越境消費者センターによる悪質通販サイト情報の公表から2年）
    url: https://www.kokusen.go.jp/news/data/n-20260617_1.html
    published: 2026-06
  - publisher: ECのミカタ
    title: 国民生活センター、「悪質通販サイト」 手口・相談内容を公開し注意喚起
    url: https://ecnomikata.com/ecnews/50908/
    published: 2026-06
  - publisher: 広島県消費生活センター
    title: （国民生活センターの悪質通販サイトに関する注意喚起の紹介）
    url: https://www.pref.hiroshima.lg.jp/site/syouhiseikatsucenter/keihatsu08-0622-2.html
    published: 2026-06
  question_ideas:
  - 本物らしい一点ものの商品ページと支払い案内を見せ、「送る」機能で個人あてに払わせる点に気づけるかを問う難しい問題
  - コード決済の「支払う」画面と「送る」画面を並べ、お店への支払いに使うのはどちらかを選ぶ問題
- id: EX-008
  kind: legit
  title: 正規の通販サイトかどうかを買う前に確かめる方法
  situation: S01
  channels:
  - web
  tactics:
  - T15
  - T02
  targets:
  - 全世代
  level: normal
  level_reason: 偽サイトは見た目では判断できないため、会社情報・URL・支払い先などを自分で確かめる行動が必要
  flow: |
    1. 会社情報のページで、事業者の名称・住所・電話番号と、キャンセル・返品・返金のルールが書かれているかを見る
    2. URLが公式のものかを確かめる（ロゴがあるだけで判断しない）
    3. 警察なども案内している偽ショッピングサイトのチェックサービスで、サイトが偽サイトとして報告されていないか調べる（結果は参考として使う）
    4. 支払い先の名義が販売事業者のものかを確かめる。不安なら、ブランドの公式サイトに載っている電話番号に問い合わせて、その店が正規の販売店か確かめる
  features:
  - 事業者の名称・住所・電話番号、返品・返金のルールが明記されている
  - 支払い方法が銀行振込だけなどに限られていない
  - 振込先や支払い先が販売事業者の名義になっている
  red_flags:
  - 支払い先が個人名や、販売事業者とは別の名前の法人になっている
  - 公式サイトによく似ているが、少し違うURL
  - チェックサービスで「安全ではない」と表示される
  right_action: 少しでも不審な点があれば、支払いの前に立ち止まる。チェックサービスの判定は完全ではないので、問題がないと表示されても、会社情報や支払い先を自分で確かめる。
  legit_contrast: 偽サイトは本物の商品画像やロゴ、公式によく似たURLを使うことがあるため、見た目やロゴだけでは本物とは言えない。茨城県の資料では、販売会社の公式サイトに載っている番号に電話して、通販サイトが販売会社と無関係だと分かった事例が紹介されている。
  sources:
  - publisher: 警察庁
    title: （偽ショッピングサイト対策のページ）
    url: https://www.npa.go.jp/bureau/cyber/countermeasures/fake-shop.html
  - publisher: 埼玉県警察
    title: （偽ショッピングサイトとチェックサービスに関する広報資料）
    url: https://www.police.pref.saitama.lg.jp/documents/30634/r8vol16_2.pdf
    published: 2026
  - publisher: 岐阜県
    title: （偽ショッピングサイトのチェックサービスの使い方と注意点に関する資料）
    url: https://www.pref.gifu.lg.jp/uploaded/attachment/379230.pdf
  - publisher: 中央区
    title: （偽ショッピングサイトに関する注意喚起。公式に酷似したURL）
    url: https://www.city.chuo.lg.jp/a0012/syohisikatsu/20231228.html
    published: 2023-12
  - publisher: 山形県
    title: （公式のロゴだけで判断せず正しいURLか確認するよう呼びかける資料）
    url: https://www.pref.yamagata.jp/documents/27440/news20230331.pdf
    published: 2023-03
  - publisher: 茨城県
    title: （偽サイトの見分け方と相談事例に関する資料）
    url: https://www.pref.ibaraki.jp:443/seikatsukankyo/syose/navi/project/documents/194.pdf
  - publisher: 国民生活センター
    title: 見守り新鮮情報 第515号（怪しい通販サイトにご注意）
    url: https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen515.html
    published: 2025-07
  question_ideas:
  - 2つの通販サイトの会社情報ページと支払い画面を比べ、正規のサイトを選ぶ問題
  - 行動問題：買う前に確かめることを正しい順番に並べる問題
  - 「チェックサービスで問題なしと出たから安全」という考えが正しいかを問う問題
- id: EX-009
  kind: scam
  title: 宅配業者をかたる不在通知SMS（不正なアプリのインストールへ誘導）
  situation: S02
  channels:
  - sms
  tactics:
  - T01
  - T09
  - T06
  targets:
  - 全世代
  level: easy
  level_reason: 長く続く代表的な手口で、警察や自治体の注意喚起が非常に多い
  flow: |
    1. 宅配業者を名乗り、不在のため荷物を持ち帰った、などと知らせるSMSが届く
    2. 本文のURLを開くと、偽サイトで宅配業者のアプリやセキュリティ対策アプリに見せかけた不正なアプリを入れさせようとする（スマホの機種によって誘導のしかたが違う）。IDやパスワードを入力させる場合もある
    3. 不正なアプリが入ると、自分のスマホから同じような偽SMSが大量に送られたり、キャリア決済で電子マネーを買われたりする
  features:
  - 宅配業者の名前で届く不在通知のSMS
  - リンク先で「アプリを入れてください」と求める（宅配業者やセキュリティ対策のアプリを装う）
  - 県警は、特定の種類のスマホ（OS）が特に狙われているとしている
  red_flags:
  - SMSのリンクから、提供元の分からないアプリを入れさせようとする
  - 身に覚えのない荷物の不在通知
  right_action: SMSのURLは開かない。配達状況は、宅配業者の公式アプリやブックマークした公式サイトで確かめる。提供元の分からないアプリは入れない。被害が疑われるときは、消費生活センターや警察に相談する。
  legit_contrast: 不在通知がSMSやメールで届いても、URLにはアクセスしないよう府が呼びかけている。配達状況は、正規の宅配業者のアプリやブックマークした公式サイトから確かめられる。
  trend: 2023年10月時点ではフィッシングSMSの文面の約9割が宅配業者をかたるものだった（民間調査）。2025年1月に県警が不正アプリへの誘導について注意を呼びかけ、2026年7月にも市が同じ手口を紹介している
  sources:
  - publisher: 広島県警察本部 サイバー犯罪対策課（広島県サイト掲載）
    title: （ページ名未確認）宅配業者の不在通知等を装った偽SMSに関する注意喚起（PDF）
    url: https://www.pref.hiroshima.lg.jp/uploaded/attachment/604115.pdf
    published: 2025-01
  - publisher: 山口県
    title: （ページ名未確認）偽SMSの被害例に関する資料（PDF）
    url: https://www.pref.yamaguchi.lg.jp/uploaded/attachment/120006.pdf
  - publisher: 鹿児島市
    title: （ページ名未確認）宅配業者をかたる偽SMSに関する注意喚起
    url: https://www.city.kagoshima.lg.jp/shimin/shiminbunka/syouhi/kurashi/shohisekatsu/chui/nise-sagawa-sms.html
    published: 2026-07
  - publisher: 大阪府
    title: （ページ名未確認）消費生活のよくある質問（不在通知のSMS・メール）
    url: https://www.pref.osaka.lg.jp/faq/o070120/faq_002107.html
    published: 2026-04
  - publisher: ITmedia Mobile
    title: トビラシステムズ、特殊詐欺/フィッシング詐欺の独自調査レポートを公開 宅配事業者をかたるSMS文面が約9割に
    url: https://www.itmedia.co.jp/mobile/spv/2311/29/news180.html
    published: 2023-11
  question_ideas:
  - easy版：不在通知SMSを見抜く
  - 本物の公式アプリの配達通知と並べて比べる問題
  - 「アプリを入れてください」と表示されたときの正しい行動を選ぶ問題
- id: EX-010
  kind: scam
  title: 宅配業者をかたるSMSから偽サイトで不正なアプリを入れさせる
  situation: S02
  channels:
  - sms
  - web
  tactics:
  - T01
  - T04
  - T09
  targets:
  - 全世代
  level: normal
  level_reason: SMSの文面は短く本物らしいが、リンク先で「アプリを入れる」「設定を変える」よう求められる点で見抜ける
  flow: |
    1. 宅配業者を名乗るSMSが届き、リンクを開くよううながす（最近は企業名を出さず「至急確認を」などの文面もある）
    2. スマホの種類によっては、本物に似せた偽サイトでアプリのダウンロードとインストールを求められる
    3. 入れてしまうと、そのスマホから同じような偽SMSが知らない宛先へ大量に送られ、通信料が増えることがある
    4. 別の種類のスマホで開くと、アプリの代わりに、電話番号と認証コードや、スマホのアカウントのIDとパスワードを入力させる偽サイトが表示される
  features:
  - 公式のアプリストアではなく、Webサイトから直接アプリを入れさせようとする
  - 「提供元不明のアプリ」を許可するためのスマホの設定方法を表示することがある
  red_flags:
  - SMSのリンク先で、荷物の確認のためにアプリのインストールを求められる
  - スマホの設定を変えてアプリを入れるよう指示される
  right_action: 心当たりのないSMSのリンクは開かない。アプリは公式のアプリストアから入れ、提供元不明のアプリのインストールを許可しない設定にしておく。入れてしまった場合は、機内モードにして送信を止め、アプリを削除し、アカウントが不正に使われていないか確かめる（最終手段として初期化）。
  legit_contrast: アプリは公式のアプリストアから入手するのが基本（警察・携帯電話会社の案内）。
  trend: 携帯電話会社は2025年11月にも、特定の企業名を出さずに至急の確認などをうながす文面でリンクを開かせ、不正なアプリをダウンロードさせる事例を確認したと注意喚起に追記している。
  sources:
  - publisher: IPA（情報処理推進機構）
    title: 安心相談窓口だより：宅配業者をかたる偽SMSから不審なアプリを入れさせる手口（題名は要約）
    url: https://www.ipa.go.jp/security/anshin/attention/2018/mgdayori20180808.html
    published: 2018-08
  - publisher: IPA（情報処理推進機構）
    title: 安心相談窓口だより：宅配業者をかたる偽SMSで、スマホの種類によりフィッシングサイトへ誘導する手口（題名は要約）
    url: https://www.ipa.go.jp/security/anshin/attention/2018/mgdayori20181129.html
    published: 2018-11
  - publisher: NTTドコモ
    title: 迷惑メッセージ対策コラム：宅配業者をかたるSMSと不正アプリ（題名は要約。2025年11月の追記あり）
    url: https://www.docomo.ne.jp/info/spam_mail/column/20180725/index.html
    published: 2025-11
  - publisher: 滋賀県警察
    title: スミッシングによる不正アプリへの注意喚起（題名は要約）
    url: https://www.pref.shiga.lg.jp/police/seikatu/304409/304411/334419.html
  - publisher: 楽天モバイル
    title: 不正アプリへの注意と提供元不明アプリの設定（題名は要約）
    url: https://network.mobile.rakuten.co.jp/information/news/other/462/
  - publisher: 山口県
    title: 不正アプリを入れてしまったときの対処（題名は要約）
    url: https://www.pref.yamaguchi.lg.jp/uploaded/attachment/120006.pdf
  - publisher: INTERNET Watch
    title: 不正アプリと「提供元不明のアプリ」設定に関する記事（題名は要約）
    url: https://internet.watch.impress.co.jp/docs/news/509765.html
    published: 2012
  question_ideas:
  - SMSのリンク先に「アプリを入れてください」と出る偽サイトの画面を見せ、正しい行動を選ぶ問題
  - 「提供元不明のアプリを許可して」と表示されたときに押してはいけないボタンを選ぶ問題
- id: EX-011
  kind: legit
  title: 大手宅配業者には、荷物の集配についてSMSで案内しないと公表している会社がある
  situation: S02
  channels:
  - sms
  tactics:
  - T01
  - T03
  - T09
  targets:
  - 全世代
  level: easy
  level_reason: 典型的な手口で注意喚起が多く、宅配業者自身も公式の方針を出している
  flow: |
    1. 大手宅配業者の中には、荷物の集配についてSMSでの案内は行っていないと公表している会社がある
    2. 宅配業者を名乗って「荷物を届けたが不在だった」などと連絡を求めるSMSが多く出回っており、URLをタップすると偽の公式サイトに誘導され、不審なアプリを入れさせられる被害もある
    3. 心当たりのない宅配業者名のSMSやメールは、URLを開かずに無視する
  features:
  - SMSで集配を案内しないと公表している会社なら、その会社名のSMSは偽物と判断できる
  red_flags:
  - 宅配業者名のSMSに、配送確認のURLや確認ボタンがある
  - リンク先でアプリのインストールを求められる
  right_action: SMSのURLはタップしない。荷物の状況は、SMSのリンクではなく、宅配業者の公式サイトや公式アプリなど信頼できる入口から確かめる。
  legit_contrast: 偽のSMSは、実在する宅配業者を名乗り、不在を理由にURLへ誘導する。
  sources:
  - publisher: ECのミカタ
    title: 宅配業者をかたる不審なメール・SMSへの各社の注意喚起を伝える記事（題名未確認）
    url: https://ecnomikata.com/ecnews/41318/
  - publisher: 東京都消費生活総合センター
