  - 学生
  level: normal
  level_reason: 身近な人からの誘いで断りにくいが、「人を紹介すると報酬」「借金してでも払う」という分かりやすいサインがある
  flow: |
    1. 入学後の新生活で、友人・先輩・サークルやSNSで知り合った人から「いい話がある」「紹介したい人がいる」と誘われる
    2. セミナーなどで、投資や副業のもうけ話、情報商材を勧められる。誰かを勧誘すると報酬が出るマルチ取引（連鎖販売取引）にあたるものもある
    3. お金がないと伝えると、消費者金融などで借りて払うよう勧められる
  features:
  - 暗号資産や海外事業への投資、アフィリエイトなど、形のない「もうけ話」を勧める（モノなしマルチ）
  - 人を紹介すれば報酬がもらえると持ちかける
  - 事業者の実態が分かりにくく、あとで解約や返金を求めても交渉が難しい
  red_flags:
  - 誰かを勧誘すれば報酬が出る仕組み
  - 借金やクレジットでの支払いを勧められる
  - その場の雰囲気で契約を迫られる
  right_action: その場で決めず、いったん保留する。契約する気がなければはっきり断る。借金をしてまで契約しない。困ったときは消費者ホットライン188に相談する。要件を満たせば、クーリング・オフや中途解約ができる場合がある。
  legit_contrast: 県の消費生活の窓口は「借金までして儲かる話はない」と注意している。知人を勧誘したことで人間関係が壊れたり、お金のトラブルになったりすることもあるとされる。
  trend: 2025年版の消費者白書を引いた県の資料によると、20歳代の消費生活相談はSNSがきっかけのものが多く、もうけ話・副業・暗号資産投資などお金もうけに関するトラブルが増えている。
  sources:
  - publisher: 国民生活センター（鳥取県サイト掲載の若者向け啓発資料）
    title: 新生活での友人・先輩・SNSからの投資やもうけ話の勧誘に関する注意喚起（題名未確認）
    url: https://www.pref.tottori.lg.jp/secure/922405/support206.pdf
    published: 2024-03
  - publisher: 国民生活センター
    title: 若者に広がる「モノなしマルチ商法」の注意喚起（題名未確認）
    url: https://www.kokusen.go.jp/news/data/n-20190725_1.html
    published: 2019-07
  - publisher: 神奈川県 消費生活課（日本大学サイト掲載のリーフレット）
    title: SNSや友人からのもうけ話の勧誘に関するリーフレット（題名未確認）
    url: https://www.brs.nihon-u.ac.jp/wp-content/uploads/SNS3.pdf
  - publisher: 奈良県消費生活センター
    title: 若者の消費者トラブルに関する資料（題名未確認）
    url: https://www3.pref.nara.jp/syouhiseikatsucenter/secure/2367/2026_2_3.HP.pdf
  question_ideas:
  - 先輩からのメッセージ「すごい人を紹介したい」「友達を紹介すると報酬が出る」を見て、マルチ取引のサインを選ぶ問題
  - 行動問題：「お金がないなら消費者金融で借りればすぐ返せる」と言われたときの正しい対応
- id: EX-025
  kind: scam
  title: 証券会社をかたる「多要素認証の設定のお願い」メール
  situation: S04
  channels:
  - email
  tactics:
  - T01
  - T04
  - T06
  targets:
  - 社会人
  - 高齢者
  level: hard
  level_reason: 本物の証券会社が実際に多要素認証の設定を必須にした時期と重なり、内容が本物の案内と同じに見える。差出人に証券会社の本物のドメインが表示される例も多く、メールの見た目だけでは区別しにくい
  flow: |
    1. 証券会社を名乗るメールが届き、セキュリティ強化のため多要素認証（ワンタイムパスワードなど）の設定が必須になった、期限までに設定するように、と案内する
    2. 設定の手続きとして、本文のリンクから証券会社のログイン画面に似せた偽サイトへ誘導する
    3. 偽サイトでログインIDやパスワードなどを入力させる。盗まれた情報で口座に不正にログインされ、勝手に株の売買をされる被害が相次いだ
  features:
  - 件名に【重要】を付け、多要素認証（二要素認証）の設定をお願いする内容
  - 必須になる日付と設定の期限を書き、期限内の対応を求める
  - 差出人に証券会社の本物のドメインを使った「なりすまし」送信も多数確認された
  - ほかに「利用規約の変更」「手数料無料キャンペーン」「補償に関するお知らせ」を口実にするものもあった
  red_flags:
  - メールのリンクからログインさせて設定させようとする
  - 期限を区切って急がせる
  - 差出人アドレスが本物に見えても、リンク先のドメインが証券会社の公式と違う
  right_action: メールのリンクは使わず、証券会社の公式アプリやブックマークした公式サイトから自分でログインし、お知らせや設定画面で多要素認証の案内を確かめる。身に覚えのない取引やログインの記録がないかも確かめる。
  legit_contrast: 本物の証券会社も2025年に多要素認証の設定を必須にしたため、「設定してください」という案内そのものは本物にも存在した。区別のしかたは確かめ方で、公式アプリや自分で開いた公式サイトにログインして案内を確かめる。業界では、ログインや出金のときにフィッシングに強い多要素認証（パスキーなど）を必須にする方針も示された（2025年10月）。
  trend: 2025年春に証券会社をかたるフィッシングと口座の不正取引が急増し、各社が多要素認証の必須化を進めた6月以降は減った。2025年7月には、多要素認証の設定依頼や補償のお知らせを装ったメールで再び増加した
  sources:
  - publisher: ScanNetSecurity
    title: 2025年7月のフィッシング報告状況、証券会社をかたるフィッシングメールの配信が再び増加
    url: https://scan.netsecurity.ne.jp/article/2025/08/28/53521.html
    published: 2025-08
  - publisher: '@IT'
    title: フィッシング対策協議会が7月の報告状況を公表 報告件数前月比3万3563件増:メール配信事業者に求める対策とは
    url: https://atmarkit.itmedia.co.jp/ait/articles/2509/08/news117.html
    published: 2025-09
  - publisher: ScanNetSecurity
    title: DMARC 通過する独自ドメインフィッシング急増 ~ フィッシング対策協議会「フィッシングレポート2026」
    url: https://scan.netsecurity.ne.jp/article/2026/06/11/55466.html
    published: 2026-06
  - publisher: 三菱UFJモルガン・スタンレー証券
    title: （ページ名未確認）同社が公開したフィッシング詐欺メールの例（二要素認証の設定を求める内容、PDF）
    url: https://www.sc.mufg.jp/content/000022495.pdf
  - publisher: 広島市
    title: （ページ名未確認）証券会社などを装う偽メールの注意喚起（2025年2〜4月の急増）
    url: https://www.city.hiroshima.lg.jp/living/shouhi/1025695/1025698/1039798.html
  - publisher: 日本総合研究所
    title: （ページ名未確認）証券口座の不正取引と日本証券業協会のガイドライン改正に関するレポート
    url: https://www.jri.co.jp/page.jsp?id=112280
  question_ideas:
  - 本物の「多要素認証必須化のお知らせ」（公式アプリ内）と偽メールを並べ、確かめ方の違いを問う問題（hard）
  - 差出人アドレスは本物と同じで、リンク先だけが違う版
  - 行動問題：「ブックマークから公式サイトにログインしてお知らせを見る」が最善
- id: EX-026
  kind: scam
  title: 差出人欄に本物のサービスのアドレスが表示される「なりすまし」メール
  situation: S04
  channels:
  - email
  tactics:
  - T01
  - T04
  - T06
  targets:
  - 社会人
  - 高齢者
  level: hard
  level_reason: 差出人のアドレスが本物のサービスと同じドメインで表示されるため、「差出人のアドレスを確かめる」という基本の見分け方が通用しない
  flow: |
    1. 差出人欄に、実在する証券会社などの本物のドメインのメールアドレスが表示されたメールが届く
    2. 本文は「補償に関するお知らせ」「多要素認証の設定のお願い」など、その時期の本物のお知らせに似た内容で、リンクへ誘導する
    3. リンク先は本物とは別のドメインの偽サイトで、ログイン情報などを入力させる
  features:
  - メールアプリで見る差出人アドレスが、本物のサービスのドメインと一致している
  - 2026年7月の調査では、届いたフィッシングメールの約26.5%がこの「なりすまし」型だった
  - 送信元を確かめる仕組み（DMARC）を厳しく設定していないドメインが、なりすましに使われやすい
  - 2025年7月の報告では、「.top」「.cn」で終わるドメインの悪用が全体の約半分（約48.8%）を占めた
  red_flags:
  - 差出人が本物でも、本文のリンク先のドメインが公式と違う
  - 本物のお知らせと同じ話題で、リンクからのログインを求める
  right_action: 差出人のアドレスだけで本物と判断しない。メールのリンクは使わず、公式アプリやブックマークから自分でログインして、同じお知らせがあるか確かめる。
  legit_contrast: 送信元を確かめる仕組み（DMARC）を厳しく設定しているドメインなら、なりすましメールは受信側でふるい落とせる。ただし受け取る側からは設定が分からないため、どのメールでも公式アプリやブックマークから確かめる習慣が確実。
  trend: 2026年7月はなりすまし型の割合が前月より増えた。2025年7月には証券会社のドメインを使ったなりすまし送信が多数確認された。2024年7月の報告でも、DMARCの設定が弱い（または設定のない）ドメインのなりすましが増加傾向とされた
  sources:
  - publisher: ScanNetSecurity
    title: 2026年7月のフィッシング報告状況、Amazon をかたるフィッシングが急増
    url: https://scan.netsecurity.ne.jp/article/2026/08/27/56042.html
    published: 2026-08
  - publisher: ScanNetSecurity
    title: 2025年7月のフィッシング報告状況、証券会社をかたるフィッシングメールの配信が再び増加
    url: https://scan.netsecurity.ne.jp/article/2025/08/28/53521.html
    published: 2025-08
  - publisher: ScanNetSecurity
    title: DMARCポリシー「none」または DMARC 対応していないドメイン名のなりすましフィッシングメール増加傾向、7 月のフィッシング報告状況
    url: https://scan.netsecurity.ne.jp/article/2024/08/30/51554.html
    published: 2024-08
  question_ideas:
  - 差出人アドレスは本物と完全に同じで、リンク先だけが違う問題（hard）
  - 「差出人のアドレスが本物なら安全？」という○×問題
  - 行動問題：差出人が本物に見えても、公式アプリから確かめる
- id: EX-027
  kind: scam
  title: SNSのダイレクトメッセージから始まり、出金のときに「手数料・税金」を求められるSNS型投資詐欺
  situation: S04
  channels:
  - sns
  - chat
  tactics:
  - T01
  - T11
  - T05
  - T04
  - T07
  targets:
  - 全世代
  level: hard
  level_reason: 証券口座のようなアプリに残高や利益がきちんと表示され、講師やアシスタントの対応も丁寧なため本物らしく見える。入金先の口座名義や業者の登録を自分で確かめる行動が必要
  flow: |
    1. SNSで、投資に詳しい人や運用会社の社員を名乗るアカウントから、ダイレクトメッセージで投資に誘われる
    2. メッセージアプリの非公開チャットに移り、「講師」や「アシスタント」から投資の指南を受ける
    3. 証券口座を装ったアプリを入れるよう言われ、入金先として個人名義の口座を指定される（暗号資産で送らせる例もある）
    4. アプリには入金額や利益が表示されるが、まとまった金額を出金しようとすると断られ、「口座凍結の解除」などを理由に手数料・保証金・税金の支払いを求められる
  features:
  - 実在の証券会社や運用会社、その社員の名前をかたることがある
  - アプリの画面には、入金額と同じ残高や利益が表示される
  - 出金の段階で、次々に新しい名目の支払いを求めてくる
  red_flags:
  - 知らない相手からのダイレクトメッセージでの投資の誘い
  - 入金先が個人名義の口座
  - 出金するために、先にお金（手数料・税金・保証金）を払うよう言われる
  right_action: 少しでも怪しいと思ったら入金せず、やり取りを中断する。名乗っている証券会社・運用会社の公式サイトに載っている窓口に自分で問い合わせ、金融庁の「金融事業者検索」で登録を確かめる。被害に気づいたら、すぐに警察と振込先の金融機関に連絡する。
  legit_contrast: 証券会社が入金の際に個人名義の銀行口座を指定することはない（金融庁）。ただし金融庁は、登録を受けた業者であることだけでは安心して投資できる保証にはならない、とも注意している。
  trend: 2025年のSNS型投資詐欺では、最初の接触手段としてダイレクトメッセージが3,549件と前年から66.4%増え、写真共有SNSやメッセージアプリなどのダイレクトメッセージが増加の主な要因とされた（警察庁の確定値）。2025年には、運用会社自身がSNSなどで自社やその役職員を装った偽広告・なりすましが急増していると注意喚起している。
  sources:
  - publisher: 金融庁
    title: それ詐欺です！SNS上の投資勧誘にご注意ください！
    url: https://www.fsa.go.jp/receipt/toushisagi_koukoku/shuhou.html
  - publisher: 金融庁
    title: ＳＮＳ・マッチングアプリ等で知り合った者や著名人を騙る者からの投資勧誘等にご注意ください！
    url: https://www.fsa.go.jp/ordinary/chuui/sns.html
  - publisher: 金融庁
    title: 証券会社や日本証券業協会を騙ったSNS上の偽広告等に注意！
    url: https://www.fsa.go.jp/ordinary/chuui/nisekoukoku.html
  - publisher: 警察庁
    title: 令和7年における特殊詐欺及びSNS型投資・ロマンス詐欺の認知・検挙状況等について（確定値）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/260605/01.html
    published: 2026-06
  - publisher: アセットマネジメントOne
    title: （資料名未確認）当社や役職員を装った偽広告・なりすましへの注意（PDF）
    url: https://www.am-one.co.jp/pdf/news/433/20250912_AMOne_newsrelease.pdf
    published: 2025-09
  question_ideas:
  - 偽の投資アプリの画面（利益の表示）と「出金するには利益の一部を税金として先に振り込んで」というチャットを見せ、正しい判断を選ぶ問題
  - 比較問題：本物の証券会社の入金案内（会社名義の口座・公式アプリ）と、個人名義の口座を指定するメッセージを比べる
- id: EX-028
  kind: scam
  title: 登録業者や財務局を名乗る無登録の投資業者
  situation: S04
  channels:
  - sns
  - chat
  - web
  tactics:
  - T01
  - T13
  - T11
  - T07
  targets:
  - 社会人
  - 高齢者
  level: hard
  level_reason: 実在する登録業者の名前や登録番号を名乗るため見た目では本物と区別しにくく、一覧と照らし合わせる行動が必要
  flow: |
    1. SNSや電話などで投資の話を持ちかけられる
    2. 相手は、実在する登録業者の名前や登録番号を名乗ったり、財務局を名乗ったりして信用させる
    3. 金融商品の購入や手数料の支払いを求められる。「過去の投資被害を取り戻せる」と持ちかけ、別の金融商品の購入や手数料を求める例もある
  features:
  - 実在する登録業者の商号や登録番号を勝手に名乗る
  - 財務局などの公的機関を装う
  - 過去に投資の被害にあった人に「被害を回復する」と持ちかける
  red_flags:
  - 名乗っている名前・登録番号と、金融庁の登録業者一覧の内容（名称・連絡先）が一致しない
  - 公的機関が投資をすすめてくる
  - 被害の回復のために、手数料や新たな購入が必要だと言われる
  right_action: 取引の前に、金融庁サイトの「免許・許可・登録等を受けている業者一覧」で、名称・登録番号・連絡先が一致するか確かめる。一致しない、または不審に感じたら取引せず、金融庁の金融サービス利用者相談室や消費者ホットライン188、警察相談専用電話（#9110）に相談する。
  legit_contrast: 日本の居住者を相手に金融商品取引業を行うには、業者の所在地が海外でも日本での登録が必要で、登録業者の名称と連絡先は金融庁サイトの一覧で確かめられる。ただし、登録はその業者の信用力を保証するものではない。
  sources:
  - publisher: 東海財務局
    title: （無登録業者による勧誘、登録業者の商号・登録番号の詐称、財務局を装う業者に関する注意喚起）
    url: https://lfb.mof.go.jp/tokai/kinyuu/mutouroku1.html
  - publisher: 関東財務局
    title: （無登録で金融商品取引業等を行う者に関する注意喚起・警告の公表）
    url: https://lfb.mof.go.jp/kantou/kinyuu/pageknthp001000005.html
  - publisher: 金融庁
    title: （詐欺的な投資勧誘に関する注意喚起のページ）
    url: https://www.fsa.go.jp/ordinary/chuui/attention.html
  question_ideas:
  - 業者が名乗る名前・登録番号と、架空の登録業者一覧を見比べて、一致しない点を見つける問題
  - 「財務局の者です。被害を取り戻せます」というメッセージの真偽を判断する問題
- id: EX-029
  kind: legit
  title: 本物の証券会社・投資サービスかどうかの確かめ方（登録と入金先）
  situation: S04
  channels:
  - sns
  - chat
  tactics:
  - T11
  - T01
  targets:
  - 全世代
  level: normal
  level_reason: SNSの投資勧誘は本物らしく作られているため、入金先の名義や業者の登録を自分で確かめる知識が必要
  flow: |
    1. SNSで投資を勧められたら、相手が名乗る業者が金融商品取引業や暗号資産交換業の登録を受けているかを、金融庁の「金融事業者検索」で調べる
    2. 名乗っている証券会社・運用会社の公式サイトに載っている窓口に、自分で問い合わせる
    3. 少しでも怪しいと思ったら入金せず、やり取りを中断する
  features:
  - 証券会社は、入金の際に個人名義の銀行口座を指定しない
  - 業者の登録の有無は金融庁のサイトで調べられる。ただし、登録があるだけで安心して投資できる業者とは限らない
  - 著名人が無料で投資を教えるという広告や「必ずもうかる」という話は、なりすましや詐欺を疑う
  red_flags:
  - 入金先が個人名義の口座
  - 暗号資産で送るよう求められる
  right_action: 個人名義の口座には振り込まない。被害に気づいたら、すぐに警察と振込先の金融機関に連絡する。預金口座への振込で被害にあった場合は、振り込め詐欺救済法による被害回復分配金の対象になることがある（犯人が口座からお金を引き出してしまうと支払いを受けられない）。
  legit_contrast: SNS型投資詐欺では、証券口座を装ったアプリと個人名義の口座が使われる。本物の証券会社は個人名義の口座を入金先に指定しない（金融庁）。
  sources:
  - publisher: 金融庁
    title: それ詐欺です！SNS上の投資勧誘にご注意ください！
    url: https://www.fsa.go.jp/receipt/toushisagi_koukoku/shuhou.html
  - publisher: 金融庁
    title: 証券会社や日本証券業協会を騙ったSNS上の偽広告等に注意！
    url: https://www.fsa.go.jp/ordinary/chuui/nisekoukoku.html
  - publisher: 金融庁
    title: 振り込め詐欺等の被害にあわれた方へ
    url: https://www.fsa.go.jp/policy/kyuusai/furikome/index.html
  - publisher: 警察庁
    title: （ページ名未確認）SNS型投資詐欺の手口ページ（SOS47）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/case/sns-romance/investment/
  question_ideas:
  - 比較問題：本物の証券会社の入金案内（会社名義の口座・公式アプリ）と、個人名義の口座を指定するチャットを並べる
  - 行動問題：SNSで投資を勧められたとき、まず確かめること（登録業者か・公式の窓口）を選ぶ
- id: EX-030
  kind: legit
  title: 投資の勧誘を受けたら金融庁の登録業者一覧で確かめる
  situation: S04
  channels:
  - web
  tactics:
  - T11
  - T01
  targets:
  - 全世代
  level: normal
  level_reason: 登録番号まで名乗る業者もいるため、一覧で名称・番号・連絡先を照らし合わせる行動が必要
  flow: |
    1. 投資をすすめてきた相手の業者名と登録番号を控える
    2. 金融庁サイトの「免許・許可・登録等を受けている業者一覧」（業種をまたいでまとめて検索できる機能もある）で、名称・登録番号・連絡先が一致するかを確かめる
    3. 暗号資産の場合も、取引所が金融庁・財務局に登録された暗号資産交換業者かを確かめる
    4. 無登録業者として警告された業者の公表も見る（載っていないから安全とは限らない）
  features:
  - 登録を受けた業者は、名称と連絡先が金融庁サイトの一覧に載っている
  - 業者が海外にあっても、日本の居住者を相手に金融商品取引業を行うには日本での登録が必要
  - 暗号資産交換業を行う事業者も、金融庁・財務局への登録が必要
  red_flags:
  - 一覧に載っていない、または名乗った名称と登録番号の組み合わせが一覧と合わない
  - 海外の業者で、日本での登録がない
  right_action: 確かめられない相手とは取引しない。不審な勧誘は、金融庁の金融サービス利用者相談室や消費者ホットライン188、警察相談専用電話（#9110）に相談する。
  legit_contrast: 金融庁・財務局は、登録はその業者の信用力を保証するものではないとしている。登録業者でも、リスクや契約の内容を理解してから取引する。
  sources:
  - publisher: 東海財務局
    title: （無登録業者による勧誘、登録業者の商号・登録番号の詐称、財務局を装う業者に関する注意喚起）
    url: https://lfb.mof.go.jp/tokai/kinyuu/mutouroku1.html
  - publisher: 関東財務局
    title: （無登録で金融商品取引業等を行う者に関する注意喚起・警告の公表）
    url: https://lfb.mof.go.jp/kantou/kinyuu/pageknthp001000005.html
  - publisher: 金融庁
    title: （詐欺的な投資勧誘に関する注意喚起のページ）
    url: https://www.fsa.go.jp/ordinary/chuui/attention.html
  - publisher: 金融庁
    title: （登録業者の確認方法などを紹介する金融庁の資料）
    url: https://www.fsa.go.jp/access/r7/270/270_06.pdf
  - publisher: 国民生活センター
    title: 見守り新鮮情報 第530号（SNSで勧誘される暗号資産の詐欺的な投資話）
    url: https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen530.html
    published: 2025-12
  question_ideas:
  - 架空の登録業者一覧を使い、勧誘してきた業者の名称・登録番号・連絡先を照合する問題
  - 「金融庁に登録があれば絶対に安全」という考えが正しいかを問う問題
- id: EX-031
  kind: scam
  title: 「未納料金がある」SMSやはがきから電話をかけさせ、電子マネーで払わせる架空料金請求詐欺
  situation: S05
  channels:
  - sms
  - chat
  tactics:
  - T01
  - T13
  - T04
  - T07
  - T08
  targets:
  - 全世代
  level: easy
  level_reason: 「コンビニで電子マネーを買って払う」という特徴がはっきりしていて、注意喚起も多い
  flow: |
    1. 「インターネットの未納料金がある」というSMSや、法務省・裁判所を名乗るはがきが届く
    2. 書かれた番号に電話すると、「払わなければ裁判になる」「今日払えば大半が返金される」などと言われる
    3. コンビニで電子マネーのカードを買い、その番号を伝えるよう指示される
  features:
  - 身に覚えのない料金の請求
  - 連絡先として電話番号だけが書かれている
  - 裁判などをちらつかせて不安をあおる
  - 副業の勧誘から「違約金を払え」などと言われ、この詐欺に発展する例もある
  red_flags:
  - 料金の支払いに、コンビニで買う電子マネーを指定される
  - SMSやはがきに書かれた番号に電話させようとする
  - 「今日払えば返金される」などの話を混ぜて急がせる
  right_action: SMSやはがきの番号には電話しない。心当たりがあれば、契約しているサービスの公式サイトや自分で調べた窓口で確かめる。電子マネーで払うよう言われたら詐欺と考え、「188」（消費者ホットライン）や「#9110」に相談する。
  legit_contrast: 事業者や法務省・裁判所が、未納料金の名目でコンビニの電子マネーを買わせることは絶対にない（警察庁）。
  trend: 2025年の架空料金請求詐欺は5,686件（警察庁の暫定値）。電話が中心のオレオレ詐欺などと違い、だます手段としてメールやメッセージが大きな割合を占める。2026年7月末の暫定値では3,688件で、前年同期より13.7%増えている。
  sources:
  - publisher: 警察庁
    title: 架空料金請求詐欺
    url: https://www.npa.go.jp/bureau/safetylife/sos47/case/fictitious-billing/
  - publisher: 警察庁
    title: 副業を名目とした詐欺
    url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/ib-sidejob/sidejob/
  - publisher: 警察庁
    title: 令和７年における特殊詐欺及びＳＮＳ型投資・ロマンス詐欺の認知・検挙状況等について（暫定値）（PDF）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/assets/img/new-topics/detail/260213/03/r7_sagi_data_01.pdf
    published: 2026-02
  - publisher: 警察庁
    title: 令和8年7月末における特殊詐欺の認知・検挙状況等について（暫定値）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/260904/01.html
    published: 2026-09
  question_ideas:
  - 電話番号だけが書かれた「未納料金のお知らせ」SMSを見せ、本物か詐欺かを選ぶ問題
  - 行動問題：電話で「コンビニで電子マネーを買って番号を教えて」と言われたらどうするか
- id: EX-032
  kind: scam
  title: 携帯電話会社をかたる「不正利用の可能性・パスワード変更」SMS
  situation: S05
  channels:
  - sms
  tactics:
  - T01
  - T04
  - T06
  targets:
  - 全世代
  level: normal
  level_reason: 「不正利用からアカウントを守るため」という本物の注意喚起と同じような理由で届く。被害に気づくのが後日の請求のときになりやすい
  flow: |
    1. 携帯電話会社を名乗るSMSが届き、「不正利用された可能性があるので、IDとパスワードを変更してください」と伝える
    2. 本文のURLから偽サイトへ誘導し、ID・パスワード・暗証番号などを入力させる
    3. 盗まれた情報でキャリア決済（携帯料金とまとめて払う仕組み）を使われ、後日、大手通販サイトでの身に覚えのない高額な請求が来る
  features:
  - 携帯電話会社の名前で届くSMS
  - 不正利用を心配させ、「パスワードを変える」という正しそうな対策をさせる形をとる
  - 被害に気づくのは、後日の身に覚えのない高額請求のときになりやすい
  red_flags:
  - SMSのリンクからID・パスワード・暗証番号を入力させる
  - リンク先のドメインが携帯電話会社の公式と違う
  right_action: SMSのURLは開かず、携帯電話会社の公式アプリやブックマークした公式サイトから確かめる。入力してしまったら、すぐにID・パスワード・暗証番号とキャリア決済の設定を変え、携帯電話会社や利用された店舗に連絡し、警察にも届け出る。
  legit_contrast: 携帯電話会社の名前でSMSやメールが届いても、記載のURLには安易にアクセスせず、IDやパスワードを入力しないよう自治体が呼びかけている。本物かどうかは、公式アプリや自分で開いた公式サイトで確かめる。
  trend: 2025年10月に県の消費生活の注意情報で被害例が紹介された。フィッシング報告では2025年7月にモバイル系の割合が急増し、2026年7月にも通信事業者・メールサービス系のブランドの増加が目立った
  sources:
  - publisher: 神奈川県
    title: （ページ名未確認）消費生活の注意・警戒情報（携帯電話会社名のSMSからキャリア決済を不正利用された事例）
    url: https://www.pref.kanagawa.jp/docs/r7b/cnt/f370214/311017.html
    published: 2025-10
  - publisher: 大阪府
    title: （ページ名未確認）消費生活のよくある質問（キャリア決済を不正利用されたときの対応）
    url: https://www.pref.osaka.lg.jp/faq/o070120/faq_002106.html
  - publisher: ScanNetSecurity
    title: 2025年7月のフィッシング報告状況、証券会社をかたるフィッシングメールの配信が再び増加
    url: https://scan.netsecurity.ne.jp/article/2025/08/28/53521.html
    published: 2025-08
  - publisher: ScanNetSecurity
    title: 2026年7月のフィッシング報告状況、Amazon をかたるフィッシングが急増
    url: https://scan.netsecurity.ne.jp/article/2026/08/27/56042.html
    published: 2026-08
  question_ideas:
  - 「不正利用されたかも→パスワード変更」という、正しそうな行動に見せかける手口に気づく問題
  - 行動問題：入力してしまった後の対応（パスワード・暗証番号・キャリア決済の設定変更、携帯電話会社への連絡）を選ぶ
- id: EX-033
  kind: scam
  title: 総務省や電話会社を名乗る自動音声「この電話は使えなくなります」から警察官役につながる電話
  situation: S05
  channels:
  - chat
  tactics:
  - T01
  - T13
  - T04
  targets:
  - 全世代
  level: normal
  level_reason: 「電話が使えなくなる」と急がせるが、公的機関や電話会社が自動音声で電話の停止を知らせることはないと知っていれば見抜ける
  flow: |
    1. 総務省（国の機関）や電話会社を名乗る自動音声で「この電話は使えなくなります。1番を押してください」などと流れる
    2. ボタンを押すと職員を名乗る人につながり、「あなたの電話番号が不正に使われている」などと言われる
    3. 「（別の県の）警察に代わります」と警察官役に引き継がれ、「捜査に協力を」と求められる
    4. 個人情報を聞き出されたり、最終的にATMやネットバンキングで振り込むよう求められたりする
  features:
  - 「+」から始まる国際電話番号からかかってくることが多い
  - 自動音声で番号ボタンを押させ、オペレーターにつなごうとする
  - 電話会社や国の機関の職員から、遠くの県の警察に話が回される
  red_flags:
  - 電話の停止を自動音声で知らせてくる
  - 「あなたの電話が犯罪に使われている」「捜査に協力を」と言われる
  - 話の最後がお金の振込になる
  right_action: 自動音声の指示どおりにボタンを押さず、電話を切る。個人情報は伝えない。気になるときは、契約している電話会社の公式の窓口を自分で調べて確かめる。不安なときは「#9110」に相談する。
  legit_contrast: 総務省や電話会社、警察などの公的機関が、電話の停止について自動音声ガイダンスやSMSで連絡することはない（京都府の注意喚起）。
  trend: 警察庁は、電話会社や総務省などを名乗ったあとに警察官役へ交代し、SNSやビデオ通話に移るニセ警察詐欺の流れを注意喚起している。京都府は、詐欺電話の7割以上で国際電話が悪用されているとしている。
  sources:
  - publisher: 警察庁
    title: 'ニセ警察詐欺に注意！ #ニセ警察詐欺'
    url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/241218/02.html
  - publisher: 堺市
    title: （ページ名未確認）国際電話を使った詐欺への注意喚起
    url: https://www.city.sakai.lg.jp/kurashi/bohan/bohan/kokusaidenwasagi.html
  - publisher: 京都府
    title: （ページ名未確認）電話の停止をかたる自動音声などへの注意喚起
    url: https://www.pref.kyoto.jp/shohise/1292569071782.html
  - publisher: 総務省
    title: （資料名未確認）総合通信局による不審電話の注意喚起資料（PDF）
    url: https://www.soumu.go.jp/main_content/001007779.pdf
  question_ideas:
  - 自動音声の文面（「この電話は2時間後に使えなくなります。1番を押してください」など）を見せ、正しい対応を選ぶ問題
  - 難しい版：電話会社の職員→警察官役に話が回される会話を見せ、詐欺だと分かるポイントを複数選ぶ
- id: EX-034
  kind: scam
  title: 「+」から始まる国際電話番号からの着信（警察署のように見える番号も）
  situation: S05
  channels:
  - chat
  tactics:
  - T13
  - T04
  - T08
  targets:
  - 全世代
  level: normal
  level_reason: 番号の頭の「+」に気づけば見抜けるが、末尾を「0110」にして警察署のように見せたり、実在の警察署の番号を表示させたりする例もあり、番号だけで判断しない注意が要る
  flow: |
    1. スマホに「+」から始まる見知らぬ番号から着信がある（末尾が「0110」で、警察署からの電話のように見えることもある）
    2. 出ると、警察官や公的機関の職員を名乗る人や自動音声が「口座（携帯電話）が犯罪に使われている」などと告げる
    3. 不安をあおられ、SNSでのやり取りや送金の話に進む。着信履歴だけを残して折り返しを待つ「ワン切り」の場合もある
  features:
  - 犯行に使われる番号の多くは「+1」などから始まる国際電話番号
  - 「+」付きの番号でも、末尾を「0110」にして警察署からの電話に見せかける例が目立つ
  - 実在する警察署などの電話番号を偽って表示させる手口も確認されている
  red_flags:
  - 心当たりのない「+」から始まる番号
  - 警察を名乗るのに、表示が国際電話番号になっている
  - 表示が警察署の番号でも、電話で「捜査の対象」や「お金」の話をされる
  right_action: 心当たりのない国際電話番号には出ず、折り返しもしない。スマホは国際電話の着信を規制できるアプリや設定を使う。固定電話は、警察などが案内している受付窓口に申し込むと国際電話の発着信を無料で休止できる。用件が気になるときは、表示された番号ではなく自分で調べた公式の番号にかけて確かめる。
  legit_contrast: 国内の固定電話や携帯電話からかかってきた電話なら、番号は「0」から始まって表示される（通信会社の注意喚起）。ただし警察署の番号が表示されても偽装の可能性があるため、番号だけで信用せず、いったん切って自分で調べた番号にかけ直す（警視庁）。
  trend: 警察庁によると、2025年に犯行に使われた電話番号のうち国際電話番号は75.5%で、前年から大幅に増えた（2025年上半期は73.5%）。ニセ警察詐欺では末尾が「0110」の国際電話番号が多く見られる。2025年6月には総務省が迷惑電話の相談窓口を開設したと通信会社が案内している。
  sources:
  - publisher: 警察庁
    title: 令和7年における特殊詐欺及びSNS型投資・ロマンス詐欺の認知・検挙状況等について（確定値）（PDF）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/assets/img/new-topics/detail/260605/01/02.pdf
    published: 2026-06
  - publisher: 警察庁
    title: 令和7年上半期における特殊詐欺、SNS型投資・ロマンス詐欺の認知・検挙状況等について（PDF）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/assets/img/new-topics/detail/250804/01/02.pdf
    published: 2025-08
  - publisher: 警察庁
    title: 警察に偽装した電話番号に注意！
    url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/250325/01.html
    published: 2025-03
