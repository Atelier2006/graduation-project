    url: https://kumanichi.com/articles/1993027
    published: 2026-05
  question_ideas:
  - 投資グループのチャット画面（成功報告が並び、アシスタントが個人名義の口座を案内）を見せて、怪しい点を選ぶ問題
  - 易しい版：著名人の「無料で投資を教えます」という広告を見せて、本物か詐欺かを選ぶ
  - 難しい版：少額の出金に成功した直後に「今がチャンス」と増額を勧められる場面で、とるべき行動を選ぶ
  - 投資アプリで利益が出ているのに、出金には「税金」の先払いが必要と言われる場面で、正しい行動を選ぶ問題
- id: EX-023
  kind: scam
  title: SNSで知り合った相手にすすめられる暗号資産投資（出金に「認証金」）
  situation: S04
  channels:
  - sns
  - chat
  - web
  tactics:
  - T12
  - T11
  - T05
  - T07
  targets:
  - 社会人
  - 高齢者
  level: normal
  level_reason: 数日間やり取りして親しくなってから勧誘され、自分名義の口座から始めるため信じやすいが、「海外の指定口座への送金」「出金のための追加払い」というはっきりしたサインがある
  flow: |
    1. SNSで面識のない異性から連絡があり、別のSNSに移ってやり取りするよう持ちかけられる
    2. 数日間やり取りした後、暗号資産への投資をすすめられる
    3. 国内の取引所に自分名義の口座を作って日本円を暗号資産に替え、海外の取引所の指定の口座へ送るよう指示される。別の暗号資産への交換も指示される
    4. 出金しようとすると「認証金」の支払いを求められ、いつまでも出金できない（相談事例では送金の総額は約500万円）
  features:
  - 面識のない相手から連絡が来て、別のSNSへの移動を求められる
  - 最初は国内の取引所で自分名義の口座を作らせるので、安全そうに見える
  - 送金先が海外の取引所の指定口座
  red_flags:
  - 知り合ったばかりの相手が、暗号資産などの投資をすすめてくる
  - 海外の取引所の指定口座へ送るよう言われる
  - 出金するために「認証金」などの追加の支払いを求められる
  right_action: SNSで知り合った面識のない相手から暗号資産などの投資をすすめられたら詐欺を疑う。取引所が金融庁・財務局に登録された暗号資産交換業者かを金融庁のサイトで確かめ、無登録の業者とは取引しない。一度送金すると取り戻すのはきわめて難しいので、少しでもおかしいと思ったら消費者ホットライン188や警察相談専用電話（#9110）に相談する。
  legit_contrast: 暗号資産交換業を行う事業者は金融庁・財務局への登録が必要で、登録の有無は金融庁のサイトで確かめられる（無登録業者として警告された業者も掲載されている）。登録業者との取引でも、暗号資産は価格が大きく変わり損をすることがある。
  trend: 2025年12月の国民生活センター「見守り新鮮情報」で、60歳代の相談事例として紹介された
  sources:
  - publisher: 国民生活センター
    title: 見守り新鮮情報 第530号（SNSで勧誘される暗号資産の詐欺的な投資話）
    url: https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen530.html
    published: 2025-12
  - publisher: 栃木県
    title: （見守り新鮮情報 第530号の転載ページ）
    url: https://www.pref.tochigi.lg.jp/c03/life/shouhi/seikatsu/kouhou/1211shinnsenn530.html
    published: 2025-12
  question_ideas:
  - SNSで知り合った相手とのやり取りを順に見せ、投資の勧誘・海外の指定口座への送金・「認証金」の要求のどこで止めるべきかを答える問題
  - 行動問題：「出金には認証金が必要」と言われたときの正しい行動を選ぶ
