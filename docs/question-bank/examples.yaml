  - publisher: ライフハッカー・ジャパン
    title: （正規のサポートサイトの検索結果に偽の電話番号を表示させる手口の紹介記事）
    url: https://www.lifehacker.jp/article/2507scammers-are-hijacking-legitimate-tech-support-sites/
    published: 2025-07
  - publisher: 山梨大学
    title: （セキュリティニュース。生成AIの回答に偽の連絡先を示させる手口の紹介）
    url: https://sojo.yamanashi.ac.jp/wp-content/uploads/secnews/20260120_cybersecurity.pdf
    published: 2026-01
  question_ideas:
  - 検索結果の画面（上位に公的な窓口に似た名前の窓口がある）を見せ、公的な相談窓口に確実につながる方法を選ぶ問題
  - 企業の問い合わせ先を調べる場面で、検索結果の番号と公式サイトの番号が違うときの行動を選ぶ問題
- id: EX-061
  kind: legit
  title: 迷ったときの確かめ方と相談先（公式の入口から確かめる・188・#9110・110）
  situation: S09
  channels:
