  - 行動問題：Web会議の最後に「今日申し込めば割引」と契約を迫られたときの正しい対応（その場で決めない・188に相談）
- id: EX-045
  kind: legit
  title: 本物の採用連絡の特徴（会社のメールアドレス・採用前に面接がある・応募にお金はかからない）
  situation: S07
  channels:
  - email
  - chat
  tactics:
  - T01
  - T07
  targets:
  - 学生
  - 社会人
  level: normal
  level_reason: 偽物も実在の企業名を使うため、アドレスのつづりや手続きの流れを確かめる必要がある
  flow: |
    1. 本物の採用担当者は、多くの場合、会社のドメインのメールアドレスを使う（フリーメールのアドレスは要注意）
    2. 採用の前に、面接などで本人と話をする（対面や電話での面接を手順に含めると案内する企業もある）
    3. 応募や採用の手続きで、お金の支払いを求めることはない
  features:
  - 送信元が会社のドメインのメールアドレス
  - 採用の前に面接がある
  - 応募や採用にお金がかからない
  red_flags:
  - 企業名のつづりが少し違う、余分な文字が入ったアドレス
  - 面接なしの内定や、チャットアプリだけのやり取り
  - 応募の費用や、会社のためのお金の送金・受け取りを頼まれる
  right_action: 採用担当者を名乗る連絡が来たら、企業の公式採用サイトなど別の経路で、担当者や求人が本当にあるかを確かめる。不安なときは、役職や採用の流れについて質問して反応を見る。
  legit_contrast: 偽の採用担当者は、個人情報や外部のリンクへ話を向けようとする。
  sources:
