- id: EX-071
  kind: scam
  title: 動画配信サービスをかたる「支払いに問題・アカウント保留」メール
  situation: S12
  channels:
  - email
  tactics:
  - T01
  - T04
  - T06
  targets:
  - 学生
  - 社会人
  level: easy
  level_reason: 「支払いができなかったので更新を」という定番の形で、カード情報を入力させる流れが分かりやすい
  flow: |
    1. 動画配信サービスを名乗り、「前回の支払いに問題があるためアカウントが保留になっています」などのメールが届く
    2. 登録している支払い情報の確認・更新をするよう促し、リンクから偽サイトへ誘導する
    3. 偽サイトでカード番号・有効期限・セキュリティコードを入力させる
  features:
  - 支払いが完了しなかった、アカウントが保留になっている、と知らせる
  - 支払い方法の更新のためのリンクを押させる
  red_flags:
  - メールのリンクから支払い情報を入力させる
  - リンク先のドメインが公式と違う
  right_action: リンクは開かず、公式アプリや自分で開いた公式サイトのアカウント設定で、支払いの状況を確かめる。
  legit_contrast: 支払い情報の確認や変更は、公式アプリや公式サイトのアカウント設定画面から自分で行える。
  sources:
  - publisher: ScanNetSecurity
    title: 「支払いが完了しなかった」、Netflixを騙るフィッシングメールを確認(フィッシング対策協議会)
    url: https://scan.netsecurity.ne.jp/article/2018/02/26/40635.html
    published: 2018-02
  question_ideas:
  - 学生向けeasy版：サブスクの「支払い失敗」メールを見抜く
  - 本物のアプリ内の「お支払い情報の更新」表示と比べる問題
- id: EX-072
  kind: scam
  title: 無料動画のボタンを押すと「登録完了」と料金を請求するワンクリック請求
  situation: S12
  channels:
  - web
  - chat
  tactics:
  - T04
  - T07
  - T08
  targets:
  - 全世代
  level: easy
  level_reason: 古くからある典型的な手口で、「登録完了」「退会はこちら」など見抜くポイントがはっきりしている
  flow: |
    1. 無料をうたう動画サイトで、再生ボタンや年齢確認のボタンを押す
    2. 突然「登録完了」と表示され、高額な料金を請求される
    3. 「誤作動の方はこちら」「退会はこちら」などの案内から連絡させ、支払いを求めたり個人情報を聞き出したりする
    4. 「いったん払えば手数料を引いて返金する」などと言って電子マネーで払わせ、返金しない例もある
  features:
  - ボタンを押しただけで「登録完了」になる
  - 料金や契約内容の説明がないまま請求画面が出る
  - 「誤作動」「退会」のための連絡先が書かれている
  red_flags:
  - 有料であることや金額が事前に示されていない
  - 連絡をうながす「退会・誤作動はこちら」の案内
  - 電子マネーでの支払いを求める
  right_action: 連絡しない、支払わない。連絡すると新たな個人情報を相手に知らせることになる。請求画面が消えない場合は、IPAが案内している消し方を確かめる。不安なときは消費者ホットライン188に相談する。
  legit_contrast: 大阪府の消費生活相談の案内では、「登録されました」と表示されても、有料であることや金額が示されていなければ契約が成立しているとはいえないと説明している。正規の有料サービスは、料金や内容を示したうえで申し込ませる。
  trend: 国民生活センターは2025年10月にも注意を呼びかけ、スマホで無料動画を見ていて「登録完了」となり、電話すると約50万円を請求され、「いったん30万円払えば返金する」と言われた70歳代の相談者が電子マネーで払ったのに返金されなかった例を紹介した。一方、IPAへのワンクリック請求の相談は2025年7〜9月で7件と少なくなっている。
