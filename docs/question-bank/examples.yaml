  - 推し活の買い物で「公式・正規のルート」を選ぶ問題（広告表示のある販売ページ、公式サイトからのリンク、SNSの個人の出品を並べる）
  - ○×問題：「オンラインくじの賞品をフリマで買っても、運営会社の交換・返金の保証を受けられる」（×）
- id: EX-076
  kind: scam
  title: 「ゲームで使えるポイントが無料でもらえる」と誘う偽サイト（アカウント情報を盗む）
  situation: S13
  channels:
  - chat
  - sns
  - web
  tactics:
  - T01
  - T05
  - T06
  targets:
  - 学生
  level: easy
  level_reason: 「無料でもらえる」という分かりやすい誘い文句で、公式ではない画面にログイン情報を入れさせる典型的な手口
  flow: |
    1. ゲーム内のチャットやSNSで「ゲームで使えるポイントを無料で手に入れられる」などと誘うメッセージやリンクが届く（「アカウントに重大な問題が起きたのでパスワードの変更が必要」と不安をあおる形もある）
    2. リンク先は正規のログイン画面に似せた偽サイトで、IDとパスワード、個人情報、クレジットカード情報を入力させる
    3. 盗まれた情報で、アカウントやゲーム内のアイテム、登録情報が悪用される。リンク先がウイルスを配るサイトのこともある
  features:
  - 「無料」「ポイント」「当選」などの言葉で誘う
  - 公式のログイン画面にそっくりな画面を使う
  - 人気ゲームに見せかけた偽アプリを入れさせ、ウイルスに感染させる例もある
  red_flags:
  - 公式アプリや公式サイト以外の画面でログインを求められる
  - ゲーム内の通貨やポイントを「無料で配る」とうたう
  right_action: メッセージのリンクは開かない。ログインやパスワード変更が必要なときは、送られてきたリンクではなく、公式アプリや公式サイトなど信頼できる入口から確かめる。
  legit_contrast: ゲーム会社は、指定していない決済サービスを使わないよう呼びかけている。ゲーム内の通貨やアイテムは、公式に用意された方法で手に入れるものと考える。
  sources:
  - publisher: INTERNET Watch
    title: 意外と知らない? ネットセキュリティの基礎知識（連載記事）
    url: https://internet.watch.impress.co.jp/docs/column/security_basic/1227871.html
  - publisher: 奈良県警察
