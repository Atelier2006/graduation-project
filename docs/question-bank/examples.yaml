    title: （フリマアプリで架空取引を持ちかけられるトラブルに関する注意喚起）
    url: https://www.kokusen.go.jp/news/data/n-20211118_1.html
    published: 2021-11
  - publisher: Impress（INTERNET Watch）
    title: （国民生活センターのフリマサービスのトラブルに関する注意喚起を伝える記事）
    url: https://internet.watch.impress.co.jp/docs/news/2045558.html
    published: 2025-09
  question_ideas:
  - フリマアプリの取引メッセージで「直接取引しませんか」と言われる画面を見せ、正しい返し方を選ぶ問題
  - 運営が代金をいったん預かる正規の取引画面と、アプリの外での振込を求めるメッセージを比べる問題
- id: EX-079
  kind: scam
  title: 息子や孫を名乗り「番号が変わった」から始まるオレオレ詐欺
  situation: S15
  channels:
  - chat
  tactics:
  - T04
  - T07
  targets:
  - 高齢者
  level: normal
  level_reason: 「風邪で声が変」「携帯をなくした」と声の違いをごまかすので気づきにくいが、元の番号にかけ直すだけで見抜ける
  flow: |
    1. 息子や孫を名乗る人から電話があり、「風邪をひいて声が変」「携帯電話をなくして番号が変わった」などと言われる
    2. その後、新しい番号から「会社の小切手をなくした」「かばんを置き忘れた」「会社のお金を使い込んだ」などと、急いでお金が必要だと相談される
    3. 「同僚（部下）が取りに行く」と言われ、自宅に来た人に現金を渡してしまう。振込を指示されることもある
  features:
  - 声の違いを風邪や携帯電話の故障・紛失のせいにする
  - 先に「番号が変わった」と伝えてから、お金の話をする
  - 本人ではなく代わりの人が現金を受け取りに来る
  - 上司や弁護士、警察官を名乗る人物が電話に出てくることもある
  red_flags:
  - 電話番号が変わったという連絡のあとに、お金の相談が来る
  - 急いでいることを強調し、ほかの家族に相談させない
  - 知らない人に現金を手渡すよう言われる
  right_action: いったん電話を切り、本人の元の電話番号にかけ直すか、直接会って確かめる。家族で電話の「合言葉」を決めておくのも有効。知らない人に現金を渡さない。不安なときは「#9110」や最寄りの警察署に相談する。
  legit_contrast: 家族の番号変更の連絡が本物かどうかは、元の番号にかけ直したり直接会ったりして確かめられる（静岡市・富山県警の注意喚起）。
  trend: 2025年のオレオレ詐欺は14,489件（警察庁の確定値）で、そのうち74.9%は警察官をかたるニセ警察詐欺だった。2026年からはニセ警察詐欺を別に集計し、親族や弁護士などを装って示談金などを求めるものを「オレオレ詐欺」としている。オレオレ詐欺などでは、だます手段の9割以上が電話とされる（2025年の暫定値資料）。
  sources:
