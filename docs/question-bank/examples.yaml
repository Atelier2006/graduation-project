- id: EX-048
  kind: scam
  title: 国税庁・税務署をかたる「税金の未納・差押え」メールとSMS
  situation: S08
  channels:
  - email
  - sms
  tactics:
  - T01
  - T13
  - T04
  - T06
  - T07
  targets:
  - 全世代
  level: easy
  level_reason: 「24時間以内に払わないと差押え」という脅しは典型的で、公的機関の注意喚起が多い。支払い方法の不自然さでも見抜ける
  flow: |
    1. 国税庁や税務署、国の電子申告・納税システムを名乗るメールやSMSが届き、未納の税金があると伝える
    2. 「未納分の税金を24時間以内に支払わなければ資産を差し押さえる」などと急がせ、記載のURLへ誘導する
    3. リンク先でコード決済での送金や、クレジットカード情報などの入力を求められる。インターネット専用のプリペイドカードを買わせる例もある
  features:
  - 公的機関の名前と「未納」「差押え」などの強い言葉を使う
  - 国税庁のホームページに似せた偽サイトへ誘導する例がある
  - 支払い方法がコード決済の送金やプリペイドカードなど、税金の納め方として不自然
  red_flags:
  - 税金の納付や差押えの予告がSMS・メールで届く
  - SMSにURLが書かれている
  - 24時間以内など、極端に短い期限
  - コード決済の送金やプリペイドカードで払わせようとする
  right_action: URLは開かずに削除し、支払わない。不安なときは、自分で調べた国税庁・税務署の窓口や、最寄りの消費生活センター（消費者ホットライン188）に相談する。
  legit_contrast: 国税庁・国税局・税務署は、SMSやメールで差押えの連絡をしない。納税者の同意がない限りメールで納付を求めず、SMSでURL付きの案内も送らない。電子申告システムのお知らせメールも税金の納付は求めず、原則として本文にURLを載せない（R1-17を参照）。
  trend: 2026年5月、国民生活センターが相談を受けて注意を呼びかけた（メールの指示でコード決済で支払ってしまった20歳代の相談例など）。2026年3月には県も、国税庁のホームページに似せた偽サイトやプリペイドカードを買わせる被害について注意を呼びかけた
  sources:
  - publisher: 国民生活センター
    title: （ページ名未確認）国税庁やe-Taxをかたる不審なSMSやメールに関する注意喚起
    url: https://www.kokusen.go.jp/news/data/n-20260527_1.html
    published: 2026-05
  - publisher: INTERNET Watch
    title: メールで税金の納付を求めることはありません! 国税庁やe-Taxをかたる不審なメールに、国民生活センターが注意喚起
    url: https://internet.watch.impress.co.jp/docs/news/2112792.html
  - publisher: 埼玉県
    title: 不審なメールにご注意ください
    url: https://www.pref.saitama.lg.jp/a0209/z-kurashiindex/z-fuhin-mail_cyui-kanki.html
    published: 2026-03
  question_ideas:
  - easy版：「24時間以内に払わないと差押え」メールを見抜く
  - 本物の電子申告システムのお知らせメール（URLなし・納付を求めない）と並べて比べる問題
  - 行動問題：不安なときの相談先（188・税務署）を選ぶ
- id: EX-049
  kind: scam
  title: 市役所や年金事務所の職員を名乗り「医療費の還付金がある」とATMへ行かせる還付金詐欺
  situation: S08
  channels:
  - chat
  tactics:
  - T13
  - T05
  - T04
  - T07
  targets:
  - 高齢者
  level: easy
  level_reason: 「ATMでお金が返ってくる」という典型的な話で、注意喚起も多い。ATMで還付を受けることは絶対にないと知っていれば見抜ける
  flow: |
    1. 市役所・税務署・年金事務所などの職員を名乗る人から、「医療費や保険料の払い戻しがある」「未払いの年金がある」などと電話がある
    2. 「手続きの期限が過ぎている」などと急がされ、通帳・キャッシュカード・携帯電話を持ってATMへ行くよう言われる
    3. ATMで電話の指示どおりに操作すると、実際には自分の口座から相手の口座にお金を振り込んでしまう（ネットバンキングを操作させる例もある）
  features:
  - お金を「受け取れる」という良い話から始まる
  - 払い戻しに期限があると言って焦らせる
  - ATMで携帯電話で話しながら操作させる
  red_flags:
  - 役所の職員が電話でATMへ行くよう指示する
  - ATMで「お金が戻る」と言われる
  - 期限を理由に急がせる
  right_action: 電話を切り、ATMには行かない。心当たりがあれば、届いている書類や自治体の公式サイトで自分で調べた担当窓口に問い合わせる。ATMでは携帯電話で話しながら操作しない。不安なときは「#9110」に相談する。
  legit_contrast: ATMでお金が返ってくることは絶対にない（警察庁）。市役所・区役所は還付金のお知らせを書面で行い、電話で銀行やATMに行くよう案内することはない（千葉市・板橋区）。
  trend: 2025年の還付金詐欺は3,184件（警察庁の暫定値）。2026年7月末の暫定値では1,757件で、前年同期より15.1%減っているが、引き続き発生している。
  sources:
  - publisher: 警察庁
    title: 還付金詐欺
    url: https://www.npa.go.jp/bureau/safetylife/sos47/case/refund/
  - publisher: 千葉市
    title: （ページ名未確認）医療費・保険料の還付金をかたる詐欺への注意
    url: https://www.city.chiba.jp/shimin/seikatsubunka/shohi/iryouhi-hokennryousagi.html
  - publisher: 板橋区
    title: （ページ名未確認）還付金をかたる不審な電話への注意
    url: https://www.city.itabashi.tokyo.jp/kenko/kokuho/kokuho/1060406.html
  - publisher: 警察庁
    title: 令和７年における特殊詐欺及びＳＮＳ型投資・ロマンス詐欺の認知・検挙状況等について（暫定値）（PDF）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/assets/img/new-topics/detail/260213/03/r7_sagi_data_01.pdf
    published: 2026-02
  - publisher: 警察庁
    title: 令和8年7月末における特殊詐欺の認知・検挙状況等について（暫定値）
    url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/260904/01.html
    published: 2026-09
  question_ideas:
  - 「医療費の還付があるので、携帯を持ってATMへ」という電話の会話を見せ、詐欺かどうかを選ぶ（易しい版）
  - 比較問題：本物の還付のお知らせ（書面で届く）と、電話でATMへ誘導する案内を比べる
- id: EX-050
  kind: scam
  title: 国の調査や給付金の案内をかたるメール（国勢調査・給付金）
  situation: S08
  channels:
  - email
  tactics:
  - T01
  - T13
  - T04
  - T05
  - T06
  targets:
  - 全世代
  level: normal
  level_reason: 実際に国勢調査が行われている時期や、実際の給付・ポイント事業に合わせて届くため本物らしく見える。行政がメールで回答や申請を求めないと知っていれば見抜ける
  flow: |
    1. 国の統計機関や行政のオンライン手続き窓口を名乗るメールが届く（例：「【国勢調査2025】ご協力のお願い」、物価高騰の緊急支援給付金の案内）
    2. 「回答しないと罰則の対象になる」と脅したり、「回答者に記念品を贈る」「給付金の案内」「獲得したポイントが失効する」と誘ったりして、リンクへ誘導する
    3. 偽サイトへ誘導し、情報を入力させようとする
  features:
  - 件名に調査名や給付金の名前を入れ、公的な案内に見せる
  - 「罰則」という強い言葉と、「記念品」「給付金」などの得をする話の両方を使う
  - 実際に調査や給付が行われている時期に合わせて届く
  - 税金の滞納や差し押さえを理由に、特設サイトへ誘導するものもあった
  red_flags:
  - 国勢調査の回答依頼がメールで届く（国・県・市区町村はメールで回答を依頼しない）
  - 回答者への記念品の案内（本物の調査では贈呈品はない）
  - 給付金やポイントの手続きを、メールのリンクからさせようとする
  right_action: リンクは開かない。調査や給付金については、市区町村の担当窓口や、自分で調べた公式サイトで確かめる。
  legit_contrast: 本物の国勢調査は、調査員が各世帯を訪問して書類を配る。調査員は身分を示す「調査員証」を持っており、口座情報や預貯金額などを聞くことはない。
  trend: 2025年の国勢調査の時期（2025年9月ごろ）に各地で不審メールが確認され、2026年4月末の時点でも国勢調査をかたるメールが確認されていた。2023年には、行政のオンライン手続き窓口をかたり、給付金やポイントを口実にするメールが出回った
  sources:
  - publisher: 青森県
    title: 国勢調査をかたる不審メールの受信が確認されています
    url: https://www.pref.aomori.lg.jp/release/2025/78932.html
    published: 2025-09
  - publisher: 箕面市
    title: 国勢調査をかたる不審メールや詐欺にご注意ください
    url: https://www.city.minoh.lg.jp/shisei/toukei/kokuseikatarichuui.html
  - publisher: 広島県
    title: （ページ名未確認）国勢調査2025に関するお知らせ（国勢調査をかたる不審メールへの注意）
    url: https://www.pref.hiroshima.lg.jp/soshiki/21/kokusei2025.html
  - publisher: ScanNetSecurity
    title: マイナポータルを騙るフィッシングに注意喚起、第 2 弾はすでに終了
    url: https://scan.netsecurity.ne.jp/article/2023/12/12/50347.html
    published: 2023-12
  question_ideas:
  - 「国勢調査に回答しないと罰則」メールを見抜く問題
  - 本物の調査員の訪問（調査員証）と、メールでの回答依頼を比べる問題
  - 給付金の「申請はこちら」リンクを押さない行動問題
- id: EX-051
  kind: scam
  title: 寄附額を値引きするふるさと納税の偽サイト
  situation: S08
  channels:
  - web
  tactics:
  - T01
  - T15
  - T05
  - T07
  targets:
  - 社会人
  level: normal
  level_reason: 本物の返礼品の画像や名前がコピーされていて見た目は本物らしいが、「寄附額の値引き」「自治体と関係ない口座名義」という決定的なサインがある
  flow: |
    1. ふるさと納税の返礼品を探していて、寄附額が割引・値引きされているサイトを見つける
    2. サイトには自治体の返礼品の画像や名前が載っていて、本物の申込みサイトのように見える
    3. 申し込むと、自治体と関係のない個人名や会社名の口座に振り込むよう指示される（氏名・住所・クレジットカード情報を入力させられるおそれもある）
    4. 返礼品が届かず、寄附金の税の控除も受けられない
  features:
  - 本物の返礼品の画像や名前を無断でコピーしている
  - 寄附額を割引・値引きしているという表示がある
  - 自治体の住所・連絡先が書かれていない。販売事業者の住所・電話番号もなく、連絡先がフリーメールだけ
  red_flags:
  - 寄附額の割引・値引き（自治体は寄附額を値引きしない）
  - 振込先の口座名義が、自治体と関係のない個人名や会社名、または販売事業者名と一致しない
  right_action: ふるさと納税は、寄附したい自治体の公式ホームページのリンクから、その自治体が指定している受付サイトで申し込む。不安なときは、寄附先の自治体に直接確かめる。
  legit_contrast: 自治体は返礼品を送ることはあっても、寄附額を割引・値引きすることはない。インターネットでの受付サイトは自治体ごとに決まっていて、自治体の公式サイトで案内されている。
  trend: 2025年9月に神戸市・長野市が、2026年4月に福岡県が、ふるさと納税の偽サイトへの注意を呼びかけている
