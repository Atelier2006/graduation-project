- id: EX-065
  kind: scam
  title: 偽警告の電話から遠隔操作され、ネットバンキングの送金額を書き換えられる
  situation: S11
  channels:
  - web
  - chat
  tactics:
  - T06
  - T07
  - T08
  - T10
  targets:
  - 高齢者
  - 社会人
  level: normal
  level_reason: 入口は典型的な偽警告だが、送金画面は自分で操作しているように見え、遠隔操作中の金額の書き換えに気づきにくい
  flow: |
    1. 偽のウイルス警告に出た電話番号に電話し、相手の指示で遠隔操作ソフトを入れる（R3-01と同じ入口）
    2. 「サポート料金」などの名目で、インターネットバンキングにログインして送金するよう指示される
    3. 本人は少額を入力したつもりでも、遠隔操作で金額の桁を増やされ、高額が送金される
    4. 会社や団体の業務用パソコンで同じ流れになり、事業用の口座から高額が送金された例も報じられている
  features:
  - 電子マネーではなく、ネットバンキングでの支払いを指示する
  - 相手がパソコンを自由に操作できる状態のまま、ログインや送金の操作をさせる
  red_flags:
  - サポートの電話なのに、ネットバンキングへのログインや送金を求められる
  - 遠隔操作されている画面で、ID・パスワードや認証コードの入力、送金をさせられる
  right_action: ネットバンキングを開くよう言われた時点で電話を切り、操作をやめる。ID・パスワードなどは相手に伝えない。送金してしまった・ログインしてしまった場合は、すぐに取引している銀行に連絡し、警察や消費者ホットライン188に相談する。入れてしまった遠隔操作ソフトは削除する。
  legit_contrast: 国民生活センターや金融機関の注意喚起は、警告画面の電話番号に電話しないこと、求められたソフトを入れないこと、IDやパスワードを他人に伝えないことを共通して呼びかけている。
  trend: 国民生活センターは2024年3月、サポート詐欺の相談が2023年度に前年度同期の約1.3倍に増え、特に70歳以上で大きく増えていること、ネットバンキングで送金を指示される例があることを公表した。岐阜県警察の広報資料（2025年4月）は、令和6年のサポート詐欺を1,506件・被害額約11億9,000万円と紹介している。IPAの企業・組織向けの相談窓口にも、2025年10〜12月にサポート詐欺の相談が33件寄せられた。2026年6月にも、団体の業務用パソコンに偽の警告が出て電話した結果、遠隔操作されてネットバンキングから約440万円が送金されたと報じられた。
