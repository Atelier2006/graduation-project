    title: インターネット・バンキングの不正送金に関する注意喚起のページ（題名未確認）
    url: https://www.fsa.go.jp/ordinary/internet-bank_2.html
  question_ideas:
  - 銀行を名乗るメール（リンク先で暗証番号を入力させる）と、本物のお知らせ（入力を求めず、公式アプリでの確認を促す）を比べる問題
  - ○×問題：「銀行からのSMSで暗証番号の入力を求められることがある」（×）
- id: EX-020
  kind: legit
  title: 銀行員や銀行協会の職員を名乗る電話・訪問があっても、口座情報・暗証番号・キャッシュカードは渡さない
  situation: S03
  channels:
  - chat
  tactics:
  - T01
  - T06
  - T07
  targets:
  - 全世代
  level: easy
  level_reason: 「教えない・渡さない」という分かりやすいルールで、注意喚起も多い
  flow: |
    1. 銀行の業界団体は、銀行協会の職員や銀行員を名乗って口座情報や暗証番号を聞き出そうとしたり、偽サイトを表示したスマホやタブレットを見せて入力させようとしたりする手口があると注意している
    2. 電話や訪問を受けても、口座情報を教えたり、キャッシュカードや現金を渡したりしないよう呼びかけている
    3. 電話や訪問で口座番号や暗証番号を尋ねることはしないと案内している銀行もある
  features:
  - 本物の銀行や業界団体は、電話や訪問で暗証番号を聞いたり、キャッシュカードを預かったりしない
  red_flags:
  - 電話や訪問で暗証番号や口座情報を聞かれる
  - その場でスマホやタブレットの画面に暗証番号を入力するよう求められる
  - キャッシュカードや現金を渡すよう求められる
  right_action: その場で教えたり渡したりしない。いったん電話を切り、公式サイトなどに載っている銀行の窓口に自分から確かめる。
  legit_contrast: 偽物は、銀行協会や銀行の職員を名乗って口座情報や暗証番号を聞き出し、キャッシュカードや現金をだまし取ろうとする。
  sources:
  - publisher: 全国銀行協会
    title: 銀行協会職員などを名乗る詐欺への注意のページ（題名未確認）
    url: https://www.zenginkyo.or.jp/topic/detail/nid/9013/
  - publisher: 北海道銀行
