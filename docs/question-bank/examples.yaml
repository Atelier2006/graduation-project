  - 相手から「この番号にかけ直して」と教えられた番号は、犯人につながる
  right_action: いったん切って、自分で調べた番号（最寄りの警察署・#9110）にかけ直す。相手が言う番号には折り返さない。メッセージアプリのビデオ通話で警察手帳や逮捕状を見せられたら、#9110に連絡する。
  legit_contrast: ニセ警察詐欺では、SNSやビデオ通話への誘導、警察手帳・逮捕状の提示、口止め、送金の要求が組み合わさって現れる。本物の警察はこのどれもしない。
