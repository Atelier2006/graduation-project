  - 全世代
  level: hard
  level_reason: 着信画面に警察署のような番号が出たり、ビデオ通話で制服姿・警察手帳・本人の名前入りの逮捕状を見せられたりするため、見た目では本物と区別しにくい。「本物の警察はSNSやビデオ通話で連絡しない」という知識と、かけ直して確かめる行動が必要
  flow: |
    1. 警察官を名乗る人物から電話があり、「あなたの口座（携帯電話）が犯罪に使われている」「捜査の対象になっている」などと告げられる（電話会社や総務省の職員を名乗る人から、警察官役に代わる場合もある）
    2. 連絡用にメッセージアプリへの登録を求められ、SNSでのやり取りやビデオ通話に移る
    3. ビデオ通話で制服姿や警察手帳、本人の実名が書かれた逮捕状などを見せられ、「秘密の事件なので誰にも言わないように」と口止めされる
    4. 資産の状況を聞き出され、「資産を保護する」「口座のお金の流れを調べる」などの名目で、指定された口座への振込や暗号資産での送金を求められる
  features:
  - 着信画面に、警察署の番号に似た番号（末尾が「0110」など）や「+」から始まる国際電話番号が表示されることがある
  - 電話の途中で、メッセージアプリでのやり取りやビデオ通話に切り替えさせる
  - 警察手帳や逮捕状を画面越しに見せて信用させる。検察官を名乗ることもある
  - 家族や周りの人に話さないよう強く口止めする
  - 送金のほか、金の延べ板（金地金）を出させる例や、ビデオ通話で裸になるよう求めるなどのわいせつな要求をする例も警察庁が報告している
  red_flags:
  - 警察を名乗る相手が、SNSやビデオ通話で連絡や取り調べをしようとする
  - 逮捕状や警察手帳の画像・映像を見せてくる
  - 捜査や「資産の保護」を理由に、振込や暗号資産の送金を求める
  - 「誰にも言うな」と相談を禁じる
  right_action: 要求には応じず、いったん電話を切る。相手が教えた番号には折り返さず、自分で調べた最寄りの警察署の番号か、警察相談専用電話「#9110」にかけて確かめる。一人で判断せず、家族や身近な人にも相談する。
  legit_contrast: 本物の警察官は、SNSやビデオ通話で連絡したり取り調べをしたりしない。逮捕状や警察手帳の画像を送ることも、捜査を理由にお金や暗号資産を送らせることもない（警察庁・警視庁・愛知県警などの注意喚起）。
  trend: 2025年のニセ警察詐欺は認知件数11,014件・被害額約1,005億円（警察庁の確定値）。特殊詐欺全体の被害額（約1,423億円、前年比+98.0%）を押し上げた最大の要因とされる。2026年からは独立した手口として集計され、2026年7月末の暫定値では件数が前年同期比6.4%減の一方、被害額は約617億円（同+25.7%）で、1件あたりの被害が大きくなっている。愛知県警の資料では、被害者は20〜50代が中心とされる。
