  level: easy
  level_reason: 「本日中に払わないと水が止まる」という強い脅しが典型的で、2026年7月に各地の水道局・自治体が相次いで注意を呼びかけた
  flow: |
    1. 住んでいる地域の水道局を名乗るSMSやメールが届き、水道料金が未払いだと伝える
    2. 「本日中に支払いがないと水が止まる」「支払わなければ給水を停止する」などと急がせ、リンクへ誘導する
    3. リンク先の偽サイトでクレジットカード情報などを入力させる
  features:
  - 都や市の水道局の名前を使う
  - 「本日中」などの期限と給水停止の予告で急がせる
  - 料金の支払いを、リンク先でのカード情報の入力で済ませるよう求める
  red_flags:
  - 水道料金の請求や給水停止の予告がSMS・メールで届く（自治体はSMSやメールで料金請求や給水停止を案内しないとしている）
  - リンク先でカード情報の入力を求める
  right_action: リンクは開かずに削除する。気になるときは、自分で検索した水道局の公式サイトや、水道局のお客さまセンターに問い合わせる。誤って入力してしまったら、カード会社と警察に相談する。
  legit_contrast: 水道料金の請求や給水停止をSMSやメールで知らせない自治体がある。会員向けのマイページで支払いのメールを送る自治体でも、リンク先で個人情報の入力は求めない（R1-18を参照）。
  trend: 2026年7月、東京都・大阪市・神奈川県などが相次いで注意を呼びかけた（大阪市には7月4日以降、問い合わせが相次いだ）。横浜市も、同様のメールやSMSの通報が急増しているとしている
  sources:
