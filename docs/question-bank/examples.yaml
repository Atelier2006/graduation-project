  - 本物のCAPTCHA（チェックボックスだけ）と偽物（キー操作の手順つき）を並べ、偽物を選ぶ問題
  - 偽の確認画面の手順を見せ、「どの時点で閉じるべきか」を選ぶ問題
- id: EX-068
  kind: scam
  title: 「通知を許可」させて偽のセキュリティ警告を何度も出すブラウザ通知の悪用
  situation: S11
  channels:
  - web
  tactics:
  - T04
  - T10
  targets:
  - 全世代
  level: normal
  level_reason: 通知を許可したきっかけを忘れていると原因が分かりにくいが、同じ警告が繰り返し出る、購入やアプリ導入に誘導する、という点で見抜ける
  flow: |
    1. Webサイトを見ていると、ブラウザの通知を許可するよう誘導され、「許可」を押してしまう
    2. その後、ブラウザを開いている間に「コンピュータが危険にさらされています」「携帯をクリーンアップしてください」などの通知が繰り返し表示される
    3. 通知をクリックすると不審なサイトに誘導され、セキュリティソフトの購入やアプリのインストールを勧められる
  features:
  - そのサイトを見ていないときでも、ブラウザの通知として警告が出る
  - 同じような警告が何度も表示される
  red_flags:
  - 見覚えのないサイトからの通知でセキュリティの危険を知らせてくる
  - 通知から開いたサイトで、ソフトの購入やアプリの導入を迫られる
  right_action: よく分からないサイトの通知は安易に許可しない。繰り返し出るセキュリティ警告をうのみにせず、誘導先のサイトでは操作も入力もしない。許可してしまった場合は、ブラウザの設定からそのサイトの通知の許可を取り消す。
  legit_contrast: 通知の許可は、自分が使っていて連絡を受け取りたい正規のサイトに限る。IPAは、繰り返し表示されるセキュリティ警告は偽の通知であることが多いと案内している。
  trend: IPAは2021年3月にこの手口の注意喚起を出し、2026年3月にもページを更新している。
  sources:
  - publisher: IPA（情報処理推進機構）
    title: 安心相談窓口だより：ブラウザの通知機能を悪用して不審なサイトへ誘導する手口（題名は要約）
    url: https://www.ipa.go.jp/security/anshin/attention/2021/mgdayori20210309.html
    published: 2021-03
  - publisher: マイナビニュース
    title: IPAによるブラウザ通知悪用の注意喚起の記事（題名は要約）
    url: https://news.mynavi.jp/article/20210315-security/
    published: 2021-03
  question_ideas:
  - 「通知を許可しますか？」のポップアップを見せ、押すべきボタンを選ぶ問題
  - 何度も出る「端末が危険です」という通知を見せ、原因と対処（設定で通知の許可を取り消す）を選ぶ問題
- id: EX-069
  kind: scam
  title: スマホの偽警告から、定期的に料金がかかるアプリを入れさせる
  situation: S11
  channels:
  - web
  tactics:
  - T04
  - T10
  targets:
  - 全世代
  level: normal
  level_reason: 誘導先がアプリのインストール画面なので普通の手続きに見えやすいが、Webページの警告がアプリ導入を急がせる点で見抜ける
  flow: |
    1. スマホでWebサイトを見ていると、「ウイルスに感染しています」などの偽の警告が突然出る
    2. 警告の指示に従って進むと、アプリのインストール画面に誘導される
    3. 入れたアプリが、自動継続課金（定期的に料金がかかる契約）を伴う場合がある
  features:
  - 偽の警告の目的は、アプリを入れさせて報酬を得ること（アフィリエイト）と考えられている
  - 警告の指示のとおりに進むだけで、アプリのインストールまで進んでしまう
  red_flags:
  - Webページに出た警告が、アプリのインストールを急がせる
  - 誘導されたアプリが自動継続課金を伴う
  right_action: 警告の指示ではアプリを入れない。アプリが必要なときは、信頼できるアプリストアで内容や許可する権限を確かめてから入れる。入れてしまった場合は、自動継続課金の契約がないか確かめる。
  legit_contrast: IPAは、本物のセキュリティ警告かどうか落ち着いて確かめること、信頼できるアプリマーケットから入手し、アプリに許可する権限を確認することを勧めている。
  trend: IPAは2019年9月にこの手口を取り上げ、2022年10月にも自動継続課金のアプリへの誘導としてあらためて注意を呼びかけた。
  sources:
  - publisher: IPA（情報処理推進機構）
    title: 安心相談窓口だより：スマートフォンの偽のセキュリティ警告から自動継続課金のアプリへ誘導する手口に再注意（題名は要約）
    url: https://www.ipa.go.jp/security/anshin/attention/2022/mgdayori20221025.html
    published: 2022-10
