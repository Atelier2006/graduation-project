    title: ネットトラブルの相談先に関する資料（題名未確認）
    url: https://www.city.shinjuku.lg.jp/content/000371137.pdf
  question_ideas:
  - 売買サイト風の画面（「課金代行 正規の5%で！」「IDとパスワードを送ってください」）を見て危ない点を選ぶ問題
  - ○×問題：「課金代行はアカウントの売買ではないので規約違反ではない」（×）
- id: EX-078
  kind: scam
  title: フリマアプリの外での直接取引に誘う
  situation: S14
  channels:
  - sns
  - chat
  tactics:
  - T04
  - T07
  targets:
  - 全世代
  level: easy
  level_reason: 「アプリの外での取引」という分かりやすいサインがあり、自治体などの注意喚起も多い
  flow: |
    1. フリマアプリで出品・購入のやり取りをしている相手から、「前の買い手がキャンセルしたので直接取引したい」「すぐに振り込むから売って」などと、アプリの外での取引を持ちかけられる
    2. SNSやメールでのやり取りに移り、アプリの決済を通さない方法（振込や電子マネーなど）で支払ったり、先に商品を送ったりする
    3. お金や商品をだまし取られ、相手と連絡がとれなくなる
  features:
  - アプリの外（SNSやメール）でのやり取りを求める
  - 「すぐに振り込む」などと急がせる
  - 支払いにコンビニで買える電子マネーなどを使わせる
  red_flags:
  - アプリの取引画面を通さない支払いや発送を求められる
  - 運営事業者の決済の仕組みを使わない取引になる
  right_action: 直接取引の誘いには応じず、やり取りも支払いもアプリの中だけで行う。困ったときはまず運営事業者に相談し、それでも解決しなければ消費者ホットライン188に相談する。
  legit_contrast: フリマアプリの正規の取引では、運営事業者がいったん代金を預かり、取引が終わってから出品者に支払われる仕組み（エスクロー）がある。この仕組みを使わない取引は、代金が確実に支払われる保証がない。
  trend: フリマサービスでのトラブルについては、2025年にも国民生活センターが注意を呼びかけている
  sources:
  - publisher: 世田谷区
    title: （ネット通販とフリマアプリのトラブルに関する啓発資料）
    url: https://www.city.setagaya.lg.jp/documents/1129/netokushontohurimaapuri_2.pdf
