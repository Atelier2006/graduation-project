  - 公式アカウントそっくりの当選DM（IDが1文字違い・開設が最近・リンクから個人情報を入力させる）を見抜く問題
  - 本物の当選連絡（キャンペーンを行った公式アカウントからの連絡）と並べて比べる問題
- id: EX-084
  kind: legit
  title: 本物のプレゼントキャンペーンの当選連絡は、実施した公式アカウントから決められた方法で届く
  situation: S16
  channels:
  - sns
  tactics:
  - T01
  - T05
  - T06
  targets:
