  question_ideas:
  - 本物のログイン画面（IDとパスワードだけ）と、カード番号まで聞く偽画面を比べる問題
  - 「メールの二次元コードから本人確認」は偽物、と判断する問題
- id: EX-087
  kind: scam
  title: 災害に便乗した偽の義援金・募金の呼びかけ
  situation: S18
  channels:
  - sns
  - email
  - web
  - chat
  tactics:
  - T01
  - T13
  - T04
  - T07
  targets:
  - 全世代
  level: normal
  level_reason: 「被災地を助けたい」という気持ちにつけこむため冷静になりにくいが、「公的機関が電話や訪問で求めることはない」などのはっきりした見分け方がある
  flow: |
    1. 大きな災害の直後、SNSやメールで、有名な支援団体や公的機関を名乗る義援金の呼びかけや、被災者の身内・友人を名乗る支援の呼びかけを見る
    2. 本物に似せた団体のサイトに誘導され、正規の募金口座とは違う口座への振込や、電子マネー・暗号資産での送金を求められる
    3. 「市が義援金を集めている」などと公的機関を名乗る電話や、自宅への訪問で寄付を求められることもある
  features:
  - 有名なボランティア団体や公的機関の名前を使う
  - 被災者の身内や友人を名乗り、困っているので送金してほしいと頼む
  - SNSで救助を求める投稿をした後、「今後の資金」として電子マネーを求める例が懸念されている
  - 支払いを電子マネーや暗号資産、スマホ決済で求める
  red_flags:
  - 寄付先の団体や使い道がはっきりしない
  - 振込先が、公式に発表されている口座・名義と違う
  - 公的機関を名乗って、電話や訪問で義援金を求めてくる
  right_action: 寄付は、自治体や公的な支援団体の公式サイトに載っている窓口から行う。電話や訪問で義援金を求められても応じず、不審なときは名乗った機関に自分で調べた連絡先で確かめるか、警察相談専用電話（#9110）や消費者ホットライン188に相談する。
  legit_contrast: 公的機関が、義援金や支援物資を電話や訪問で求めることはない。正規の義援金の振込先は、自治体や団体の公式サイトなどで公表されている。
  trend: 2026年夏の熊本の地震の際にも、金融庁・県警・自治体・地元の金融機関が義援金を装う詐欺に注意を呼びかけた。2024年の能登半島地震の際には、市を名乗る不審な電話などの相談が寄せられた
  sources:
