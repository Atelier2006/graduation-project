  - 架空の県警名の「警察サイト風ページ」に「氏名番号検索」「在宅捜査の申請」欄がある画面を見せ、怪しい点を選ぶ問題
  - 行動問題：電話で「このページで番号を入れて、逮捕状を確認して」と言われたときの正しい行動を選ぶ
- id: EX-060
  kind: scam
  title: 検索で上位に出た「相談窓口」「サポート窓口」が本物ではない
  situation: S09
  channels:
  - web
  - chat
  tactics:
  - T01
  - T08
  - T07
  targets:
  - 全世代
  level: hard
  level_reason: 検索結果の上位に出て、公的な窓口や企業のサポートのように見えるため、見た目だけでは区別しにくい
  flow: |
    1. 解約などのトラブルで困り、相談窓口や企業の問い合わせ先をネットで検索する
    2. 検索結果の上位に出た窓口に電話する（海外では、正規のサポートページの検索結果に偽の電話番号が表示される手口も報告されている）
    3. 公的な相談窓口や企業のサポートだと思って話すと、実は別の事業者で、費用を求められたり、個人情報を聞かれたりする
  features:
  - 「消費者センター」のような公的な窓口や、企業のサポート窓口のように見える
  - 検索結果の上位に表示される
  - 慌てているときに急いで検索して見つけた番号にかけてしまう
  red_flags:
  - 相談しただけなのに費用を求められる
  - 電話番号が、企業の公式サイトや契約時の書類に書かれたものと違う
  right_action: 公的な消費生活相談は、検索せずに消費者ホットライン188（局番なし）にかける。企業の問い合わせ先は、検索結果の上位をそのまま使わず、その企業の公式サイトや契約時の書類に書かれた連絡先を使う。
  legit_contrast: 消費者ホットライン188にかけると、最寄りの市区町村や都道府県の消費生活センターなどを案内してもらえる。
  trend: 海外のセキュリティ企業が、正規サイトの検索結果に偽の電話番号を表示させる手口を報告している（2025年）。生成AIの回答に偽の連絡先を示させる手口も紹介されている（2026年）
  sources:
