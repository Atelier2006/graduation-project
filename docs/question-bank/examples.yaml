- id: EX-064
  kind: scam
  title: パソコンに出る偽のウイルス警告から電話をかけさせるサポート詐欺
  situation: S11
  channels:
  - web
  - chat
  tactics:
  - T01
  - T04
  - T07
  - T08
  - T10
  targets:
  - 高齢者
  - 社会人
  level: easy
  level_reason: 警告音、画面の電話番号、遠隔操作ソフト、電子マネーでの支払いなど見抜くポイントが多く、IPA・警察・国民生活センターの注意喚起も多い
  flow: |
    1. パソコンでWebサイトを見ていると、突然「ウイルスに感染しています」などの警告画面が出て、警告音や音声が流れる
    2. あわてて画面をクリックすると全画面表示になり、閉じるボタンが見えなくなる。画面には「サポート窓口」として電話番号が出ている
    3. 電話をかけると、大手ソフトウェア会社のサポート担当などを名乗る相手が、遠隔操作ソフトを入れさせてパソコンを操作する
    4. 「ウイルスの除去」「サポート契約」「ソフトの購入」などの料金として、コンビニで電子マネー（プリペイド型）を買って支払うよう求める
  features:
  - Webサイトを見ている最中に、突然「ウイルスに感染」などの警告が出る
  - 警告音や音声で不安をあおる
  - 全画面表示で閉じるボタンが見えず、閉じられないように感じさせる
  - 大手ソフトウェア会社の名前をかたり、画面に電話番号を表示する
  red_flags:
  - 警告画面が電話をかけるよう求めている（IPAは、表示された電話番号に電話しないことが最も重要と案内している）
  - 電話の相手が遠隔操作ソフトのインストールを求める
  - 支払い方法がコンビニで買う電子マネー
  right_action: 表示された電話番号には電話しない。IPAの案内では、Escキーを2〜3秒長押しして全画面表示を解除し、右上に出た閉じるボタンでブラウザを閉じる。解除されないときは、警告画面の中をクリックしてからもう一度Escキーを長押しする。それでも消えなければパソコンを再起動する。電話してしまった・遠隔操作された場合は、IPAの情報セキュリティ安心相談窓口や消費者ホットライン188に相談する。閉じ方はIPAの体験サイト（パソコン用）で事前に練習できる。
  legit_contrast: 偽の警告はWebページの表示なので、ブラウザを閉じたり再起動したりすれば表示されなくなる（警察の案内）。国民生活センターは、警告画面や警告音が出ても偽物ではないかと疑い、慌てずにパソコンの状態を確かめ、自分で判断できなければ周りの人に相談するよう呼びかけている。
  trend: IPAへの「ウイルス検出の偽警告」の相談は、2025年1〜3月が1,084件（全相談の約34％で最多）、4〜6月が912件、7〜9月が647件と減った。IPAは、2025年5月末に警察が海外の捜査機関との共同捜査でサポート詐欺の被疑者を検挙したと発表した後に、相談が減ったと説明している。しかし2026年4〜6月は1,428件（前期比約23.7％増）と再び増え、手口別で最多になった（過去の月間最多は2023年10月の519件）。IPAの相談全体も2026年4〜6月は3,832件と増えている。
