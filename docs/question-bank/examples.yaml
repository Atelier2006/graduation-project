  - 「本物の警察がしないこと」を複数選ぶ問題（SNSで連絡する、ビデオ通話で取り調べる、逮捕状の画像を送る、送金を求める、はいずれも「しない」）
  - 行動問題：警察署の番号が表示された着信で「捜査の対象」と言われたとき、最善の行動を選ぶ
- id: EX-063
  kind: scam
  title: マッチングアプリで親しくなった相手が暗号資産の投資に誘うSNS型ロマンス詐欺
  situation: S10
  channels:
  - sns
  - chat
  tactics:
  - T12
  - T11
  - T05
  - T07
  targets:
  - 全世代
  level: hard
  level_reason: 時間をかけて信頼関係を作ってから投資の話になるため、相手を疑いにくい。会ったことのない相手からお金や投資の話が出た時点で立ち止まる判断が必要
  flow: |
    1. マッチングアプリやSNSで知り合った相手と、一度も会わないままメッセージのやり取りを続け、恋愛感情や親しみを持つようになる
    2. やり取りの場がメッセージアプリに移る
    3. 「2人の将来のために投資を」「一緒にお金を稼がないか」などと、暗号資産の購入や投資アプリでの運用を勧められる
    4. 最初は利益が出ているように見えるが、出金しようとするとさらに送金を求められ、何度も送金してしまう
  features:
  - 実際に会ったことがない
  - 結婚や将来の話をしながら、お金や投資の話をする
  - 暗号資産のアプリを入れさせ、指定したアドレスに送らせる
  - 翻訳アプリや生成AIで、文章や音声・動画を作っている可能性もある
  red_flags:
  - 会ったことのない相手からお金や投資の話が出る
  - 「誰でもできる」「必ずもうかる」と言われる
  - 送金先が個人名義の口座や、相手が指定する暗号資産のアドレス
  right_action: 会ったことのない相手からお金や投資の話が出たら、きっぱり断ってやり取りをやめる。送金はしない。おかしいと感じたら、家族や「#9110」、最寄りの警察署に相談する。
  legit_contrast: 暗号資産を扱う正規の業者は暗号資産交換業の登録を受けており、金融庁の「金融事業者検索」で確かめられる（登録があるだけで安全とは限らない）（金融庁）。
  trend: 2025年10月末時点の暫定値で、SNS型ロマンス詐欺は4,506件・被害額約426億円（前年同期比で件数+50.5%）と大きく増えた。山形県警などの注意喚起では、ロマンス詐欺の7割以上が投資名目とされる。2026年7月末の暫定値は3,037件・約293億円（前年同期比で件数+2.0%）。
