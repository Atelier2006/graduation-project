  - 行動問題：「いったん切って、自分で調べた警察署か#9110に確かめる」が最善。「相手の言う番号に折り返す」「指定口座に振り込む」は誤り
  - 難しい版：電話会社の自動音声→警察官役への転送→メッセージアプリへの誘導→ビデオ通話、と順に見せ、どの時点で気づけるかを問う
- id: EX-059
  kind: scam
  title: 警察の公式サイトに似せたページで「自分の名前入りの逮捕状」を見せる手口
  situation: S09
  channels:
  - chat
  - sns
  - web
  tactics:
  - T13
  - T04
  - T06
  - T07
  targets:
  - 全世代
  level: hard
  level_reason: 警察の公式サイトに似たページに本人の氏名入りの逮捕状が表示されるため、強い不安から信じ込みやすい。「警察はウェブサイトやSNSで逮捕状を示さない」と知っていることが必要
  flow: |
    1. 警察官を名乗る人物から、電話やSNSで「あなたは捜査の対象になっている」などと伝えられる
    2. 警察の公式サイトに見せかけたページを案内され、相手から伝えられた番号を入力するよう言われる
    3. 入力すると、本人の氏名などが書かれた逮捕状のような画面が表示される
    4. 「逮捕されないために」などと言われ、お金や個人情報を求められる
  features:
  - ページの見た目が実在の警察のサイトに似ている
  - 本物のサイトにはない「在宅捜査の申請」「氏名番号 検索」といった項目がある偽サイトが確認されている
  - 番号を入れると自分の名前入りの書類が出てくるので、本物だと思い込みやすい
  red_flags:
  - 警察がウェブサイトやSNSで逮捕状を見せてくる
  - 電話やSNSで案内されたページで、番号の入力を求められる
  - 「逮捕されないために」とお金や個人情報を求められる
  right_action: 案内されたページは開かず、番号も入力しない。やり取りをやめて、自分で調べた最寄りの警察署か「#9110」に相談する。家族や身近な人にも話す。
  legit_contrast: 警察が、ビデオ通話で取り調べをしたり、ウェブサイトやSNSで逮捕状を示したりすることはない。捜査のためにお金を送らせることもない（警察庁）。
  trend: 2026年9月、警視庁と2つの県警の公式サイトに似た偽サイトが確認され、警察庁が改めて注意を呼びかけた（共同通信の報道）。同じ報道によると、2026年1〜6月のニセ警察詐欺の被害額は約508億円（暫定値）で、前年同期より約109億円増えている。
  sources:
