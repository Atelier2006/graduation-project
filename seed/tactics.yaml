# 手口の分類（要件定義書 5.3節）
- code: T01
  name: なりすまし
  description: 企業・サービス・公的機関の名前をかたる
- code: T02
  name: そっくりドメイン
  description: つづり違い、紛らわしい文字（l と 1 など）、別の文字体系の文字を使う
- code: T03
  name: URLの見せかけ
  description: 短縮URL、正規の名前をサブドメインに入れる、表示と飛び先が違う
- code: T04
  name: 急がせる・不安をあおる
  description: 「アカウント停止」「本日中に」「逮捕状が出ている」などで考える時間を奪う
- code: T05
  name: 利益で釣る
  description: 当選、高額報酬、「必ずもうかる」
- code: T06
  name: 情報を入力させる
  description: ID・パスワード、カード番号、ワンタイムパスワードを入力させる
- code: T07
  name: お金を払わせる
  description: 電子マネーのカード番号を伝えさせる、暗号資産、個人名義の口座への振込
- code: T08
  name: 電話をかけさせる
  description: 偽の警告画面に出るサポートの番号、「至急連絡を」
- code: T09
  name: 不在通知
  description: 宅配業者をかたる再配達の案内
- code: T10
  name: 偽のセキュリティ警告
  description: 警告音・全画面表示で慌てさせるサポート詐欺
- code: T11
  name: 投資・副業の勧誘
  description: SNS広告、著名人の名前、投資グループへの招待、「スマホで簡単に稼げる」
- code: T12
  name: 親しくなってから
  description: 恋愛感情や信頼関係を作ってから、投資やお金の話をする
- code: T13
  name: 警察・公的機関をかたる
  description: ニセ警察詐欺、税金・公共料金の未納、還付金
- code: T14
  name: 闇バイトの勧誘
  description: 「高額・即日」「荷物を受け取るだけ」で犯罪の実行役を集める
- code: T15
  name: 偽の通販サイト
  description: 極端な値引き、不自然な日本語、個人名義の振込先
