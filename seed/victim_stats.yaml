# 実際の被害のデータ（公的機関の統計）。要件定義書の F-20 の初期データ。
# 値は出典のPDFのグラフに書かれた数値を読み取ったもの。2026-10-29 に出典のPDFを開いて確かめた。
# 内訳を足した値が、出典に書かれた合計と合うことを確かめた（当初接触ツール・交付形態など）。
# 区分名は出典のとおりに書く（問題の画面ではなく、出典を示した統計の引用のため）。
# グラフに数値が書かれていない区分（10代以下など）は入れない。計算で埋めない。

sources:
  - key: npa-2025-final
    publisher: 警察庁
    title: 令和７年における特殊詐欺及びＳＮＳ型投資・ロマンス詐欺の認知・検挙状況等について（確定値）
    url: https://www.npa.go.jp/bureau/criminal/souni/tokusyusagi/sagi_keihatsu2025.pdf
    checked: 2026-10-29

# scam_type：seed の詐欺の種類（scam_types）のコード
#   tokusyu：特殊詐欺（全体） / nise_keisatsu：ニセ警察詐欺 / sns_toushi：SNS型投資詐欺 / romance：SNS型ロマンス詐欺
# dimension：区分の軸（年代・当初接触ツール・当初接触手段・交付形態・既遂1件当たりの被害額）
