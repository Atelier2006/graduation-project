# 会話（電話・ビデオ通話・チャット）の問題：Q-CH-001〜Q-CH-014
# 書き方は docs/question-bank/writing-guide.md を参照。登場する会社・サービス・人物はすべて架空。
# 会話は「あなた」が最善の行動を取る前の場面で止めている。

- id: Q-CH-001
  title: 国際電話の番号からかかってきた「ニセ警察」のビデオ通話
  type: judge
  channel: chat
  is_scam: true
  level: hard
  situation: S09
  targets: [全世代]
  brand: soyokaze_police
  tactics: [T13, T04, T07]
  examples: [EX-058, EX-034]
  context: |
    平日の昼、スマホに知らない番号から電話がかかってきた。
  message:
    sender_name:
    sender: "+XX XXX-XXXX-0110"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: スマホに「+XX XXX-XXXX-0110」から着信。番号の最後が「0110」で、警察署の番号のようにも見える。
      - kind: say
        who: 相手
        name: そよかぜ警察署の刑事を名乗る人
        text: そよかぜ警察署 刑事課の佐藤です。詐欺グループの拠点から、あなた名義の口座のキャッシュカードが見つかりました。あなたにも、詐欺に関わった疑いがかかっています。
      - kind: say
        who: あなた
        text: えっ、そんな……。私は何もしていません。
      - kind: say
        who: 相手
        name: そよかぜ警察署の刑事を名乗る人
        text: 疑いを晴らすために、このあとビデオ通話で取り調べをします。トモトモで、今から言うIDを登録してください。捜査の秘密なので、ご家族にも話さないでください。
      - kind: event
        text: トモトモのビデオ通話に切り替わった。画面には、制服姿の人と警察手帳、あなたの名前が書かれた「逮捕状」のような書類が映っている。
      - kind: say
        who: 相手
        name: そよかぜ警察署の刑事を名乗る人
        text: あなたの預金が、犯罪で得たお金でないかを調べます。調べが終われば全額お返しします。今日の15時までに、今から言う口座に預金をすべて移してください。
  actions:
    - text: 本物の刑事か確かめるため、警察手帳の番号と名前を聞いて控える
    - text: 疑いを晴らすため、言われた口座に預金を移す
    - text: 着信のあった番号にかけ直して、本当に警察署か確かめる
    - text: "電話を切り、自分で調べた警察署の番号か#9110に相談する"
      best: true
  hints:
    - target: sender
      note: 「+」から始まる国際電話の番号。最後を「0110」にして、警察署からの電話のように見せることがある。
    - target: part:4
      note: 警察が、メッセージアプリのビデオ通話で取り調べをすることはない。「家族にも話さないで」と口止めするのも詐欺のサイン。
    - target: part:6
      note: 捜査を理由に、預金を指定の口座に移させようとしている。警察が電話でお金を求めることはない。
  explanation:
    why: |
      本物の警察は、メッセージアプリのビデオ通話で取り調べをしたり、逮捕状を見せたりしない。捜査や「預金を調べる」ことを理由に、お金を指定の口座に移させることもない。制服や警察手帳、逮捕状が画面に映っていても、画面越しでは本物か分からないので、見た目で判断しない。
    action: |
      すぐに電話を切り、お金は移さない。相手が教える番号ではなく、自分で調べた警察署の代表番号か、警察相談専用電話#9110にかけて確かめ、家族にも相談する。
  references:
    - title: "ニセ警察詐欺に注意！ #ニセ警察詐欺"
      url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/241218/02.html
    - title: "ビデオ通話を悪用した“偽警察官・検察官”の詐欺に注意！！"
      url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/250428/01.html

- id: Q-CH-002
  title: 「番号が変わった」息子を名乗る電話から始まるお金の相談
  type: judge
  channel: chat
  is_scam: true
  level: normal
  situation: S15
  targets: [高齢者]
  brand:
  tactics: [T04, T07]
  examples: [EX-079]
  context: |
    夫と2人で暮らしている。息子のタカシは遠くの町で会社勤めをしていて、ふだんはたまに電話で話すくらいだ。
  message:
    sender_name:
    sender: "090-XXXX-XXXX"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: 家の電話に、知らない携帯電話の番号（090-XXXX-XXXX）から着信があった。
      - kind: say
        who: 相手
        name: 息子を名乗る人
        text: もしもし、お母さん？おれだよ。スマホが壊れて、番号が変わったんだ。この番号を登録しておいて。ちょっと風邪をひいて、声が変だけど。
      - kind: say
        who: あなた
        text: あら、タカシ？風邪は大丈夫なの？
      - kind: event
        text: 次の日の朝、同じ番号からまた電話がかかってきた。
      - kind: say
        who: 相手
        name: 息子を名乗る人
        text: お母さん、ごめん……。会社の大事なお金が入ったかばんを、電車に置き忘れちゃったんだ。今日中に200万円用意しないと、会社をクビになるかもしれない。
      - kind: say
        who: 相手
        name: 息子を名乗る人
        text: おれは会社から出られないから、会社の後輩が家まで取りに行く。お父さんには、心配をかけたくないから言わないで。
  actions:
    - text: 息子が困っているので、すぐにお金を用意して後輩に渡す
    - text: 電話を切り、前から知っている息子の番号にかけて確かめる
      best: true
    - text: この電話の中で、本人しか知らないことを聞く
    - text: 100万円だけなら用意できると伝える
  hints:
    - target: part:2
      note: 知らない番号から「番号が変わった」と知らせ、声の違いを風邪のせいにしている。
    - target: part:5
      note: 番号が変わったという連絡のすぐあとに、「今日中に200万円」とお金の相談をしている。
    - target: part:6
      note: 本人ではなく、知らない人がお金を受け取りに来る。ほかの家族に相談させないようにしている。
  explanation:
    why: |
      「番号が変わった」と先に知らせてから、別の日にお金の相談をするのは、息子や孫を名乗るオレオレ詐欺の典型的な流れ。声の違いを風邪のせいにしたり、本人ではない人が現金を受け取りに来たりするのも特徴。「今日中に」と急がせ、家族に相談させないようにして、考える時間を奪おうとしている。
    action: |
      いったん電話を切り、前から知っている息子の番号にかけて確かめる（この電話の中で質問しても、ごまかされることがある）。家族にも相談し、知らない人に現金を渡さない。不安なときは警察相談専用電話#9110や近くの警察署に相談する。
  references:
    - title: 特殊詐欺の手口
      url: https://www.keishicho.metro.tokyo.lg.jp/kurashi/tokushu/furikome/furikome.html

- id: Q-CH-003
  title: 市役所を名乗り「医療費の還付金はATMで」と言う電話
  type: judge
  channel: chat
  is_scam: true
  level: easy
  situation: S08
  targets: [高齢者]
  brand: soyokaze_city
  tactics: [T13, T05, T04, T07]
  examples: [EX-049]
  context: |
    最近、病院に通うことが多い。平日の午前中、家の電話が鳴った。
  message:
    sender_name:
    sender: "0XX-XXX-XXXX"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: 家の電話に、そよかぜ市役所を名乗る人から電話がかかってきた。
      - kind: say
        who: 相手
        name: そよかぜ市役所 保険年金課を名乗る人
        text: そよかぜ市役所 保険年金課の田中と申します。医療費の払い戻し、還付金が3万2,000円ございます。以前お送りした書類のご返送がなかったので、お電話しました。
      - kind: say
        who: あなた
        text: 書類？見た覚えがないけれど……。
      - kind: say
        who: 相手
        name: そよかぜ市役所 保険年金課を名乗る人
        text: 受け取りの期限が今日までなんです。今日を過ぎると受け取れなくなります。今からキャッシュカードと携帯電話を持って、近くのATMに行ってください。着いたら、この番号にお電話を。操作のしかたをご案内します。
  actions:
    - text: 期限が今日までなので、すぐにATMへ行って電話をかける
    - text: ATMは不安なので、銀行の窓口で手続きできないか、この電話の相手に相談する
    - text: 電話を切ってATMには行かず、自分で調べた市役所の番号に問い合わせる
      best: true
    - text: 電話の相手に市役所の折り返しの番号を聞いて、かけ直す
  hints:
    - target: part:2
      note: 市役所を名乗り、「還付金がある」とお金が戻ってくる話から始めている。
    - target: part:4
      note: 「今日まで」と急がせ、キャッシュカードと携帯電話を持ってATMに行くよう指示している。ATMで還付金を受け取ることはできない。
  explanation:
    why: |
      そよかぜ市役所は、大事な手続きを郵送で知らせ、電話で還付金の手続きをATMでさせることはない。ATMでお金が戻ってくることはなく、電話の指示どおりに操作すると、自分の口座から相手の口座にお金を振り込んでしまう。「今日まで」と期限で急がせるのも、考える時間を奪うための言い方。
    action: |
      電話を切り、ATMには行かない。心当たりがあるときは、届いている書類や広報誌、市の公式サイトで自分で調べた番号に問い合わせる。不安なときは警察相談専用電話#9110に相談する。
  references:
    - title: 還付金詐欺
      url: https://www.npa.go.jp/bureau/safetylife/sos47/case/refund/

- id: Q-CH-004
  title: 警察の電話のあとに来た「銀行の職員」が、カードと暗証番号を封筒に入れさせる
  type: judge
  channel: chat
  is_scam: true
  level: hard
  situation: S03
  targets: [高齢者]
  brand: kotori
  tactics: [T13, T01, T04, T06]
  examples: [EX-015, EX-020]
  context: |
    コトリ銀行に口座を持っていて、キャッシュカードを使っている。ある日の午後、家の電話が鳴った。
  message:
    sender_name:
    sender: "0XX-XXX-0110"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: 家の電話に「0XX-XXX-0110」から着信。そよかぜ警察署を名乗る人だった。
      - kind: say
        who: 相手
        name: そよかぜ警察署 生活安全課を名乗る人
        text: そよかぜ警察署 生活安全課の者です。先ほど逮捕した詐欺グループが、あなたのお名前とコトリ銀行の口座が書かれた名簿を持っていました。あなたのキャッシュカードが、不正に使われているおそれがあります。
      - kind: say
        who: あなた
        text: まあ、どうしましょう。
      - kind: say
        who: 相手
        name: そよかぜ警察署 生活安全課を名乗る人
        text: 被害を防ぐため、カードを新しいものに交換する必要があります。このあと、コトリ銀行の職員がご自宅に伺いますので、カードを用意してお待ちください。
      - kind: event
        text: 1時間ほどして、スーツ姿の男性が「コトリ銀行の者です」と名乗って家に来た。
      - kind: say
        who: 相手
        name: コトリ銀行の職員を名乗る人
        text: お待たせしました。古いカードは、こちらの封筒に入れて封をしていただきます。新しいカードを作るのに必要ですので、暗証番号もこの紙に書いて、一緒に入れてください。封筒は、新しいカードが届くまで開けずにご自宅で保管してくださいね。
  actions:
    - text: 銀行の職員なので、カードと暗証番号を書いた紙を封筒に入れる
    - text: 暗証番号は書かずに、カードだけを封筒に入れて渡す
    - text: 職員の名刺をもらい、名刺の番号に電話して確かめてから封筒に入れる
    - text: "何も渡さずに帰ってもらい、自分から銀行や#9110に電話する"
      best: true
  hints:
    - target: part:6
      note: 銀行の職員が、暗証番号を紙に書かせたり、キャッシュカードを封筒に入れさせたりすることはない。
    - target: part:4
      note: 警察を名乗る電話が、銀行の職員が家に来てカードを交換すると言っている。警察官や銀行の職員が、家に来てキャッシュカードを預かることはない。
    - target: sender
      note: 警察署の番号のように見えても、本物とは限らない。番号の表示だけで信用しない。
  explanation:
    why: |
      警察官や銀行の職員が、家でキャッシュカードを預かったり、暗証番号を聞いたり紙に書かせたりすることはない。お金を求めないので気づきにくいが、カードと暗証番号がそろえば、預金を引き出されてしまう。「封筒は開けずに保管して」と言うのも、カードを持ち去られたことに気づかせないための決まった言い方。
    action: |
      カードを渡さず、暗証番号も書かない。いったん帰ってもらい、通帳に書かれたコトリ銀行の番号か警察相談専用電話#9110に、自分から電話して相談する。
  references:
    - title: キャッシュカード詐欺盗(すり替え型)の手口
      url: https://www.pref.saitama.lg.jp/a0311/hurikomesagi/cashcardsagi-teguchi.html
    - title: 特殊詐欺の手口
      url: https://www.keishicho.metro.tokyo.lg.jp/kurashi/tokushu/furikome/furikome.html

- id: Q-CH-005
  title: 偽の警告画面の番号に電話したら「遠隔操作のソフトと電子マネーの修理代」
  type: judge
  channel: chat
  is_scam: true
  level: easy
  situation: S11
  targets: [高齢者, 全世代]
  brand: mihariban
  tactics: [T01, T04, T07, T08, T10]
  examples: [EX-064, EX-065]
  context: |
    パソコンにはミハリ番セキュリティを入れている。ニュースのサイトを見ていたら、急に大きな警告音が鳴り、画面いっぱいに「ウイルスに感染しました。ミハリ番セキュリティ サポートセンターにお電話ください 050-XXXX-XXXX」と表示された。あわてて、その番号に電話をかけた。
  message:
    sender_name:
    sender: "050-XXXX-XXXX"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: 警告画面に出ていた「050-XXXX-XXXX」に電話をかけると、すぐにつながった。
      - kind: say
        who: 相手
        name: ミハリ番セキュリティのサポートを名乗る人
        text: お電話ありがとうございます。ミハリ番セキュリティ サポートセンターです。お客様のパソコンは、ウイルスによって個人情報が抜き取られている状態です。すぐに修理が必要です。
      - kind: say
        who: 相手
        name: ミハリ番セキュリティのサポートを名乗る人
        text: これから遠隔操作のソフトを入れていただき、こちらでパソコンを直します。画面の案内どおりに操作してください。
      - kind: say
        who: あなた
        text: 修理には、お金がかかるんですか？
      - kind: say
        who: 相手
        name: ミハリ番セキュリティのサポートを名乗る人
        text: 修理代は5万円です。近くのコンビニで電子マネーのカードを5万円分買って、カードの裏の番号を読み上げてください。急がないと、銀行の情報まで抜き取られてしまいます。
  actions:
    - text: 電話を切り、ソフトは入れず、お金も払わない
      best: true
    - text: 言われたとおり遠隔操作のソフトを入れて、パソコンを直してもらう
    - text: ソフトは入れずに、修理代の電子マネーだけ買って番号を伝える
    - text: 本物か確かめるため、相手の名前と社員番号を聞いてから話を続ける
  hints:
    - target: sender
      note: 警告画面に出ていた電話番号。ミハリ番セキュリティは、警告画面にサポートの電話番号を出さない。
    - target: part:3
      note: 遠隔操作のソフトを入れさせようとしている。入れると、相手にパソコンを自由に操作されてしまう。
    - target: part:5
      note: 修理代をコンビニの電子マネーで払わせようとし、「急がないと」と不安をあおっている。
  explanation:
    why: |
      ミハリ番セキュリティの警告は、インストールしたソフトの画面に出て、警告画面にサポートの電話番号を出すことはない。Webサイトを見ている途中に出た警告は偽物で、電話の相手は遠隔操作のソフトを入れさせ、コンビニの電子マネーで代金を払わせようとしている。電子マネーの番号を伝えると、お金はすぐに使われてしまい、取り戻すのは難しい。
    action: |
      すぐに電話を切り、ソフトは入れず、お金も払わない。偽の警告画面は、ブラウザを閉じるか、パソコンを再起動すれば消える。遠隔操作のソフトを入れてしまったときなどは、IPAの情報セキュリティ安心相談窓口や消費者ホットライン188に相談する。
  references:
    - title: 偽セキュリティ警告（サポート詐欺）対策特集ページ
      url: https://www.ipa.go.jp/security/anshin/measures/fakealert.html

- id: Q-CH-006
  title: 投資グループで、少額の出金のあとに個人名義の口座への追加入金をすすめられる
  type: judge
  channel: chat
  is_scam: true
  level: hard
  situation: S04
  targets: [社会人, 高齢者]
  brand:
  tactics: [T01, T04, T05, T07, T11]
  examples: [EX-022, EX-027]
  context: |
    1か月前、SNSの広告で見た「有名投資家を名乗る人物が無料で教える投資の勉強会」に申し込み、トモトモのグループに招待された。講師のアシスタントにすすめられた投資アプリに50万円を入れると、残高は82万円に増えたと表示されている。先週、試しに2万円を出金したら、本当に自分の銀行口座に振り込まれた。
  message:
    sender_name: 投資の勉強会グループ（186人）
    sender:
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: say
        who: 相手
        name: メンバー ひろし
        text: 先生のおかげで、今月もプラス48万円でした！本当に感謝しかありません。
      - kind: say
        who: 相手
        name: メンバー さくら
        text: 私も昨日、利益を出金できました。家族旅行に使います！
      - kind: say
        who: 相手
        name: 講師のアシスタント ミナミ
        text: みなさま、おめでとうございます。来週、先生が特別な銘柄を発表します。参加できるのは、運用額が100万円以上の方だけです。
      - kind: event
        text: アシスタントのミナミから、あなたに個別のメッセージが届いた。
      - kind: say
        who: 相手
        name: 講師のアシスタント ミナミ
        text: 先日の出金も、問題なくできましたね。今が大きなチャンスです。特別枠は残り3名なので、本日中に100万円の追加入金をお願いします。振込先：XX銀行 そよかぜ支店 普通 XXXXXXX 名義 オオタ ユウジ
  actions:
    - text: 出金できた実績があるので、言われた口座に100万円を振り込む
    - text: 100万円は多いので、まず10万円だけ入金して様子を見る
    - text: "これ以上は入金せず、警察相談専用電話#9110に相談する"
      best: true
    - text: 会社名義の口座はないのか、アシスタントに聞いてから決める
  hints:
    - target: part:5
      note: 入金先が個人名義の口座で、「本日中」「残り3名」と急がせている。本物の証券会社が、個人名義の口座に入金させることはない。
    - target: part:1
      note: グループに次々と流れる成功報告は、信用させるためのサクラ（だます側の仲間）であることが多い。
    - target: part:3
      note: 「特別な銘柄」「100万円以上の方だけ」と、もっと入金させるための理由を作っている。
  explanation:
    why: |
      本物の証券会社が、入金先として個人名義の口座を指定することはない。広告から投資グループに誘い、成功報告を見せたり少額の出金に応じたりして信用させてから、大きな入金を求めるのは、SNS型投資詐欺の典型的な流れ。有名な投資家が無料で教えるという広告も、名前を勝手に使った偽物のことが多く、アプリに表示される利益も作られた数字のことがある。
    action: |
      これ以上入金しない。すでに払ったお金については、すぐに警察相談専用電話#9110や近くの警察署、振込先の銀行に相談する。
  references:
    - title: ＳＮＳ・マッチングアプリ等で知り合った者や著名人を騙る者からの投資勧誘等にご注意ください！
      url: https://www.fsa.go.jp/ordinary/chuui/sns.html
    - title: それ詐欺です！SNS上の投資勧誘にご注意ください！
      url: https://www.fsa.go.jp/receipt/toushisagi_koukoku/shuhou.html

- id: Q-CH-007
  title: マッチングアプリの相手が教えた投資サイトの「出金には認証金」
  type: judge
  channel: chat
  is_scam: true
  level: normal
  situation: S10
  targets: [社会人]
  brand: deaeru
  tactics: [T12, T11, T04, T07]
  examples: [EX-063, EX-023]
  context: |
    マッチングアプリのデアエルで知り合ったハルカに誘われて、やり取りをトモトモに移した。まだ一度も会ったことはない。ハルカに教わった暗号資産の投資サイトに30万円を入れると、2週間で残高が80万円に増えたと表示された。
  message:
    sender_name: ハルカ
    sender:
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: 出金しようとすると、投資サイトに「出金するには、利益の20%（10万円）を認証金として先にお支払いください」と表示された。
      - kind: say
        who: あなた
        text: ハルカ、出金しようとしたら、認証金を先に払ってって出たんだけど……。
      - kind: say
        who: 相手
        name: ハルカ
        text: あ、それね。私のときもあったよ。不正な出金を防ぐための決まりなんだって。払えば、すぐに全額出金できるから大丈夫。
      - kind: say
        who: 相手
        name: ハルカ
        text: それに、今出金しちゃうのはもったいないよ。来月はもっと上がるって、親せきも言ってたし。2人の将来のために、一緒にがんばろう？
      - kind: say
        who: 相手
        name: ハルカ
        text: 認証金は、サイトが指定する口座に今日中に振り込んでね。期限を過ぎると、口座が凍結されちゃうみたい。
  actions:
    - text: 認証金を払えば全額出金できるので、10万円を振り込む
    - text: "これ以上払わず、やり取りをやめて#9110などに相談する"
      best: true
    - text: 認証金を利益から引いてもらえないか、サイトに聞く
    - text: 出金はやめて、ハルカの言うとおり来月まで様子を見る
  hints:
    - target: part:1
      note: 出金するために、先に「認証金」を払うよう求めている。出金のために先にお金を払わせるのは、偽の投資サイトの典型的なサイン。
    - target: part:4
      note: 一度も会ったことのない相手が、「2人の将来」と恋愛の気持ちに訴えながら、お金の話を進めている。
    - target: part:5
      note: 「今日中」「凍結される」と急がせている。
  explanation:
    why: |
      出金するために「認証金」「税金」などを先に払わせるのは、偽の投資サイトの典型的な手口で、払っても出金できず、次々に別の支払いを求められる。一度も会ったことのない相手がアプリの外に誘い、親しくなってから投資をすすめるのも、SNS型ロマンス詐欺と同じ流れ。画面に出ている利益は、作られた数字の可能性が高い。
    action: |
      これ以上お金を払わず、やり取りをやめる。すでに入れたお金については、すぐに警察相談専用電話#9110や近くの警察署、振込先の銀行に相談する。
  references:
    - title: 見守り新鮮情報 第530号（SNSで勧誘される暗号資産の詐欺的な投資話）
      url: https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen530.html
    - title: それ詐欺です！SNS上の投資勧誘にご注意ください！
      url: https://www.fsa.go.jp/receipt/toushisagi_koukoku/shuhou.html

- id: Q-CH-008
  title: フリマアプリの外での直接取引に誘う購入希望者
  type: judge
  channel: chat
  is_scam: true
  level: easy
  situation: S14
  targets: [全世代]
  brand: furimarche
  tactics: [T04, T05]
  examples: [EX-078]
  context: |
    フリマルシェに、使わなくなったデジタルカメラを3万円で出品した。商品ページのコメント欄に、次のメッセージが届いた。
  message:
    sender_name: まさ
    sender:
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: say
        who: 相手
        name: まさ（購入希望者）
        text: はじめまして。このカメラ、ぜひ買いたいです！
      - kind: say
        who: 相手
        name: まさ（購入希望者）
        text: ただ、フリマルシェだと手数料がもったいないので、アプリの外で直接振り込みます。そのぶん、3万5,000円で買いますよ。
      - kind: say
        who: 相手
        name: まさ（購入希望者）
        text: トモトモのIDは「masa_camera」です。今日中に連絡をもらえたら、すぐに振り込みます。振り込んだら画面の写真を送るので、確認したらすぐに発送してください。
  actions:
    - text: 高く買ってもらえるので、トモトモで連絡して直接取引する
    - text: 振込の画面の写真が届いたら、すぐに商品を発送する
    - text: アプリの外での取引は断り、フリマルシェで購入してもらうよう返す
      best: true
    - text: 先に半額だけ振り込んでもらい、残りは商品が届いてから払ってもらう
  hints:
    - target: part:2
      note: アプリの外で直接振り込むと言っている。フリマルシェは、アプリの外での支払いを受け付けていない。
    - target: part:3
      note: やり取りをトモトモに移そうとし、「今日中」と急がせている。振込の画面の写真は、作られた偽物のこともある。
  explanation:
    why: |
      フリマルシェは、取引と支払いをアプリの中で完結させていて、アプリの外での支払いは受け付けない。アプリの外で取引すると、運営が代金をいったん預かる仕組みが使えず、商品を送っても代金が払われる保証がない。「高く買う」「今日中に」と得や急ぎを強調するのも、アプリの外へ誘うときの特徴。
    action: |
      アプリの外での取引には応じず、やり取りも支払いもフリマルシェのアプリの中だけで行う。困ったときはフリマルシェに相談し、それでも解決しなければ消費者ホットライン188に相談する。
  references:
    - title: （フリマアプリで架空取引を持ちかけられるトラブルに関する注意喚起）
      url: https://www.kokusen.go.jp/news/data/n-20211118_1.html
    - title: （フリマアプリ・個人間取引の相談事例）
      url: https://www.pref.saitama.lg.jp/b0304/shohisoudan/jirei/tsuhan/20170825.html

- id: Q-CH-009
  title: 盗難届を出した自転車が見つかったという警察署からの電話
  type: judge
  channel: chat
  is_scam: false
  level: normal
  situation: S09
  targets: [全世代]
  brand: soyokaze_police
  tactics: []
  examples: [EX-062]
  context: |
    先週、駅の駐輪場で自転車を盗まれ、そよかぜ警察署に盗難届を出した。届けには、自分の携帯電話の番号を書いた。
  message:
    sender_name:
    sender: "0XX-XXX-0110"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: スマホに「0XX-XXX-0110」から着信があった。
      - kind: say
        who: 相手
        name: そよかぜ警察署 生活安全課を名乗る人
        text: そよかぜ警察署 生活安全課の山下と申します。先週、自転車の盗難届を出された方のお電話でよろしいでしょうか。
      - kind: say
        who: あなた
        text: はい、そうです。
      - kind: say
        who: 相手
        name: そよかぜ警察署 生活安全課を名乗る人
        text: 届け出のあった青い自転車が、駅の近くで見つかりました。お受け取りの手続きをしますので、平日の9時から17時の間に、身分証と自転車の鍵を持って、署の1階の窓口までお越しください。費用はかかりません。
      - kind: say
        who: 相手
        name: そよかぜ警察署 生活安全課を名乗る人
        text: ご心配でしたら、一度切っていただいて、署の代表番号にかけ直し、生活安全課の山下を呼び出してください。
  actions:
    - text: 署の代表番号を自分で調べてかけ直し、確かめてから署に行く
      best: true
    - text: 警察を名乗る電話は詐欺が多いので、何もせずに放っておく
    - text: 念のため、この電話の相手に本人確認のための免許証の番号を伝えておく
    - text: 折り返し用に山下さんの携帯電話の番号を聞いて、そちらにかける
  hints:
    - target: part:2
      note: 自分が先週出した盗難届の話で、警察署から連絡が来る心当たりがある。
    - target: part:4
      note: お金や口座、暗証番号の話がなく、身分証を持って警察署の窓口に来るよう案内している。
    - target: part:5
      note: 相手が教える番号ではなく、自分で調べられる署の代表番号にかけ直して確かめるよう、すすめている。
  explanation:
    why: |
      先週、自分で盗難届を出しているので、警察署から連絡が来る心当たりがある。電話の内容は、身分証を持って警察署の窓口に来るよう案内するだけで、お金や口座の話、メッセージアプリやビデオ通話への誘導がない。本物の警察がしないこと（電話でお金を求める、SNSやビデオ通話で取り調べをする）が一つも出てこない。
    action: |
      念のため、いったん切って、自分で調べたそよかぜ警察署の代表番号にかけ直し、担当者と用件を確かめてから署に行く。
  references:
    - title: 警察官等をかたる詐欺
      url: https://www.keishicho.metro.tokyo.lg.jp/kurashi/tokushu/police_officer.html
    - title: 警察に偽装した電話番号に注意！
      url: https://www.npa.go.jp/bureau/safetylife/sos47/new-topics/250325/01.html

- id: Q-CH-010
  title: アプリの通知を見て、カード裏面の番号にかけた不正利用の確認
  type: judge
  channel: chat
  is_scam: false
  level: normal
  situation: S03
  targets: [全世代]
  brand: hoshizora
  tactics: []
  examples: [EX-020, EX-012]
  context: |
    ホシゾラカードの公式アプリに「カードの不正利用の疑いがあります。カード裏面の電話番号にお電話ください」という通知が届いた。カードの裏に書かれた番号に、自分から電話をかけた。
  message:
    sender_name: ホシゾラカード カード裏面の番号
    sender: "0120-XXX-XXX"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: カードの裏に書かれた「0120-XXX-XXX」に自分から電話をかけ、音声の案内のあと、担当者につながった。
      - kind: say
        who: 相手
        name: ホシゾラカード 不正利用調査の担当者
        text: お電話ありがとうございます。ホシゾラカード 不正利用調査デスクの木村です。最近のご利用について、確認させてください。
      - kind: say
        who: 相手
        name: ホシゾラカード 不正利用調査の担当者
        text: 10月14日に、海外のネットショップで3万2,800円のご利用がありますが、お客様ご本人のご利用でしょうか。
      - kind: say
        who: あなた
        text: いいえ、使った覚えはありません。
      - kind: say
        who: 相手
        name: ホシゾラカード 不正利用調査の担当者
        text: 承知しました。不正利用のおそれがありますので、このカードはただいまご利用を止め、新しいカードをご登録の住所にお送りします。なお、当社から暗証番号やセキュリティコードをお聞きすることはありません。
  actions:
    - text: 本人だと分かってもらうため、カードのセキュリティコードを伝える
    - text: 本当にカード会社か心配なので、電話を切って何もしないでおく
    - text: 案内どおりカードを止めてもらい、あとで公式アプリで明細も見る
      best: true
    - text: 電話を切り、ネットで見つけた「カードの不正利用 相談窓口」に電話し直す
  hints:
    - target: part:1
      note: 公式アプリの通知を見て、カードの裏に書かれた番号に自分から電話している。ホシゾラカードの正規の案内のしかたと同じ。
    - target: part:5
      note: 暗証番号やセキュリティコードを聞かず、カードを止める手続きを案内している。
  explanation:
    why: |
      ホシゾラカードは、不正利用の疑いがあるとき、公式アプリで知らせ、カード裏面の番号に電話するよう案内している。今回は、その案内どおりに自分からカード裏面の番号にかけているので、電話の相手は本物のカード会社。担当者は利用の確認をするだけで、暗証番号やセキュリティコードを聞いていない。
    action: |
      担当者の案内に従って、カードを止めてもらう。あとで公式アプリで利用明細を確かめ、ほかに身に覚えのない利用がないか見ておく。
  references:
    - title: 銀行協会職員などを名乗る詐欺への注意のページ（題名未確認）
      url: https://www.zenginkyo.or.jp/topic/detail/nid/9013/

- id: Q-CH-011
  title: 郵送した還付の書類の返送をうながす市役所からの電話
  type: judge
  channel: chat
  is_scam: false
  level: easy
  situation: S08
  targets: [高齢者]
  brand: soyokaze_city
  tactics: []
  examples: [EX-053, EX-049]
  context: |
    先週、そよかぜ市役所から「国民健康保険料の還付のお知らせ」という封筒が届いていた。まだ中身をよく見ていない。
  message:
    sender_name:
    sender: "0XX-XXX-XXXX"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: 家の電話に、そよかぜ市役所を名乗る人から電話がかかってきた。
      - kind: say
        who: 相手
        name: そよかぜ市役所 保険年金課を名乗る人
        text: そよかぜ市役所 保険年金課の小林と申します。先週、国民健康保険料の払い戻し（還付）のご案内を、ご自宅に郵送しました。
      - kind: say
        who: 相手
        name: そよかぜ市役所 保険年金課を名乗る人
        text: 同封の「還付請求書」に、振込先の口座の名前と番号を書いて、返信用の封筒でお送りください。期限は11月30日です。
      - kind: say
        who: 相手
        name: そよかぜ市役所 保険年金課を名乗る人
        text: 電話で口座の暗証番号をお聞きしたり、ATMで手続きをしていただいたりすることはありません。ご不明な点は、市役所の代表番号から保険年金課にお問い合わせください。
  actions:
    - text: 早く済ませたいので、この電話で口座の番号と暗証番号を伝えてしまう
    - text: 届いた書類を確かめて返送し、不安なら自分で調べた市役所の番号に聞く
      best: true
    - text: 還付金の電話は詐欺が多いので、届いた書類もまとめて捨てる
    - text: 書類を探すのは面倒なので、近くのATMで手続きできないか、この電話で聞く
  hints:
    - target: part:2
      note: 大事な手続きを郵送の書類で案内していて、先週届いた封筒とも話が合う。そよかぜ市役所の正規の連絡方法と同じ。
    - target: part:3
      note: 書類に書いて郵便で返す手続きで、期限も先。急がせていない。
    - target: part:4
      note: ATMでの手続きや暗証番号を求めず、市役所の代表番号への問い合わせをすすめている。
  explanation:
    why: |
      そよかぜ市役所は、大事な手続きを郵送で知らせ、電話で還付金の手続きをATMでさせることはない。この電話は、先週届いた書類に記入して返送するよう案内しているだけで、ATMや暗証番号の話がなく、期限も先で急がせていない。
    action: |
      届いた書類を確かめて、記入して返送する。電話が本物か不安なときは、広報誌や市の公式サイトで自分で調べた市役所の番号に問い合わせる。
  references:
    - title: 還付金詐欺
      url: https://www.npa.go.jp/bureau/safetylife/sos47/case/refund/

- id: Q-CH-012
  title: 就活サイトのメッセージで届いた一次面接の案内
  type: judge
  channel: chat
  is_scam: false
  level: normal
  situation: S07
  targets: [学生]
  brand: jobnohako
  tactics: []
  examples: [EX-045]
  context: |
    就活サイトのジョブノハコから、そよかぜ食品株式会社の新卒採用にエントリーした。数日後、登録したメールアドレスに「ジョブノハコに新しいメッセージが届きました」というお知らせが来たので、ブックマークからジョブノハコを開いて、メッセージを読んだ。
  message:
    sender_name: そよかぜ食品株式会社 人事部 採用担当
    sender:
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: ジョブノハコのマイページの「メッセージ」に、エントリーした企業から新しいメッセージが届いていた。
      - kind: say
