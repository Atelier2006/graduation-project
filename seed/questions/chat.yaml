        name: そよかぜ食品 採用担当
        text: このたびは、そよかぜ食品の新卒採用にエントリーいただき、ありがとうございます。人事部 採用担当の中村です。
      - kind: say
        who: 相手
        name: そよかぜ食品 採用担当
        text: 書類選考の結果、一次面接にお進みいただくことになりました。日時は11月6日（金）14時から、場所はそよかぜ市の本社3階です。持ち物は筆記用具です。
      - kind: say
        who: 相手
        name: そよかぜ食品 採用担当
        text: ご都合のよしあしは、このメッセージへの返信でお知らせください。なお、選考に費用は一切かかりません。
  actions:
    - text: ジョブノハコのメッセージ画面で返信し、面接の日程に出られるか伝える
      best: true
    - text: 担当者の個人のトモトモを聞いて、そちらでやり取りする
    - text: 面接の前に、身分証の画像と口座の番号をメッセージで送っておく
    - text: 採用の連絡は詐欺かもしれないので、返信しないで放っておく
  hints:
    - target: part:1
      note: ジョブノハコのマイページの中のメッセージで届いている。企業からの連絡はサイトの中のメッセージで届くという、ジョブノハコの決まりと同じ。
    - target: part:3
      note: 面接の日時・場所・持ち物がはっきりしている。
    - target: part:4
      note: 選考に費用がかからないと書いてあり、お金や個人情報を求めていない。
  explanation:
    why: |
      ジョブノハコでは、企業からの連絡はサイトの中のメッセージで届き、届いたことが登録したメールアドレスに知らされる。今回は、そのお知らせを見て自分でジョブノハコを開き、エントリーした企業からのメッセージを読んでいる。面接の日時・場所・持ち物がはっきりしていて、お金や身分証の画像を求めていないことも、本物と言える理由。
    action: |
      ジョブノハコのメッセージ画面から返信して、面接の日程を伝える。選考の途中でお金や身分証の画像を求められたら応じず、ジョブノハコや学校の就職の窓口に相談する。
  references:
    - title: 採用企業や採用担当者からの不審な連絡を見極める方法についてのヘルプ記事（題名未確認）
      url: https://jp.indeed.com/help/job-seekers/articles/360040122511

- id: Q-CH-013
  title: 闇バイトに応募したあと、消えるアプリと身分証・家族の情報を求められる
  type: judge
  channel: chat
  is_scam: true
  level: normal
  situation: S07
  targets: [学生]
  brand:
  tactics: [T14, T06]
  examples: [EX-040]
  context: |
    ハナシバで見つけた「荷物を受け取って届けるだけで日給5万円〜・即日即金」という募集に、興味があってDMで応募した。すぐに返事が来た。
  message:
    sender_name: 即日ワーク 採用担当
    sender: "@sokujitsu_work_staff"
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: say
        who: 相手
        name: 即日ワーク 採用担当
        text: 応募ありがとうございます！ここからは、メッセージが自動で消える別のアプリで連絡します。アプリを入れたら、このIDを登録してください。
      - kind: say
        who: あなた
        text: わかりました。仕事はどんな内容ですか？
      - kind: say
        who: 相手
        name: 即日ワーク 採用担当
        text: 指定の家で荷物を受け取って、別の人に渡すだけの簡単な仕事です。くわしい場所は、仕事の前日にお伝えします。
      - kind: say
        who: 相手
        name: 即日ワーク 採用担当
        text: 登録のために、運転免許証の表と裏の写真、顔写真、それと実家の住所と家族の名前を送ってください。報酬を確実にお渡しするための確認です。
  actions:
    - text: 報酬を受け取るのに必要なので、免許証の写真と家族の住所を送る
    - text: 家族のことは送らず、免許証の写真だけ送って様子を見る
    - text: 仕事の内容をもっとくわしく聞いて、怪しくなければ続ける
    - text: "何も送らずにやり取りをやめて、#9110や警察署に相談する"
      best: true
  hints:
    - target: part:1
      note: メッセージが自動で消えるアプリに移るよう指示している。やり取りの証拠を残さないためで、闇バイトの典型的なサイン。
    - target: part:3
      note: 「受け取って渡すだけ」と仕事の中身があいまいで、場所も前日まで教えない。
    - target: part:4
      note: 応募の段階で、身分証や顔写真、家族の住所や名前まで送らせようとしている。
  explanation:
    why: |
      メッセージが消えるアプリへの移動、応募の段階での身分証や家族の情報の要求、「受け取って渡すだけ」というあいまいな仕事は、どれも闇バイト（犯罪の実行役の募集）の典型的な特徴。送った個人情報をもとに「家族に危害を加える」などと脅され、抜けられなくなる例が、警察から報告されている。
    action: |
      何も送らずにやり取りをやめる。もし送ってしまった、脅されているというときも、犯罪に加わる前に#9110や近くの警察署に相談する。警察は、相談した人と家族を守ると明言している。
  references:
    - title: いわゆる「闇バイト」の危険性について
      url: https://www.npa.go.jp/bureau/safetylife/yamibaito/hanzaishaboshu.html
    - title: 闇バイト対策
      url: https://www.gov-online.go.jp/article/202506/tv-5926.html

- id: Q-CH-014
  title: サークルの先輩からのもうけ話の勧誘
  type: judge
  channel: chat
  is_scam: true
  level: normal
  situation: S04
  targets: [学生]
  tactics: [T12, T05, T11, T04]
  examples: [EX-024]
  context: |
    大学のサークルで何度も一緒に活動しているアオイ先輩から、メッセージアプリ「トモトモ」で連絡が来た。
  message:
    sender_name: アオイ先輩
    sender:
    subject:
    body:
    link:
    page_url:
    parts:
      - kind: event
        text: トモトモで、サークルのアオイ先輩からメッセージが届いた。
      - kind: say
        who: 相手
        name: アオイ先輩
        text: 久しぶり！急にごめんね。すごい人を紹介したいんだけど、今週末あいてる？
      - kind: say
        who: あなた
        text: あいてますけど、どんな人ですか？
      - kind: say
        who: 相手
        name: アオイ先輩
        text: 20代で、投資だけで生活してる人。その人が開いてる投資の勉強会に、私も入ってるの。入会金は30万円だけど、毎月の配当ですぐに取り戻せるよ。
      - kind: say
        who: あなた
        text: 30万円なんて、とても払えないです……
      - kind: say
        who: 相手
        name: アオイ先輩
        text: 大丈夫、学生でも借りられるところがあるから、借りてもすぐ返せるよ。それに、友だちを1人紹介するごとに5万円の紹介料が入るから、何人か誘えば実質タダだよ。
      - kind: say
        who: 相手
        name: アオイ先輩
        text: 枠が少ないから、今週中に決めてね。信頼してる後輩にしか声をかけてないんだ。
  actions:
    - text: 先輩の紹介だから信用できると考え、借りてでも入会する
    - text: 入会しないとはっきり断り、困ったら消費者ホットライン188へ
      best: true
    - text: 「考えておきます」と返して、そのあいだに誘えそうな友だちを探す
    - text: 勉強会に一度だけ行ってみて、すごい人の話を聞いてから決める
  hints:
    - target: part:6
      note: 友だちを紹介すると紹介料が入る仕組み（マルチ取引）で、借金をしてでも払うようにすすめている。
    - target: part:4
      note: 「毎月の配当ですぐに取り戻せる」と、必ずもうかるような言い方をしている。
    - target: part:7
      note: 「今週中に」と急がせ、「信頼してる後輩にしか」と特別扱いして、断りにくくしている。
  explanation:
    why: |
      人を紹介すると報酬が出る仕組み（マルチ取引）を使った、形のない「もうけ話」への勧誘。「借りてもすぐ返せる」と借金をすすめる、「紹介料で実質タダ」ともうけを強調する、「今週中に」と急がせる、というはっきりしたサインがある。誘ってくる先輩自身も、もうかると信じ込んでいることがあり、身近な人からの誘いほど断りにくい。借金をしてまで、必ずもうかる話はない。
    action: |
      その場で決めず、入会する気がなければはっきり断る。借金をしてまで契約しない。困ったときや契約してしまったときは、消費者ホットライン188に相談する（条件によっては、クーリング・オフ＝決められた期間内なら契約をやめられる制度が使える）。
  references:
    - title: "新生活での友人・先輩・SNSからの投資やもうけ話の勧誘に関する注意喚起（題名未確認）"
      url: "https://www.pref.tottori.lg.jp/secure/922405/support206.pdf"
    - title: "若者に広がる「モノなしマルチ商法」の注意喚起（題名未確認）"
      url: "https://www.kokusen.go.jp/news/data/n-20190725_1.html"
