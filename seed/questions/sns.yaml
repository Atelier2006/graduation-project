# SNS（ダイレクトメッセージ・投稿）の問題：Q-SN-001〜Q-SN-014
# 書き方は docs/question-bank/writing-guide.md を参照。登場する会社・サービス・アカウントはすべて架空。

- id: Q-SN-001
  title: 「荷物を受け取るだけで日給5万円」という闇バイトの募集投稿
  type: judge
  channel: sns
  is_scam: true
  level: easy
  situation: S07
  targets: [学生]
  brand: hanashiba
  tactics: [T14, T05, T06]
  examples: [EX-040]
  context: |
    アルバイトを探していて、ハナシバで「#バイト募集」を検索していたら、次の投稿が表示された。
  message:
    sender_name: 即日バイト募集中
    sender: "@sokujitsu_work77"
    subject:
    body: |
      【急募】#即日即金 #ホワイト案件 #高収入
      荷物を受け取って、指定の場所に届けるだけ！
      日給5万円〜、その日のうちに現金で手渡し。
      経験・スキル不要／学生歓迎／1日だけでもOK
      くわしくはDMへ。応募は身分証の写真を送るだけで完了します。
    link:
    page_url:
    parts:
      - kind: profile
        text: 認証バッジなし・今月作られたアカウント・フォロワー8人・投稿は同じ募集だけ
  actions:
    - text: DMを送って、どんな荷物を運ぶのかをくわしく聞いてから決める
    - text: 1日だけなら大丈夫だと考えて、身分証の写真を送って応募する
    - text: 応募もDMもせず、アカウントをブロックしてハナシバに通報する
      best: true
    - text: 投稿への返信を見て、ほかの人の評判がよければ応募する
  hints:
    - target: body
      note: 「日給5万円」「即日即金」「ホワイト案件」と、報酬の高さと早さばかりを強調し、仕事の中身は「荷物を受け取って届けるだけ」とあいまい。応募の時点で身分証の写真を送らせようとしている。
    - target: part:1
      note: 今月作られたばかりで、フォロワーが8人しかなく、同じ募集の投稿しかないアカウント。会社の名前や連絡先も分からない。
  explanation:
    why: |
      仕事の中身があいまいなのに報酬だけが高く、「即日即金」「ホワイト案件」とうたうのは、犯罪の実行役を集める闇バイトの募集の典型的な特徴。「荷物を受け取るだけ」の仕事は、詐欺でだまし取ったお金や品物を受け取る役（受け子）などの犯罪であることがある。応募の段階で身分証を送らせ、あとでそれをもとに脅して抜けられなくする例について、警察庁が注意を呼びかけている。
    action: |
      応募しない。身分証や顔写真は送らない。もし応募してしまった、抜けられなくなったというときは、すぐに警察相談専用電話#9110や近くの警察署に相談する。
  references:
    - title: ＳＮＳなどで求人情報を探している方へ 犯罪実行者募集情報の特徴（PDF）
      url: https://www.npa.go.jp/bureau/safetylife/yamibaito/tokutyou.pdf

- id: Q-SN-002
  title: 友だちのアカウントから届いた「投票のための認証番号を送って」
  type: judge
  channel: sns
  is_scam: true
  level: normal
  situation: S06
  targets: [学生, 全世代]
  brand: tomotomo
  tactics: [T04, T06]
  examples: [EX-037]
  context: |
    トモトモで、高校のときの同級生のミサキから、久しぶりにメッセージが届いた。アイコンも名前も、いつものミサキのものだ。
  message:
    sender_name: ミサキ
    sender: "@misaki_0412"
    subject:
    body: |
      ひさしぶり！急にごめんね。
      いま、友だちに頼まれて写真コンテストに出てるんだけど、投票してもらえないかな？
      このあと、投票のための認証番号がSMSで届くから、届いたらその6けたの番号をここに送ってほしい！
      締め切りが今日の夜なの。お願い！
    link:
    page_url:
    parts:
      - kind: profile
        text: 友だちになって5年・アイコンと名前はいつもどおり・前回のやり取りは半年前
  actions:
    - text: SMSに届いた認証番号を、そのままミサキに送る
    - text: 番号は送らず、電話など別の方法でミサキ本人に確かめる
      best: true
    - text: このトークで「本当にミサキ？」と聞き、答えが合っていれば番号を送る
    - text: 本当に投票用の番号なのか、SMSが届くのを待って中身を見てから送る
  hints:
    - target: body
      note: 投票のためと言って、SMSに届く認証番号を送るよう頼み、「今日の夜まで」と急がせている。認証番号はログインのための番号で、投票に使うものではない。
    - target: part:1
      note: アイコンも名前もいつもの友だちだが、アカウントが乗っ取られていても見た目は変わらない。久しぶりの連絡で、いきなりお願いをしている。
  explanation:
    why: |
      トモトモは、ログインのための認証番号を人に聞くことはない。SMSで届く番号は、あなたのアカウントにログインするための番号で、送ると今度はあなたのアカウントが乗っ取られ、ほかの友だちをだますのに使われるおそれがある。友だちのアカウントでも、乗っ取られていれば見た目は同じなので、名前やアイコンでは判断できない。
    action: |
      認証番号は誰にも送らない。電話や直接会うなど、トモトモ以外の方法で友だちに確かめ、乗っ取られていたら教えてあげる。
  references:
    - title: （ページ名未確認）メッセージアプリの友だちになりすます手口の注意喚起
      url: https://www.pref.kagoshima.jp/ja13/cyber_teguchi08.html
    - title: （資料名未確認）メッセージアプリ乗っ取りの注意喚起（PDF）
      url: https://www.pref.yamaguchi.lg.jp/uploaded/attachment/209293.pdf

- id: Q-SN-003
  title: 公式を名乗る新しいアカウントからの「プレゼント当選」DM
  type: judge
  channel: sns
  is_scam: true
  level: easy
  situation: S16
  targets: [全世代]
  brand: pochitto
  tactics: [T01, T02, T04, T05, T06]
  examples: [EX-083, EX-082]
  context: |
    ハナシバで、ポチッと通販の公式アカウントが行っていたプレゼント企画に、フォローといいねをして応募していた。数日後、次のDMが届いた。
  message:
    sender_name: ポチッと通販【公式】
    sender: "@pochitto_present"
    subject:
    body: |
      おめでとうございます！
      ポチッと通販「10周年記念プレゼント企画」で、あなたが「ロボット掃除機」に当選しました。
      賞品をお送りするため、24時間以内に下のフォームから、お名前・ご住所と、送料（990円）のお支払いに使うクレジットカードの情報をご登録ください。
      期限を過ぎると、当選は無効になります。
    link: "https://pochitto-campaign.example/present/entry"
    page_url:
    parts:
      - kind: profile
        text: 認証バッジなし・今月作られたアカウント・フォロワー12人・フォロー中1,850人
  actions:
    - text: 期限が短いので、すぐにフォームから住所とカードの情報を登録する
    - text: DMに返信して、本当にポチッと通販の公式アカウントか聞いてみる
    - text: カード情報は入れずに、名前と住所だけをフォームに登録する
    - text: リンクは開かず、アカウントをブロックしてハナシバに通報する
      best: true
  hints:
    - target: part:1
      note: 認証バッジがなく、今月作られたばかりで、フォロワーが12人しかいない。企業の公式アカウントには、ハナシバの認証バッジが付く。
    - target: body
      note: 賞品を受け取るのに、カード情報の登録と送料の支払いを求め、「24時間以内」と急がせている。
    - target: link
      note: リンクの本当の持ち主（登録ドメイン）は pochitto-campaign.example。公式の名前に「-campaign」を足しただけの別のドメインで、ポチッと通販の公式ドメイン（pochitto.example）ではない。
  explanation:
    why: |
      ハナシバでは、企業の公式アカウントに認証バッジが付く。このアカウントはバッジがなく、今月作られたばかりで、プレゼント企画を行った公式アカウントとは別のもの。賞品を送るためと言ってカード情報を登録させたり、送料を払わせたりするのは、当選をかたる詐欺の典型的な手口。
    action: |
      DMのリンクは開かず、返信もしない。アカウントをブロックし、ハナシバに通報する。当選が気になるときは、ポチッと通販の公式サイトに載っているリンクから公式アカウントを開いて確かめる。
  references:
    - title: ＳＮＳのなりすましアカウントに注意
      url: https://www.pref.tochigi.lg.jp/keisatu/n14/seikatu/documents/20260123092947.pdf
    - title: （消費生活通信 SNSのプレゼント企画に応募した相談事例）
      url: https://www.city.tochigi.lg.jp/uploaded/attachment/66744.pdf

- id: Q-SN-004
  title: マッチングアプリで親しくなった相手からの暗号資産投資の誘い
  type: judge
  channel: sns
  is_scam: true
  level: hard
  situation: S10
  targets: [社会人]
  brand: deaeru
  tactics: [T12, T11, T05]
  examples: [EX-063]
  context: |
    マッチングアプリのデアエルで知り合ったハルカと、3週間、毎日メッセージをやり取りしている。まだ会ったことはないが、仕事の悩みも親身に聞いてくれて、話していて楽しい相手だ。ある夜、デアエルのメッセージに次の文が届いた。
  message:
    sender_name: ハルカ
    sender: "@haruka_k0310"
    subject:
    body: |
      今日もお仕事おつかれさま。昨日話してた企画、うまくいったみたいで本当によかったね。
      ねえ、そろそろアプリの外でも話したいな。トモトモのIDを送るから、そっちに移らない？
      それと、ずっと言おうか迷ってたんだけど……私、親せきに教えてもらった暗号資産の投資で、毎月少しずつ増やせてるんだ。
      2人の将来のことも考えて、あなたにも知っておいてほしくて。トモトモで、やり方をゆっくり教えるね。
    link:
    page_url:
    parts:
      - kind: profile
        text: デアエルで3週間前にマッチ・写真4枚・自己紹介は「旅行とカフェめぐりが好き」・まだ一度も会っていない
  actions:
    - text: トモトモに移って、まずは投資のやり方を聞くだけ聞いてみる
    - text: 投資の話は断り、アプリの外には移らずに、やり取りをやめる
      best: true
    - text: 損をしても困らない1万円だけで、試しに始めてみる
    - text: 「本当にもうかってるの？」と聞いて、利益が出ている画面を送ってもらう
  hints:
    - target: body
      note: やり取りの場をアプリの外（トモトモ）に移そうとし、そのうえで暗号資産の投資の話を持ち出している。「2人の将来」と恋愛の気持ちにも訴えている。
    - target: part:1
      note: 3週間毎日やり取りしていても、一度も会ったことがない相手。会ったことのない相手からお金や投資の話が出たら、ロマンス詐欺を疑うサイン。
  explanation:
    why: |
      デアエルは、やり取りをアプリの中で行うよう案内している。アプリの外に誘い、親しくなってから投資の話を持ち出すのは、SNS型ロマンス詐欺の典型的な流れ。やさしい言葉や長いやり取りがあっても、一度も会ったことのない相手からお金や投資の話が出た時点で、詐欺を疑う。
    action: |
      投資の話はきっぱり断り、アプリの外には移らない。やり取りをやめ、不安なときは家族や警察相談専用電話#9110に相談する。
  references:
    - title: それ詐欺です！SNS上の投資勧誘にご注意ください！
      url: https://www.fsa.go.jp/receipt/toushisagi_koukoku/shuhou.html

- id: Q-SN-005
  title: 「ライブのチケットを定価で譲ります」と先払いを求めるDM
  type: judge
  channel: sns
  is_scam: true
  level: normal
  situation: S12
  targets: [学生]
  brand: hanashiba
  tactics: [T04, T05, T07]
  examples: [EX-073]
  context: |
    チケットノモリで申し込んだ推しのグループのライブの抽選に、外れてしまった。ハナシバで「11月3日 そよかぜアリーナ公演のチケット、定価で譲ります」という投稿を見つけてDMを送ると、次の返事が届いた。相手からは、運転免許証の画像も送られてきている。
  message:
    sender_name: ゆずき
    sender: "@yuzuki_oshikatsu"
    subject:
    body: |
      DMありがとうございます！
      11月3日のそよかぜアリーナ公演、アリーナ席を定価（1枚9,800円）でお譲りします。
      ほかにも希望の方が多いので、先にお支払いいただいた方にお譲りしますね。
      信用していただけるように、免許証の画像をお送りしました。
      代金は、今日中にクルクルペイでこちらのIDへ送金してください。入金を確認したら、チケットをお送りします。
    link:
    page_url:
    parts:
      - kind: profile
        text: 認証バッジなし・個人のアカウント・フォロワー48人・投稿はチケットの「譲ります」ばかり
  actions:
    - text: 免許証の画像まで送ってくれたので、信用してクルクルペイで送金する
    - text: 半額だけ先に送り、残りはチケットが届いてから払うと伝える
    - text: 先にお金は送らず、チケットノモリの公式リセールで探す
      best: true
    - text: 相手の前の投稿を見て、取引の実績がありそうなら送金する
  hints:
    - target: body
      note: チケットを受け取る前に、知らない相手に代金を送るよう求め、「今日中」「ほかにも希望者が多い」と急がせている。
    - target: part:1
      note: 相手はSNSの個人アカウントで、本当は誰なのか確かめられない。送られてきた免許証の画像も、他人のものや作られたものかもしれない。
  explanation:
    why: |
      チケットノモリでは、行けなくなったチケットは公式のリセール（再販売）でだけ受け付けている。SNSで知り合った人に先にお金を送ると、チケットが届かず連絡が取れなくなっても、取り戻すのは難しい。身分証の画像は、他人のものや作られたものかもしれず、信用できる理由にはならない。
    action: |
      SNSで知り合った人に先にお金を送らない。チケットは、チケットノモリの公式リセールなどの正規のルートで探す。困ったときは消費者ホットライン188に相談する。
  references:
    - title: "“推し”に会えない!?転売チケットの購入トラブルが急増中"
      url: https://www.kokusen.go.jp/news/data/n-20220804_2.html

- id: Q-SN-006
  title: 地震の直後に広まった、個人名義の口座への義援金の呼びかけ
  type: judge
  channel: sns
  is_scam: true
  level: normal
  situation: S18
  targets: [全世代]
  brand: hanashiba
  tactics: [T04, T07]
  examples: [EX-087]
  context: |
    大きな地震があった次の日、ハナシバで多くの人に共有されている次の投稿を見かけた。
  message:
    sender_name: 被災地応援プロジェクト
    sender: "@hisaichi_ouen_pj"
    subject:
    body: |
      【拡散希望】昨日の地震で、多くの方が避難所で不安な夜を過ごしています。
      私たちは、被災地に直接お金を届けるため、義援金を集めています。
      一刻も早く届けたいので、今すぐご協力をお願いします！
      振込先：XX銀行 そよかぜ支店 普通 XXXXXXX 名義 スズキ ケンタ
      電子マネーのギフトカードでも受け付けています。カードの番号をDMで送ってください。
    link:
    page_url:
    parts:
      - kind: profile
        text: 認証バッジなし・フォロワー230人・プロフィールは「被災地を応援する有志のプロジェクト」とだけあり、団体の住所や連絡先は書かれていない
  actions:
    - text: 少しでも早く届けたいので、書かれた口座に振り込む
    - text: 振込は手間なので、電子マネーのギフトカードを買って番号をDMで送る
    - text: 自分は寄付しないが、困っている人のために投稿を拡散する
    - text: 寄付は、自治体や支援団体の公式サイトに載っている窓口から行う
      best: true
  hints:
    - target: body
      note: 振込先が個人名義の口座で、電子マネーのカード番号でも受け付けている。「今すぐ」と急がせている。
    - target: part:1
      note: 誰が集めているのか、団体の住所や連絡先が分からない。集めたお金をどこに届けるのかも書かれていない。
  explanation:
    why: |
      本物の義援金は、自治体や支援団体の公式サイトで、受付の窓口や振込先が公表されている。この投稿は、誰が集めているのかが分からないうえに、振込先が個人名義の口座だったり、電子マネーの番号を送らせたりしている。災害の直後は、助けたい気持ちにつけこむ偽の募金の呼びかけが増える。
    action: |
      寄付は、自治体や支援団体の公式サイトに載っている窓口から行う。怪しい投稿は拡散しない。迷ったときは警察相談専用電話#9110や消費者ホットライン188に相談する。
  references:
    - title: 義援金等を装った詐欺にご注意!
      url: https://www.fsa.go.jp/ordinary/earthquake202607/gienkinsagi.html
    - title: 寄付先が不透明な募金は詐欺の可能性あり！
      url: https://www.police.pref.nara.jp/cmsfiles/contents/0000000/737/R8.8.7.pdf

- id: Q-SN-007
  title: 親せきのいつものアカウントから「電子マネーのカードを買って番号を送って」
  type: judge
  channel: sns
  is_scam: true
  level: hard
  situation: S15
  targets: [全世代]
  brand: tomotomo
  tactics: [T04, T07]
  examples: [EX-080]
  context: |
    トモトモで、親せきのケンジおじさんからメッセージが届いた。先月も、法事の日程をこのトークでやり取りしたばかりだ。
  message:
    sender_name: ケンジおじさん
    sender: "@kenji_0718"
    subject:
    body: |
      いま大丈夫？ちょっと頼みたいことがあって。
      今日中に取引先への支払いがあるんだけど、仕事で手が離せなくてね。
      悪いけど、近くのコンビニで電子マネーのカードを3万円分買って、裏の番号を写真で送ってもらえないかな。
      お金は週末に会ったときに必ず返すから。よろしく頼むよ。
    link:
    page_url:
    parts:
      - kind: profile
        text: 友だちになって6年・アイコンと名前はいつもどおり・先月も法事の連絡をやり取りしている
  actions:
    - text: いつものおじさんのアカウントなので、カードを買って番号の写真を送る
    - text: このトークで、おじさんしか知らないことを質問し、合っていれば送る
    - text: 返事はせず、前から知っているおじさんの電話番号にかけて確かめる
      best: true
    - text: 3万円は多いので、1万円分だけ買って番号を送る
  hints:
    - target: body
      note: メッセージだけで、電子マネーのカードを買って裏の番号を送るよう頼んでいる。番号を送ると、その場でお金を使われてしまう。
    - target: part:1
      note: いつものアカウントでも、乗っ取られていれば見た目は変わらない。アカウントが本物かどうかでは判断できない。
  explanation:
    why: |
      家族や知人を名乗り、メッセージだけで電子マネーのカードを買わせて番号を送らせるのは、乗っ取ったアカウントを使ったなりすましの典型的な手口。アカウントが本物でも、乗っ取られていれば送っているのは別人で、前のトークも読まれているので、トークの中で質問しても確かめにならない。電子マネーの番号は、送るとすぐに使われてしまい、取り戻すのは難しい。
    action: |
      カードは買わず、番号も送らない。前から知っている電話番号にかけるなど、トモトモ以外の方法で本人に確かめる。乗っ取りが分かったら、ほかの家族にも知らせる。
  references:
    - title: （ページ名未確認）メッセージアプリの友だちになりすます手口の注意喚起
      url: https://www.pref.kagoshima.jp/ja13/cyber_teguchi08.html
    - title: （ページ名未確認）アカウント乗っ取りの注意喚起
      url: https://www.pref.kumamoto.jp/site/police/280796.html

- id: Q-SN-008
  title: 応募したキャンペーンの公式アカウントから届いた当選のDM
  type: judge
  channel: sns
  is_scam: false
  level: normal
  situation: S16
  targets: [全世代]
  brand: yumemiru
  tactics: []
  examples: [EX-084]
  context: |
    ハナシバで、ユメミル動画の公式アカウント（認証バッジ付き）が行っていた「秋のプレゼントキャンペーン」に、自分でフォローとリポストをして応募していた。応募の締め切りから3日後、次のDMが届いた。
  message:
    sender_name: ユメミル動画【公式】
    sender: "@yumemiru_official"
    subject:
    body: |
      このたびは「ユメミル動画 秋のプレゼントキャンペーン」にご応募いただき、ありがとうございました。
      抽選の結果、「3か月無料視聴コード」にご当選されました。おめでとうございます。
      受け取りの手続きは、ユメミル動画の公式アプリの「お知らせ」からお願いいたします（10月31日まで）。
      このDMで、お名前・ご住所・カード情報などをお聞きすることはありません。手数料もかかりません。
      ユメミル動画 キャンペーン事務局
    link:
    page_url:
    parts:
      - kind: profile
        text: 認証バッジあり・キャンペーンを告知したアカウントと同じID・開設7年・フォロワー52万人
  actions:
    - text: DMに返信して、賞品の送り先として名前と住所を伝える
    - text: 自分でユメミル動画の公式アプリを開き、「お知らせ」から手続きする
      best: true
    - text: 当選のDMはなりすましが多いので、何もせずに削除する
    - text: 検索で見つけた「ユメミル動画 当選 受け取り」のサイトから手続きする
  hints:
    - target: part:1
      note: 認証バッジがあり、キャンペーンを告知した公式アカウントと同じID。開設から7年で、フォロワーも多い。
    - target: body
      note: リンクがなく、手続きは公式アプリの「お知らせ」から行うよう案内している。個人情報や手数料を求めていない。
  explanation:
    why: |
      送り主は、キャンペーンを行った認証バッジ付きの公式アカウントそのもの。ユメミル動画は、当選の手続きを公式アプリの「お知らせ」から行い、手数料はかからないとしていて、このDMの内容と合っている。DMにリンクがなく、個人情報やカード情報を求めていないことも、本物と言える理由。
    action: |
      DMの中では手続きせず、自分でユメミル動画の公式アプリを開いて「お知らせ」から受け取る。アプリに案内が見当たらないときは、手続きしない。
  references:
    - title: 姶良・伊佐地域振興局の公式Instagramのなりすましへの注意喚起（題名未確認）
      url: https://www.pref.kagoshima.jp/aa02/kohokocho/kouhoushi/instagram/airatyuuikanki.html

- id: Q-SN-009
  title: 公式サイトからたどった公式アカウントの「緊急メンテナンス」の投稿
  type: judge
  channel: sns
  is_scam: false
  level: hard
  situation: S06
  targets: [学生, 全世代]
  brand: pikopiko
  tactics: []
  examples: [EX-039]
  context: |
    ピコピコストアの公式サイトのいちばん下にある「公式SNS」のリンクから、ハナシバのアカウントを開いた。いちばん新しい投稿は次のものだった。
  message:
    sender_name: ピコピコストア【公式】
    sender: "@pikopiko_store"
    subject:
    body: |
      【重要】緊急メンテナンスのお知らせ
      10月16日（金）午前2時〜4時ごろ、システムの緊急メンテナンスのため、ピコピコストアを利用できません。
      この間は、アプリの購入とゲーム内通貨のチャージができません。
      なお、メンテナンスのおわびとして、DMやほかのサイトでゲーム内通貨を配ることはありません。おわびがある場合は、ストアのアプリの「お知らせ」でご案内します。
    link:
    page_url:
    parts:
      - kind: profile
        text: 認証バッジあり・公式サイトに載っているIDと同じ・開設6年・フォロワー120万人
  actions:
    - text: その時間は使わず、くわしくはストアのアプリの「お知らせ」で見る
      best: true
    - text: 「緊急」と書いてあって怪しいので、念のためアカウントをブロックして通報する
    - text: 返信欄に「おわびの通貨はこちら」というリンクがあれば、開いて受け取る
    - text: 本当にメンテナンスがあるのか、投稿に返信して運営に聞いてみる
  hints:
    - target: part:1
      note: 公式サイトのリンクからたどったアカウントで、IDも公式サイトの表示と同じ。認証バッジがあり、開設6年でフォロワーも多い。
    - target: body
      note: リンクがなく、ログインや入力、支払いを求めていない。「DMやほかのサイトで通貨を配ることはない」と、ピコピコストアの決まりと同じことを書いている。
  explanation:
    why: |
      このアカウントは、ピコピコストアの公式サイトに載っているリンクからたどったもので、IDも公式サイトの表示と同じ。SNSによっては認証バッジを買えることもあるため、バッジだけでは安心できないが、公式サイトからたどれたことに加えて、開設時期やフォロワー数もそろっている。投稿にはリンクがなく、何かを入力させたり払わせたりもしていない。
    action: |
      投稿の内容は参考にしてよい。くわしいことやおわびの案内は、ストアのアプリの「お知らせ」で確かめ、返信欄やDMに出てくる「通貨を配る」というリンクは開かない。
  references:
    - title: ＳＮＳのなりすましアカウントに注意
      url: https://www.pref.tochigi.lg.jp/keisatu/n14/seikatu/documents/20260123092947.pdf

- id: Q-SN-010
  title: 市の公式アカウントが義援金の受付窓口を案内する投稿
  type: judge
  channel: sns
  is_scam: false
  level: easy
  situation: S18
  targets: [全世代]
  brand: soyokaze_city
  tactics: []
  examples: [EX-088]
  context: |
    地震のあと、被災地に寄付をしたいと思い、ハナシバで義援金について調べていたら、そよかぜ市の公式アカウントの次の投稿が見つかった。
  message:
    sender_name: そよかぜ市【公式】
    sender: "@soyokaze_city"
    subject:
    body: |
      【災害義援金の受付について】
      10月12日の地震で被害を受けた地域への義援金の受付窓口と振込先を、市の公式サイトでお知らせしています。
      市の職員が、電話や訪問、SNSのメッセージで義援金をお願いすることはありません。
      不審な電話や呼びかけにご注意ください。
    link: "https://www.city.soyokaze.example/bosai/gienkin/"
    page_url:
    parts:
      - kind: profile
        text: 認証バッジあり・市の公式サイトにも載っているアカウント・開設9年・フォロワー3.8万人
  actions:
    - text: 投稿に返信して、振込先の口座番号を直接教えてもらう
    - text: 市の公式サイトで受付の窓口と振込先を確かめてから寄付する
      best: true
    - text: SNSの投稿は信用できないので、寄付するのをやめる
    - text: 返信欄で案内された別の口座に振り込む
  hints:
    - target: part:1
      note: 認証バッジがあり、市の公式サイトにも載っている、そよかぜ市の公式アカウント。
    - target: link
      note: リンク先は www.city.soyokaze.example で、そよかぜ市の公式ドメイン（city.soyokaze.example）の中のページ。
    - target: body
      note: 投稿の中でお金を振り込ませず、公式サイトの窓口を案内している。電話や訪問、SNSで義援金を求めないことも書いている。
  explanation:
    why: |
      そよかぜ市の公式アカウント（認証バッジあり）が、市の公式サイトの義援金のページを案内している。リンク先も市の公式ドメインの中のページで、投稿の中で振込を急がせたり、個人の口座を示したりしていない。自治体の義援金は、公式サイトで窓口や振込先を公表するのが正規のやり方で、それと合っている。
    action: |
      寄付は、市の公式サイトに載っている窓口と振込先を確かめてから行う。返信欄やDMで別の振込先を案内されても使わない。
  references:
    - title: 令和6年能登半島地震 大阪府義援金の募集について
      url: https://www.pref.osaka.lg.jp/o020080/kikikanri/r6_noto_gienkin/index.html
    - title: （災害に便乗した義援金詐欺などへの注意）
      url: https://www.pref.shizuoka.jp/kurashikankyo/shohiseikatsu/1066984/1085125.html

- id: Q-SN-011
  title: 同じクラスの友だちが送ってきた求人サイトのアルバイト募集
  type: judge
  channel: sns
  is_scam: false
  level: normal
  situation: S07
  targets: [学生]
  brand: hatarakumo
  tactics: []
  examples: [EX-045, EX-040]
  context: |
    同じクラスのリコから、トモトモでメッセージが届いた。リコとは、学校でもよくアルバイトの話をしている。
  message:
    sender_name: リコ
    sender: "@riko_0815"
    subject:
    body: |
      ねえ、駅前のカフェでバイト募集してるの見つけた！一緒に応募しない？
      ハタラクモに載ってたやつだよ。
      「カフェ・ソヨカゼ 駅前店／ホールスタッフ／時給1,150円／週2日〜・1日4時間〜／交通費支給／学生歓迎」
      応募はハタラクモのページの「応募する」ボタンからできて、そのあとお店で面接があるんだって。
    link: "https://hatarakumo.example/jobs/cafe-soyokaze-ekimae"
    page_url:
    parts:
      - kind: profile
        text: 同じクラスの友だち・トモトモでふだんからやり取りしている
  actions:
    - text: 自分でハタラクモを開き、同じ求人の内容を確かめてから応募する
      best: true
    - text: 早く決めたいので、お店の人の個人の連絡先を探して、直接応募する
    - text: 友だちからでもリンクは危ないので、このメッセージは無視する
    - text: 2人分まとめて応募してもらうため、身分証の写真をリコに送る
  hints:
    - target: link
      note: リンクの本当の持ち主（登録ドメイン）は hatarakumo.example で、ハタラクモの公式ドメインと同じ。
    - target: body
      note: 仕事の内容・時給・勤務地・日数がはっきりしていて、応募はハタラクモのサイトの中で行う。面接もある。
  explanation:
    why: |
      リンクの登録ドメイン（URLの本当の持ち主）はハタラクモの公式ドメインで、応募もハタラクモのサイトの中で行うようになっている。仕事の内容・時給・勤務地がはっきりしていて面接もあり、闇バイトのような「高額・即日・仕事の中身があいまい」という特徴がない。お金や身分証の画像を求めていないことも、本物と言える理由。
    action: |
      自分でハタラクモのサイトを開いて同じ求人を探し、内容を確かめてから応募する。応募のあとで、チャットで身分証の画像を送るよう言われたら、応じずに相談する。
  references:
    - title: ＳＮＳなどで求人情報を探している方へ 犯罪実行者募集情報の特徴（PDF）
      url: https://www.npa.go.jp/bureau/safetylife/yamibaito/tokutyou.pdf

- id: Q-SN-012
  title: フリマアプリの取引画面で届いた購入者のあいさつ
  type: judge
  channel: sns
  is_scam: false
  level: normal
  situation: S14
  targets: [全世代]
  brand: furimarche
  tactics: []
  examples: [EX-078]
  context: |
    フリマルシェに、使わなくなったゲーム機を出品していた。「商品が購入されました」という通知が来たのでフリマルシェのアプリを開くと、取引画面には「お支払い済み」と表示され、次のメッセージが届いていた。
  message:
    sender_name: はるまき
    sender: "@harumaki_88"
    subject:
    body: |
      はじめまして。購入させていただきました。
      よろしくお願いいたします。
      発送はいつ頃になりそうでしょうか？
    link:
    page_url:
    parts:
      - kind: profile
        text: フリマルシェの利用者・登録3年・取引の評価120件（良い118件）
  actions:
    - text: 念のため相手にトモトモのIDを教えて、そちらで連絡を取り合う
    - text: 本当に払われたか不安なので、相手に振込の画面の写真を送ってもらう
    - text: 取引画面で発送の予定を返信し、アプリの手順どおりに発送する
      best: true
    - text: 知らない人からのメッセージなので返信せず、取引をキャンセルする
  hints:
    - target: sender
      note: フリマルシェの取引画面の中で、商品を購入した人から届いている。支払いもアプリの中で済んでいる（「お支払い済み」の表示）。
    - target: body
      note: アプリの外での支払いや連絡を求めず、発送の予定を聞いているだけ。
  explanation:
    why: |
      メッセージはフリマルシェのアプリの取引画面の中で届いていて、支払いもアプリの中で済んでいる。フリマルシェは取引と支払いをアプリの中で完結させる仕組みで、フリマアプリの正規の取引では、運営が代金をいったん預かってから出品者に支払う。相手はアプリの外での支払いや連絡を求めておらず、発送の予定を聞いているだけなので、ふつうの取引の連絡。
    action: |
      取引画面で返信し、アプリの手順どおりに発送する。もし相手がアプリの外でのやり取りや支払いを持ちかけてきたら応じず、フリマルシェに相談する。
  references:
    - title: （フリマアプリで架空取引を持ちかけられるトラブルに関する注意喚起）
      url: https://www.kokusen.go.jp/news/data/n-20211118_1.html

- id: Q-SN-013
  title: 料理仲間から暗号資産の投資に誘うDM
  type: judge
  channel: sns
  is_scam: true
  level: normal
  situation: S04
  targets: [社会人, 学生]
  brand: hanashiba
  tactics: [T12, T11, T05, T07]
  examples: [EX-023]
  context: |
    ハナシバに料理の写真を投稿していたら、同じく料理が好きな「ゆうき」さんからコメントが来た。それから2週間、毎日DMでレシピの話をしている。会ったことはない。今日、次のDMが届いた。
  message:
    sender_name: ゆうき｜おうちごはん
    sender: "@yuki_ouchigohan"
    subject:
    body: |
      今日の肉じゃが、すごくおいしそうだった！いつも投稿を見るのが楽しみなんだ。
      そういえば、この前投稿した新しいお鍋、実は暗号資産の取引のもうけで買ったんだ。半年前に始めて、今は毎月10万円くらい増えてるの。
      私が使ってる取引所のアプリなら、先生がサポートしてくれるから初心者でも大丈夫。いつも仲良くしてくれるお礼に、特別に教えたいな。
      下のリンクからアプリを入れて、まずは3万円から一緒に始めてみない？
    link: "https://coin-up-trade.example/invite?code=YUKI"
    page_url:
    parts:
      - kind: profile
        text: 認証バッジなし・フォロワー236人・料理の写真の投稿が多い・2か月前に作られたアカウント
  actions:
    - text: 毎日話している仲なので、3万円だけ試しに始めてみる
    - text: 相手が送ってくれる利益の画面を見て、本当なら始める
    - text: アプリは入れず、投資の誘いは断ってやり取りをやめる
      best: true
    - text: 「本当にもうかるの？」と返信して、くわしく聞いてみる
  hints:
    - target: body
      note: ネットだけで知り合った相手が、親しくなってから暗号資産の投資をすすめている。「毎月10万円くらい増えてる」と、もうかる話ばかりしている。
    - target: link
      note: 知らない取引所のアプリへの招待リンク。本当の持ち主（登録ドメイン）は coin-up-trade.example。
    - target: part:1
      note: 2か月前に作られたばかりのアカウントで、会ったこともない相手。
  explanation:
    why: |
      SNSで知り合い、会ったことのない相手が、親しくなってから投資をすすめるのは、投資詐欺によくある流れ。「毎月増えている」「初心者でも大丈夫」と、もうかる話だけをして、知らない取引所のアプリに誘っている。始めると利益が出ているように見せ、出金しようとすると「認証金」などの名目で追加のお金を求める例が報告されている。
    action: |
      リンクのアプリは入れず、投資の誘いは断る。暗号資産の取引所が、金融庁・財務局に登録された業者かどうかは、金融庁のサイトで確かめられる。お金を送ってしまったら、すぐに消費者ホットライン188や警察相談専用電話#9110に相談する。
  references:
    - title: "見守り新鮮情報 第530号（SNSで勧誘される暗号資産の詐欺的な投資話）"
      url: "https://www.kokusen.go.jp/mimamori/mj_mailmag/mj-shinsen530.html"

- id: Q-SN-014
  title: そよかぜ警察署の本物の注意喚起の投稿
  type: judge
  channel: sns
  is_scam: false
  level: easy
  situation: S09
  targets: [全世代]
  brand: soyokaze_police
  tactics: []
  examples: [EX-062]
  context: |
    ハナシバを見ていたら、そよかぜ警察署のアカウントの投稿が流れてきた。
  message:
    sender_name: そよかぜ警察署【公式】
    sender: "@soyokaze_police"
    subject:
    body: |
      【ニセ警察詐欺にご注意ください】
      警察官を名乗る人から「あなたの口座が犯罪に使われている」などと電話があり、SNSのメッセージやビデオ通話に誘われる被害が、市内で相次いでいます。

      警察官が、
      ・SNSやメッセージアプリで一人ひとりに連絡したり、ビデオ通話で取り調べをしたりすることはありません。
      ・逮捕状や警察手帳の画像を送ることはありません。
      ・捜査のためだと言って、お金を振り込ませることはありません。

      不安なときは、電話をいったん切って、警察相談専用電話「#9110」か、そよかぜ警察署にご相談ください。
      #ニセ警察詐欺 #そよかぜ警察署
    link:
    page_url:
    parts:
      - kind: profile
        text: 認証バッジあり・フォロワー1.8万人・「そよかぜ警察署の公式アカウントです」と紹介・警察署の公式サイトの「公式SNS」のページからたどれる
  actions:
    - text: 内容を覚えて、家族にも同じ注意を伝えておく
      best: true
    - text: 本物か分からないので、投稿に返信して警察署に質問する
    - text: 警察を名乗るアカウントは偽物が多いので、ブロックする
    - text: ハッシュタグで見つけた「相談窓口」のアカウントにDMする
  hints:
    - target: part:1
      note: 認証バッジがあり、そよかぜ警察署の公式サイトからたどれる公式アカウント。
    - target: body
      note: リンクがなく、個人情報やお金も求めていない。本物の警察が「しないこと」を知らせる注意喚起。
  explanation:
    why: |
      そよかぜ警察署の公式アカウントによる、本物の注意喚起の投稿。認証バッジがあり、警察署の公式サイトからたどれるアカウントで、リンクがなく、個人情報やお金も求めていない。内容も「警察はSNSやビデオ通話で取り調べをしない」「逮捕状の画像を送らない」という、本物の警察のきまりと合っている。警察が公式アカウントでみんなに注意を呼びかけることはあっても、一人ひとりにSNSで連絡してくることはない。
    action: |
      内容を覚えて、家族や友だちにも伝えておく。警察を名乗る電話やメッセージで不安になったら、いったん切って、自分で調べた警察署の番号か警察相談専用電話#9110に相談する。
  references:
