# 追加の問題（担当 W4）：足りない手口・画面の種類を埋める11問
# メール・SMS・Web・広告・SNS・会話が混ざっている。id の記号と channel を合わせる
# （Q-EM は email、Q-SM は sms、Q-WB は web、Q-AD は ad、Q-SN は sns、Q-CH は chat）。

- id: Q-EM-015
  title: マチカド郵便をかたる再配達手数料のメール
  type: judge
  channel: email
  is_scam: true
  level: normal
  situation: S02
  targets: [全世代]
  brand: machikado
  tactics: [T09, T01, T06]
  examples: [EX-009, EX-002]
  context: |
    通販で注文した本が、今週中にマチカド郵便で届く予定になっている。出かけて帰ってくると、次のメールが届いていた。
  message:
    sender_name: マチカド郵便
    sender: "info@machikado-redelivery.example"
    subject: 【マチカド郵便】ご不在のためお荷物を持ち戻りました
    body: |
      マチカド郵便をご利用いただき、ありがとうございます。

      10月15日 14時20分ごろにお荷物をお届けにうかがいましたが、ご不在のため持ち戻りました。

      お問い合わせ番号：381422075516
      保管期限：10月22日

      再配達をご希望の場合は、下記のページでお届け先の住所をご確認のうえ、再配達手数料（330円）をクレジットカードでお支払いください。保管期限を過ぎたお荷物は、差出人へお返しします。

      ▼再配達のお申し込みはこちら

      マチカド郵便 お客様サービス係
    link: "https://machikado-redelivery.example/redelivery?no=381422075516"
    page_url:
    parts: []
  actions:
    - text: リンクを開き、住所を確かめて手数料の330円をカードで払う
    - text: リンク先で住所の確認だけ済ませ、カード番号は入れずに閉じる
    - text: メールに返信して、どこから届いた荷物なのかを問い合わせる
    - text: リンクは開かず、不在票か公式サイトで荷物の状況を確かめる
      best: true
  hints:
    - target: sender
      note: 送信元のアドレスの @ の後ろが machikado-redelivery.example で、マチカド郵便の公式ドメイン（machikado-post.example）ではない。
    - target: link
      note: リンクの本当の持ち主（登録ドメイン）も machikado-redelivery.example で、公式サイトではない。
    - target: body
      note: 不在をメールで知らせ、再配達のために住所の確認と手数料のカード払いを求めている。マチカド郵便は不在を紙の不在票で知らせ、再配達は不在票の番号か公式サイトで受け付ける。
  explanation:
    why: |
      マチカド郵便をかたる偽の不在通知メール。マチカド郵便は、不在のときは紙の不在票を入れ、再配達は不在票に書かれた番号か公式サイトで受け付ける。送信元とリンクの登録ドメイン（URLの本当の持ち主）も、公式の machikado-post.example ではない。再配達の手続きを口実に、住所やカード番号を入力させる偽のメールやSMSが多く報告されている。
    action: |
      荷物を待っているときでも、メールのリンクは開かない。郵便受けの不在票を確かめ、不在票の番号か、ブックマークした公式サイトから申し込む。カード番号を入力してしまったら、すぐにカード会社に連絡する。
  references:
    - title: "トビラシステムズ、特殊詐欺/フィッシング詐欺の独自調査レポートを公開 宅配事業者をかたるSMS文面が約9割に"
      url: "https://www.itmedia.co.jp/mobile/spv/2311/29/news180.html"
    - title: "国内 ISP の認証情報を不正利用して送信されたフィッシングメールに注意呼びかけ"
      url: "https://scan.netsecurity.ne.jp/article/2026/07/06/55635.html"

- id: Q-EM-016
  title: ポチッと通販の本物の当選メール
  type: judge
  channel: email
  is_scam: false
  level: normal
  situation: S16
  targets: [全世代]
  brand: pochitto
  tactics: []
  examples: [EX-084, EX-082]
  context: |
    先週、ポチッと通販のアプリで「秋のお買い物応援キャンペーン（抽選で500ポイント）」に自分でエントリーした。10月20日、次のメールが届いた。
  message:
    sender_name: ポチッと通販
    sender: "campaign@pochitto.example"
    subject: 【ポチッと通販】秋のお買い物応援キャンペーン 当選のお知らせ
    body: |
      ポチッと通販をご利用いただき、ありがとうございます。

      先日は「秋のお買い物応援キャンペーン」にエントリーいただき、ありがとうございました。抽選の結果、お客様が当選されましたので、お知らせいたします。

      賞品：ポチッとポイント 500ポイント
      付与日：10月20日（ご登録のアカウントに付与済み）
      有効期限：付与日から6か月

      ポイントはすでにお客様のアカウントに付与しておりますので、お手続きは必要ありません。
      同じ内容は、アプリの「メッセージセンター」と「ポイント履歴」でもご確認いただけます。

      ポチッと通販 キャンペーン事務局
    link:
    page_url:
    parts: []
  actions:
    - text: メールに返信して、ポイントを受け取る手続きがないか聞く
    - text: 検索で見つけた「当選確認」のページにログインして確かめる
    - text: アプリを開き、メッセージセンターとポイント履歴で確かめる
      best: true
    - text: 当選のメールは詐欺に決まっているので、すぐに削除する
  hints:
    - target: sender
      note: 送信元のアドレスの @ の後ろが pochitto.example で、ポチッと通販の公式ドメイン。
    - target: subject
      note: 自分でエントリーしたキャンペーンの結果を知らせている。申し込んでいない懸賞の当選ではない。
    - target: body
      note: リンクがなく、パスワードやカード番号の入力も、手数料の支払いも求めていない。手続きは不要で、アプリのメッセージセンターで同じ内容を確かめられると書いている。
  explanation:
    why: |
      ポチッと通販からの本物の当選メール。送信元は公式ドメイン（pochitto.example）で、自分でエントリーしたキャンペーンの結果を知らせている。リンクがなく、パスワードやカード番号の入力、手数料の支払いも求めていない。偽の当選の連絡は、申し込んでいない懸賞の当選を知らせたり、受け取りのために手数料や個人情報の入力を求めたりするのが特徴。
    action: |
      本物らしく見えても、当選やポイントの内容は、公式アプリのメッセージセンターやポイント履歴で確かめる。ポチッと通販の大事なお知らせは、メッセージセンターにも必ず表示される。
  references:
    - title: "（心当たりのない海外宝くじ・懸賞の当選SMSに関するよくある質問）"
      url: "https://www.kokusen.go.jp/t_box/data/t_box-faq_qa2020_16.html"
    - title: "（当選メールの後に手数料を次々と請求された相談事例）"
      url: "https://www.city.kitamoto.lg.jp/material/files/group/44/983_p22.pdf"

- id: Q-WB-013
  title: 検索の上位に出た偽のトマレルのサポート窓口
  type: judge
  channel: web
  is_scam: true
  level: hard
  situation: S09
  targets: [全世代]
  brand: tomareru
  tactics: [T08, T01, T07]
  examples: [EX-060]
  context: |
    トマレルで予約した旅館を、急な用事でキャンセルしたくなった。急いでいたので「トマレル キャンセル 電話」と検索し、一番上に出てきたページを開いた。
  message:
    sender_name:
    sender:
    subject:
    body:
    link:
    page_url: "https://tomareru-support.example/cancel"
    parts:
      - kind: heading
        text: トマレル カスタマーサポート（24時間受付）
      - kind: text
        text: ご予約のキャンセル・変更・返金のご相談は、お電話で専門のスタッフが承ります。オンラインではキャンセルできないご予約もありますので、お早めにお電話ください。
      - kind: text
        text: ※キャンセルのお手続きには、所定の手数料がかかります。手数料の金額とお支払い方法は、お電話でご案内します。
      - kind: phone
        text: "050-XXXX-XXXX"
      - kind: button
        text: 今すぐ電話する
  actions:
    - text: 画面の番号に電話して、キャンセルの手続きを頼む
    - text: ほかの検索結果のページも開き、番号を見比べてからかける
    - text: 公式アプリか予約確認メールに書かれた問い合わせ先を使う
      best: true
    - text: 電話で手数料の金額だけ聞き、払うかどうかはあとで決める
  hints:
    - target: page_url
      note: 検索で開いたページ。アドレスバーの本当の持ち主（登録ドメイン）は tomareru-support.example で、トマレルの公式ドメイン（tomareru.example）ではない。
    - target: part:4
      note: 電話をかけさせようとしている。トマレルの問い合わせ先は、公式アプリと予約確認メールに書いてある。
    - target: part:3
      note: キャンセルの手数料の金額や払い方を、電話で案内するとしている。
  explanation:
    why: |
      検索結果の上のほうに出た「サポート窓口」が、本物とは限らない。トマレルの問い合わせ先は公式アプリと予約確認メールに書いてあり、このページの登録ドメイン（URLの本当の持ち主）も公式の tomareru.example ではない。こうした窓口に電話すると、手数料などの名目でお金を求められたり、個人情報を聞かれたりする例が報告されている。
    action: |
      企業の問い合わせ先は、検索結果からではなく、公式アプリや予約確認メールなど手元にある正規の情報から探す。お金を払ってしまったときや困ったときは、検索せずに消費者ホットライン188にかける。
  references:
    - title: "（検索上位の「相談窓口」に電話して追加の費用を求められた事例を含む資料）"
      url: "https://www.city.okayama.jp/kurashi/cmsfiles/contents/0000016/16949/000388228.pdf"
    - title: "（正規のサポートサイトの検索結果に偽の電話番号を表示させる手口の紹介記事）"
      url: "https://www.lifehacker.jp/article/2507scammers-are-hijacking-legitimate-tech-support-sites/"

- id: Q-WB-014
  title: 一点もののバッグの代金を「送る」で払わせる通販サイト
  type: judge
  channel: web
  is_scam: true
  level: hard
  situation: S01
  targets: [全世代]
  tactics: [T15, T07]
  examples: [EX-007]
  context: |
    ずっと探していた、もう作られていない型の一点もののバッグ。検索で見つけた通販サイト「ユズリハ商店」に、相場より少し安い値段で出ていた。写真も説明もていねいだったので注文すると、次の画面が出た。
  message:
    sender_name:
    sender:
    subject:
    body:
    link:
    page_url: "https://yuzuriha-shoten.example/order/complete"
    parts:
      - kind: heading
        text: ご注文ありがとうございます
      - kind: text
        text: ご注文番号 YZ-104728／商品 ヴィンテージ レザーハンドバッグ（一点もの）／代金 38,500円（送料無料）
      - kind: text
        text: お支払いは、クルクルペイの「送る」機能でお願いいたします。ご注文から24時間以内に、下記のアカウントあてに代金をお送りください。
      - kind: text
        text: 送り先のアカウント：カワセ リン　※お支払いを確認したあと、3営業日以内に発送いたします。
      - kind: button
        text: クルクルペイを開く
  actions:
    - text: 代金は送らずに注文をやめ、困ったら消費者ホットライン188へ
      best: true
    - text: 一点ものなので、売れてしまう前に「送る」で代金を送る
    - text: 送り先が店長の個人アカウントなのか、お店にメールで聞いてから送る
    - text: 半額だけ先に送り、残りは商品が届いてから送るとお店に伝える
  hints:
    - target: part:3
      note: お店への支払いなのに、個人どうしでお金をやり取りする「送る」機能を使わせようとしている。
    - target: part:4
      note: 送り先が、お店の名前ではなく個人の名前のアカウントになっている。
  explanation:
    why: |
      お店（事業者）に代金を払うのに、コード決済の「送る」機能で個人の名前のアカウントへ送らせるのは、悪質な通販サイトの特徴。「送る」は個人どうしでお金をやり取りするための機能で、お店に払うときはふつう「支払う」機能を使う。写真や説明は、フリマサイトなどから流用されていることがあり、見た目だけでは見分けにくい。
    action: |
      個人のアカウントへの「送る」で払うよう言われたら、購入をやめる。送ってしまったら、すぐにクルクルペイのアプリから問い合わせ、消費者ホットライン188に相談する。
  references:
    - title: "（海外に拠点があるとみられる悪質通販サイトに関する注意喚起。越境消費者センターによる悪質通販サイト情報の公表から2年）"
      url: "https://www.kokusen.go.jp/news/data/n-20260617_1.html"
    - title: "国民生活センター、「悪質通販サイト」 手口・相談内容を公開し注意喚起"
      url: "https://ecnomikata.com/ecnews/50908/"

- id: Q-WB-015
  title: チケットノモリの本物の公式リセール
  type: judge
  channel: web
  is_scam: false
  level: normal
  situation: S12
  targets: [学生]
  brand: ticketnomori
  tactics: []
  examples: [EX-075]
  context: |
    抽選に外れてしまった推しのライブ。チケットノモリの公式アプリに「公式リセールの受付が始まりました」とお知らせが届いたので、アプリから公式リセールのページを開いた。
  message:
    sender_name:
    sender:
    subject:
    body:
    link:
    page_url: "https://ticket-nomori.example/resale/detail?id=58213"
    parts:
      - kind: heading
        text: 公式リセール（定価でのお取引）
      - kind: text
        text: 秋のライブツアー2026 そよかぜアリーナ公演／11月23日（月・祝）18:00開演／指定席 1枚
      - kind: text
        text: チケット代金 8,800円（定価）＋ リセール手数料 880円　合計 9,680円
      - kind: text
        text: 受け取り：チケットノモリ公式アプリの電子チケット（公演の3日前から表示）／支払い：この画面で、登録済みのお支払い方法から
      - kind: button
        text: 購入手続きへ進む
  actions:
    - text: この画面で購入手続きをして、公式アプリでチケットを受け取る
      best: true
    - text: SNSで「定価で譲ります」と投稿している人に連絡して買う
    - text: 検索広告に出てきたチケット販売サイトで、良い席を探して買う
    - text: 出品した人と直接やり取りして、個人の口座に代金を振り込む
  hints:
    - target: page_url
      note: アドレスバーの本当の持ち主（登録ドメイン）は ticket-nomori.example で、チケットノモリの公式ドメイン。公式アプリのお知らせから開いたページ。
    - target: part:3
      note: 値段は定価に、決められた手数料を足しただけ。高く値上げされていない。
    - target: part:4
      note: 受け取りは公式アプリの電子チケットで、支払いもこの画面で完結する。個人の口座への振込を求めていない。
  explanation:
    why: |
      チケットノモリの本物の公式リセールのページ。公式アプリのお知らせから開いていて、アドレスバーの登録ドメイン（URLの本当の持ち主）も公式の ticket-nomori.example。値段は定価に決められた手数料を足したもので、受け取りは公式アプリ、支払いはこの画面の決済と、正規のルートの中で完結している。チケットノモリは、行けなくなったチケットを公式リセールでだけ受け付けている。
    action: |
      公式アプリから開いた公式リセールなので、この画面で購入してよい。チケットは公式アプリや公式サイトからたどった正規のルートで買い、SNSの個人間の取引や、検索広告に出てくる転売サイトは使わない。
  references:
    - title: "“推し”に会えない!?転売チケットの購入トラブルが急増中"
      url: "https://www.kokusen.go.jp/news/data/n-20220804_2.html"
