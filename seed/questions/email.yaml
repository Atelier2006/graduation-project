    sender: no-reply@yumemiru.example
    subject: 【ユメミル動画】お支払いができませんでした
    body: |
      いつもユメミル動画をご利用いただき、ありがとうございます。

      10月分の月額料金（990円）を、ご登録のクレジットカードでお支払いいただけませんでした。
      カードの有効期限が切れている可能性があります。

      引き続きご利用いただくには、アプリの「アカウント」画面、またはアカウントページの「お支払い方法」から、お支払い方法を更新してください。
      更新が済むまで、一部の作品をご覧いただけない場合があります。

