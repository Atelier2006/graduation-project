    - target: part:3
      note: 応募も当選の連絡もアプリの「お知らせ」で行い、手数料はかからないと書かれている。ユメミル動画の正規のキャンペーンの方法と同じ。
  explanation:
    why: |
      「プレゼント」「抽選」という言葉で怪しく見えるが、リンクの持ち主は公式の yumemiru.example で、応募も当選の連絡もアプリの「お知らせ」で行い、手数料もかからない。ユメミル動画の正規のキャンペーンの方法と合っているので、本物の広告だ。偽物は、公式に似たアカウントからDMで「当選」を知らせ、手数料やカード情報を求めてくる。
    action: |
      応募するときは、広告からではなく、ユメミル動画のアプリを自分で開いて「お知らせ」から行う。当選のDMが届いても、そのリンクは開かず、アプリの「お知らせ」で確かめる。
